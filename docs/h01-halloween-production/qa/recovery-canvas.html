<!doctype html><meta charset="utf-8"><title>H01 recovery — Canvas QA fixture v1</title>
<style>body{background:#171d28;color:white;font:16px sans-serif}canvas{display:block}</style>
<div id="stage"></div><pre id="status">Loading isolated QA fixture…</pre>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="../../../src/phaser/presentation/HeroV5RuntimeContract.js"></script>
<script src="../../../src/phaser/renderers/HeroRenderer.js"></script>
<script>
(async()=>{
const root=new URL('../../../',location.href),frames=['idle_01','idle_02','idle_03','attack_01','attack_02','attack_03','death_01','death_02'];
const m=await fetch(new URL('r2-upload/manifest.json',root)).then(r=>r.json());
window.ASSETS=m.assets;
const config=m.assets.hero001.v5.g2;
config.equipment.excaliburnt={approval:'approved',frames:Object.fromEntries(frames.map(f=>[f,{sword:`h01-review:hero/v5/g2/weapons/excaliburnt/${f}.png` }]))};
const selections={bare:{},azure:{helmet:'azure',chest:'azure',gloves:'azure',boots:'azure'},azure_no_gloves:{helmet:'azure',chest:'azure',boots:'azure'},leather:{helmet:'leather',chest:'leather',gloves:'leather',boots:'leather'},leather_no_gloves:{helmet:'leather',chest:'leather',boots:'leather'},mixed:{helmet:'skeleton',chest:'leather',gloves:'azure',boots:'robot'},mixed_leather_gloves:{helmet:'azure',chest:'skeleton',gloves:'leather',boots:'azure'}};
const cases=Object.entries(selections).flatMap(([selection,equipment])=>frames.map(frame=>({selection,frame,layers:heroV5FrameLayers(config,frame,{includeHair:true,equipmentSelection:{equipment,bossWeapon:'excaliburnt'}}).map(l=>({...l,url:new URL(l.path.startsWith('h01-review:')?'docs/h01-halloween-production/assets/'+l.path.slice(11):'r2-upload/'+l.path,root).href}))})));
const urls=[...new Set(cases.flatMap(c=>c.layers.map(l=>l.url)))],keys=new Map(urls.map((u,i)=>[u,'qa-'+i])),failures=[];
let renderer,game;
class QA extends Phaser.Scene{
preload(){this.load.on('loaderror',f=>failures.push(f.src));urls.forEach(u=>this.load.image(keys.get(u),u));}
create(){renderer=new HeroRenderer(this,{root:this.add.container(384,684),data:{},displaySize:768,textureKey:u=>keys.get(u)});window.__h01Ready=true;}
}
game=new Phaser.Game({type:Phaser.CANVAS,width:768,height:768,parent:'stage',transparent:true,banner:false,audio:{noAudio:true},scene:QA});
window.__h01Cases=cases.map(({selection,frame})=>({selection,frame}));
window.__h01Render=async i=>{if(!window.__h01Ready)throw Error('not ready');const c=cases[i];renderer.setData({layerFrames:{canvas:{width:768,height:768},idle:[c.layers]}});renderer.applyVisualFrame('idle',0);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const result={selection:c.selection,frame:c.frame,renderer:game.renderer.type,loadFailures:failures,order:renderer.root.list.filter(x=>x.visible).map(x=>renderer.layerImages.find(e=>e.image===x).name),capture:game.canvas.toDataURL('image/png')};document.querySelector('#status').textContent=JSON.stringify({...result,capture:undefined},null,2);return result;};
})().catch(e=>{window.__h01Error=String(e.stack||e);document.querySelector('#status').textContent=window.__h01Error;});
</script>
