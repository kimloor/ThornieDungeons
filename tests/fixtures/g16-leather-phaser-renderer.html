<!doctype html>
<html lang="en">
<head>

<body>
  <div id="stage"></div>

  <script>
    globalThis.SHARED_PHASER_ASSET_RESOLVER = Object.freeze({
      resolve: value => String(value || ""),
      resolveAll: values => Array.from(new Set((values || []).filter(Boolean).map(String))),
      manifest: () => ""
    });
  </script>
  <script src="../../src/phaser/runtime/PhaserRuntime.js"></script>
  <script src="../../src/phaser/presentation/EquipmentVisualResolver.js"></script>
  <script src="../../src/phaser/presentation/HeroV5RuntimeContract.js"></script>
