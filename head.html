<div id="boot-error" role="dialog" aria-modal="true" aria-labelledby="boot-error-title">
  <div id="boot-error-card">
    <div id="boot-error-head">
      <strong id="boot-error-title">⚠ Runtime Error</strong>
      <button id="boot-error-close" type="button" aria-label="Close error" onclick="hideBootError()">×</button>
    </div>
    <pre id="boot-error-text"></pre>
  </div>

<script>
  function hideBootError() {
    var el = document.getElementById('boot-error');
    if (el) el.style.display = 'none';
  }
  function runtimeErrorDetail(kind, message, error, source, line, column) {
    var primary = error && error.message ? error.message : (message || 'Unknown error');
    var detail = kind + ': ' + primary;
    if (source || line || column) detail += '\nSource: ' + (source || 'unknown') + ':' + (line || '?') + ':' + (column || '?');
    if (error && error.stack) detail += '\n\n' + error.stack;
    return detail;
  }
  function showBootError(msg) {
    var overlay = document.getElementById('boot-error');
    var text = document.getElementById('boot-error-text');
    var detail = String(msg || 'Unknown error');
    if (detail.length > 6000) detail = detail.slice(0, 6000) + '\n… (truncated)';
    if (overlay) overlay.style.display = 'flex';
    if (text) {
      text.textContent += (text.textContent ? '\n\n──────────\n\n' : '') + detail;
      text.scrollTop = text.scrollHeight;
    }
    var status = document.getElementById('boot-status');
    if (status) status.textContent = 'Something went wrong loading the game \u2014 see error popup.';
  }
  window.addEventListener('error', function (e) {
    showBootError(runtimeErrorDetail('JS Error', e.message, e.error, e.filename, e.lineno, e.colno));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    showBootError(runtimeErrorDetail('Unhandled Promise Rejection', reason && reason.message ? reason.message : String(reason), reason instanceof Error ? reason : null));
  });
  window.__thornieBootTimer = setTimeout(function () {
    if (typeof React === 'undefined') showBootError('React failed to load from CDN (unpkg.com). Network may be blocking it.');
    else if (typeof ReactDOM === 'undefined') showBootError('ReactDOM failed to load from CDN (unpkg.com).');
    else showBootError('Scripts loaded but the game never rendered. Check for a JS error above.');
  }, 6000);
</script>
