<body>
<div id="root"><div id="boot-status">Loading ThornieDungeons&hellip;</div></div>
<div id="boot-error"></div>

<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    if (el) { el.style.display = 'block'; el.textContent += (el.textContent ? '\n\n' : '') + msg; }
    var status = document.getElementById('boot-status');
    if (status) status.textContent = 'Something went wrong loading the game \u2014 see error below.';
  }
  window.addEventListener('error', function (e) {
    showBootError('JS Error: ' + e.message + '\n  at ' + (e.filename || 'unknown') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Unhandled Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.__thornieBootTimer = setTimeout(function () {
    if (typeof React === 'undefined') showBootError('React failed to load from CDN (unpkg.com). Network may be blocking it.');
    else if (typeof ReactDOM === 'undefined') showBootError('ReactDOM failed to load from CDN (unpkg.com).');
    else showBootError('Scripts loaded but the game never rendered. Check for a JS error above.');
  }, 6000);
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="showBootError('Failed to load React script tag (unpkg.com blocked?)')"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="showBootError('Failed to load ReactDOM script tag (unpkg.com blocked?)')"></script>
