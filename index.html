<body>
<div id="root"><div id="boot-status">Loading ThornieDungeons&hellip;</div></div>
<div id="boot-error"></div>

<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    if (el) { el.style.display = 'block'; el.textContent += (el.textContent ? '\n\n' : '') + msg; }
    var status = document.getElementById('boot-status');
    if (status) status.textContent = 'Something went wrong loading the game \u2014 see error below.';
  }
  window.addEventListener('error', function (e) {
    showBootError('JS Error: ' + e.message + '\n  at ' + (e.filename || 'unknown') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Unhandled Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.__thornieBootTimer = setTimeout(function () {
    if (typeof React === 'undefined') showBootError('React failed to load from CDN (unpkg.com). Network may be blocking it.');
    else if (typeof ReactDOM === 'undefined') showBootError('ReactDOM failed to load from CDN (unpkg.com).');
    else showBootError('Scripts loaded but the game never rendered. Check for a JS error above.');
  }, 6000);
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="showBootError('Failed to load React script tag (unpkg.com blocked?)')"></script>

// ---------- cloud persistence (Google Sheets via Apps Script) ----------
const CONFIG_CACHE_KEY = "thornie-dungeons-cloud-config-v1"; // caches {url,id} only — never the password
const DEFAULT_SERVER_URL = "https://script.google.com/macros/s/AKfycbwdTA8N8KcxVKQtQCRe6p3ry3BS8TGW5HkPJIHHV4vL_F7PPY0kQqaF6MKT79OXDshjbA/exec";
const defaultSave = () => ({
  gold: 0,
  unlockedFloor: 1,
  up: {
    atk: 0,
    def: 0,
    hp: 0,
    mp: 0
  },
  character: {
    level: 1,
    xp: 0,
    growth: {
      atk: 0,
      def: 0,
      hp: 0,
      mp: 0
    }
  }
});
async function loadCachedConfig() {
  try {
    const r = await window.storage.get(CONFIG_CACHE_KEY);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) {}
  return {
    url: "",
    id: ""
  };
}
async function writeCachedConfig(cfg) {
  try {
    await window.storage.set(CONFIG_CACHE_KEY, JSON.stringify(cfg));
  } catch (e) {}
}
async function cloudGet(url, params) {
  try {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(`${url}?${qs}`);
    return await res.json();
  } catch (e) {
    return {
      error: "network_error"
    };
  }
}
async function cloudPost(url, body) {
  try {
    const res = await fetch(url, {
      method: "POST",
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch (e) {
    return {
      error: "network_error"
    };
  }
}
function cloudLogin(url, id, password) {
  return cloudGet(url, {
    action: "login",
    id,
    password
  });
}
function cloudRegister(url, id, password) {
  return cloudPost(url, {
    action: "register",
    id,
    password
  });
}
function cloudSaveProgress(url, id, password, progress) {
  return cloudPost(url, {
    action: "saveProgress",
    id,
    password,
    progress
  });
}
function cloudSyncItems(url, id, password, items) {
  return cloudPost(url, {
    action: "syncItems",
    id,
    password,
    items
  });
}

// progress <-> server row (reuses existing column names: bank_gold now holds `gold`, best_floor now holds `unlockedFloor`)
function progressToServer(save) {
  return {
    bank_gold: save.gold,
    best_floor: save.unlockedFloor,
    up_atk: save.up.atk,
    up_def: save.up.def,
    up_hp: save.up.hp,
    up_mp: save.up.mp,
    char_level: save.character.level,
    char_xp: save.character.xp,
    char_g_atk: save.character.growth.atk,
    char_g_def: save.character.growth.def,
    char_g_hp: save.character.growth.hp,
    char_g_mp: save.character.growth.mp
  };
}
function progressFromServer(row) {
  if (!row) return defaultSave();
  return {
    gold: Number(row.bank_gold) || 0,
    unlockedFloor: Number(row.best_floor) || 1,
    up: {
      atk: Number(row.up_atk) || 0,
      def: Number(row.up_def) || 0,
      hp: Number(row.up_hp) || 0,
      mp: Number(row.up_mp) || 0
    },
    character: {
      level: Number(row.char_level) || 1,
      xp: Number(row.char_xp) || 0,
      growth: {
        atk: Number(row.char_g_atk) || 0,
        def: Number(row.char_g_def) || 0,
        hp: Number(row.char_g_hp) || 0,
        mp: Number(row.char_g_mp) || 0
      }
    }
  };
}
function itemsToServerList(inventory, equipped) {
  const list = [];
  Object.values(equipped).forEach(it => {
    if (it) list.push({
      itemId: it.id,
      slotType: it.type,
      equipped: true,
      rarity: it.rarity,
      name: it.name,
      atk: it.atk,
      def: it.def,
      hp: it.hp,
      mp: it.mp
    });
  });
  inventory.forEach(it => list.push({
    itemId: it.id,
    slotType: it.type,
    equipped: false,
    rarity: it.rarity,
    name: it.name,
    atk: it.atk,
    def: it.def,
    hp: it.hp,
    mp: it.mp
  }));
  return list;
}
function itemsFromServerList(rows) {
  const equipped = emptyEquipped();
  const inventory = [];
  rows.forEach(r => {
    const it = {
      id: r.item_id,
      type: r.slot_type,
      rarity: r.rarity,
      name: r.name,
      atk: Number(r.atk) || 0,
      def: Number(r.def) || 0,
      hp: Number(r.hp) || 0,
      mp: Number(r.mp) || 0
    };
    ["atk", "def", "hp", "mp"].forEach(k => {
      if (!it[k]) delete it[k];
    });
    if (String(r.equipped) === "1" || r.equipped === true) equipped[r.slot_type] = it;else inventory.push(it);
  });
  return {
    equipped,
    inventory
  };
}
