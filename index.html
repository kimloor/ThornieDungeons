// ===== state/persistence.js =====
// Ordered, context-owned persistence for idempotent full-snapshot saves.
// Transactional POSTs (Craft/Raid/Arena/Mail/etc.) intentionally do not enter this queue.
(function (root) {
  const TRANSIENT_ERRORS = new Set(["network_error", "server_error", "timeout"]);

  function makePersistenceContext({ url, accountId, characterId, credential, sessionGeneration }) {
    if (!url || !accountId || !characterId) return null;
    const generation = Number(sessionGeneration) || 0;
    return Object.freeze({
      key: `${String(url)}::${String(accountId)}::${String(characterId)}::${generation}`,
      url,
      accountId: String(accountId),
      characterId: String(characterId),
      credential: Object.freeze({ ...(credential || {}) }),
      sessionGeneration: generation
    });
  }

  function persistenceError(result) {
    if (!result || result.error) {
      const error = new Error(result?.error || "invalid_response");
      error.code = result?.error || "invalid_response";
      error.status = result?.status;
      error.transient = TRANSIENT_ERRORS.has(error.code) || Number(error.status) >= 500;
      return error;
    }
    return null;
  }

  function createPersistenceManager({ onStatusChange, retries = 2, baseDelayMs = 300, delay } = {}) {
    const contexts = new Map();
    const sleep = delay || (ms => new Promise(resolve => setTimeout(resolve, ms)));
    let activeKey = null;
    let globalSequence = 0;

    function stateFor(context) {
      if (!context?.key) throw new Error("Persistence context is required");
      let state = contexts.get(context.key);
      if (!state) {
        state = { context, domains: new Map(), running: false, invalid: false, listeners: [] };
        contexts.set(context.key, state);
      }
      return state;
    }

    function statusOf(state) {
      if (!state || state.invalid) return "saved";
      const slots = Array.from(state.domains.values());
      if (slots.some(slot => slot.failed)) return "failed";
      if (state.running || slots.some(slot => slot.dirty || slot.inFlight)) return "saving";
      return "saved";
    }

    function notify(state) {
      const status = statusOf(state);
      if (state.context.key === activeKey && onStatusChange) {
        const failed = Array.from(state.domains.values()).find(slot => slot.failed);
        onStatusChange(status, { context: state.context, error: failed?.failed || null });
      }
      const listeners = state.listeners.splice(0);
      listeners.forEach(resolve => resolve(status));
    }

    async function executeWithRetry(slot, context, snapshot) {
      let result;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          result = await slot.write(snapshot, context);
        } catch (caught) {
          result = { error: "network_error", cause: caught };
        }
        const error = persistenceError(result);
        if (!error) return result;
        if (!error.transient || attempt === retries) throw error;
        await sleep(baseDelayMs * Math.pow(2, attempt));
      }
      return result;
    }

    async function drain(state) {
      if (state.running || state.invalid) return;
      state.running = true;
      notify(state);
      try {
        while (!state.invalid) {
          if (Array.from(state.domains.values()).some(slot => slot.failed)) break;
          const slot = Array.from(state.domains.values())
            .filter(candidate => candidate.dirty && !candidate.inFlight)
            .sort((a, b) => a.sequence - b.sequence)[0];
          if (!slot) break;
          const sequence = slot.sequence;
          const snapshot = slot.snapshot;
          slot.inFlight = true;
          slot.dirty = false;
          notify(state);
          try {
            await executeWithRetry(slot, state.context, snapshot);
            slot.failed = null;
            if (slot.sequence === sequence) {
              const waiters = slot.waiters.splice(0);
              waiters.forEach(waiter => waiter.resolve(true));
            }
          } catch (error) {
            // A newer full snapshot safely supersedes the failed attempt. Otherwise retain the
            // latest snapshot as dirty/failed until manual Save, reconnect, or a new mutation.
            if (slot.sequence === sequence) slot.failed = error;
          } finally {
            slot.inFlight = false;
            if (slot.sequence !== sequence) slot.dirty = true;
            else if (slot.failed) slot.dirty = true;
            notify(state);
          }
        }
      } finally {
        state.running = false;
        notify(state);
      }
    }

    function enqueue(context, domain, snapshot, write) {
      const state = stateFor(context);
      if (state.invalid) return Promise.resolve(false);
      let slot = state.domains.get(domain);
      if (!slot) {
        slot = { domain, snapshot: null, write, sequence: 0, dirty: false, inFlight: false, failed: null, waiters: [] };
        state.domains.set(domain, slot);
      }
      slot.snapshot = snapshot;
      slot.write = write;
      slot.sequence = ++globalSequence;
      slot.dirty = true;
      slot.failed = null;
      const promise = new Promise((resolve, reject) => slot.waiters.push({ resolve, reject }));
      notify(state);
      void drain(state);
      return promise;
    }

    async function flush(context, { retryFailed = true, transientOnly = true } = {}) {
      if (!context?.key) return false;
      const state = stateFor(context);
      if (state.invalid) return false;
      if (retryFailed) {
        state.domains.forEach(slot => {
          if (slot.failed && (!transientOnly || slot.failed.transient)) {
            slot.failed = null;
            slot.dirty = true;
          }
        });
      }
      void drain(state);
      while (state.running || Array.from(state.domains.values()).some(slot => slot.inFlight)) {
        await new Promise(resolve => state.listeners.push(resolve));
      }
      return statusOf(state) === "saved";
    }

    function setActiveContext(context) {
      activeKey = context?.key || null;
      if (context) notify(stateFor(context));
      else if (onStatusChange) onStatusChange("saved", { context: null, error: null });
    }

    function retry(context) {
      return flush(context, { retryFailed: true });
    }

    function invalidate(context) {
      if (!context?.key) return;
      const state = contexts.get(context.key);
      if (!state) return;
      state.invalid = true;
      state.domains.forEach(slot => {
        const waiters = slot.waiters.splice(0);
        waiters.forEach(waiter => waiter.resolve(false));
      });
      if (activeKey === context.key) setActiveContext(null);
      notify(state);
    }

    return { enqueue, flush, retry, invalidate, setActiveContext, status: context => statusOf(contexts.get(context?.key)) };
  }

  root.makePersistenceContext = makePersistenceContext;
  root.createPersistenceManager = createPersistenceManager;
  root.persistenceError = persistenceError;
  if (typeof module !== "undefined" && module.exports) {
    module.exports = { makePersistenceContext, createPersistenceManager, persistenceError };
  }
})(typeof globalThis !== "undefined" ? globalThis : this);

// ===== data/gameConfig.js =====
// Applies a fetched game-balance config on top of the hardcoded defaults below.
// Every field is validated defensively — a partial or malformed sheet should never crash the game;
// missing/invalid pieces just keep their current (default) values.
function applyGameConfig(cfg) {
  if (!cfg || cfg.error) return;
  try {
    if (Array.isArray(cfg.monsters) && cfg.monsters.length) {
      const normal = cfg.monsters.filter(m => !m.isBoss).map(monsterFromConfig);
      const bosses = cfg.monsters.filter(m => m.isBoss).map(monsterFromConfig);
      if (normal.length) ENEMY_POOL = normal;
      if (bosses.length) BOSS_POOL = bosses;
    }
  } catch (e) {}
  try {
    const n = cfg.equipmentNames;
    if (n && Array.isArray(n.weapon) && n.weapon.length) WEAPON_NAMES = n.weapon;
    if (n && Array.isArray(n.helmet) && n.helmet.length) HELMET_NAMES = n.helmet;
    if (n && Array.isArray(n.chest) && n.chest.length) CHEST_NAMES = n.chest;
    if (n && Array.isArray(n.gloves) && n.gloves.length) GLOVES_NAMES = n.gloves;
    if (n && Array.isArray(n.boots) && n.boots.length) BOOTS_NAMES = n.boots;
    if (n && Array.isArray(n.accessory) && n.accessory.length) ACCESSORY_NAMES = n.accessory;
  } catch (e) {}
  try {
    const rm = cfg.rarityMult;
    if (rm && typeof rm.rare === "number" && typeof rm.unique === "number" && typeof rm.elite === "number") {
      RARITY_MULT = {
        rare: rm.rare,
        unique: rm.unique,
        elite: rm.elite,
        mythic: typeof rm.mythic === "number" ? rm.mythic : RARITY_MULT.mythic,
        azure: typeof rm.azure === "number" ? rm.azure : RARITY_MULT.azure
      };
    }
  } catch (e) {}
  try {
    // Pre-V2 remote rows contain the retired 5-star/Thunder Cub balance. Do not
    // let that legacy config silently replace the Battle V1 Pet contract.
    if (Number(cfg.petSystemVersion) >= 2 && Array.isArray(cfg.pets) && cfg.pets.length) {
      const roleById = Object.fromEntries((PET_POOL || []).map(p => [p.id, p.role]));
      const valid = cfg.pets
        .filter(p => p && p.id && p.rarity && p.active && p.active.type)
        .map(p => ({ ...p, role: p.role || roleById[p.id] || "attack" }));
      if (valid.length) PET_POOL = valid;
    }
  } catch (e) {}
  try {
    if (Array.isArray(cfg.skills) && cfg.skills.length) {
      const valid = cfg.skills.filter(s => s && s.key && s.type);
      if (valid.length) SKILLS = valid.sort((a, b) => a.unlockLevel - b.unlockLevel);
    }
  } catch (e) {}
}
// Slugify fallback for a monster that's genuinely new (added via remote config with no
// matching static entry and no explicit id supplied) — should rarely trigger in practice
// since real monster ids should always be assigned explicitly going forward.
function slugifyMonsterName(name) {
  return String(name || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "unknown_monster";
}
// BUG FIX (prerequisite for per-monster loot tables): this used to drop `id` entirely, so
// ANY monster overridden via remote config silently lost its stable identity — harmless
// while nothing read monster.id besides makeEnemy's display/uid, but fatal once loot
// tables need to join on it. Preference order: explicit `m.id` from config > matching
// static ENEMY_POOL/BOSS_POOL entry by name (covers today's config, which only overrides
// name/color/mults) > slugified name as a last resort so id is never undefined.
function monsterFromConfig(m) {
  const staticMatch = (ENEMY_POOL || []).find(s => s.name === m.name) || (BOSS_POOL || []).find(s => s.name === m.name);
  return {
    id: m.id || (staticMatch && staticMatch.id) || slugifyMonsterName(m.name),
    name: m.name,
    color: m.color || "#7ED9A8",
    sizeClass: ["small", "medium", "large"].includes(m.sizeClass) ? m.sizeClass : staticMatch?.sizeClass || "medium",
    anchorType: m.anchorType === "flying" ? "flying" : staticMatch?.anchorType || "ground",
    hpMult: typeof m.hpMult === "number" ? m.hpMult : 1,
    atkMult: typeof m.atkMult === "number" ? m.atkMult : 1,
    defBonus: typeof m.defBonus === "number" ? m.defBonus : 0,
    goldMult: typeof m.goldMult === "number" ? m.goldMult : 1,
    xpMult: typeof m.xpMult === "number" ? m.xpMult : 1

}

// ---------- character progress <-> server (schema v2: real per-character rows) ----------
// Maps the flat "runtime save" (see save.js) into the field names
// handleSaveCharacterProgress on the server expects — a plain, mostly 1:1 mapping now that
// each character has its own real columns server-side, instead of the old JSON-blob-inside-a-
// single-shared-row trick that turned out to silently drop data (the server's fixed column
// list never even included that blob's column).
function characterProgressToServer(flatSave) {
  return {
    level: flatSave.character.level,
    xp: flatSave.character.xp,
    stat_points: flatSave.character.statPoints,
    str: flatSave.character.stats.str,
    vit: flatSave.character.stats.vit,
    agi: flatSave.character.stats.agi,
    dex: flatSave.character.stats.dex,
    luk: flatSave.character.stats.luk,
    gold: flatSave.gold,
    unlocked_floor: flatSave.unlockedFloor,
    potions: flatSave.potions,
    protection_stones: flatSave.protectionStones,
    chest_pity: flatSave.chestPity,
    // Skill progression shares this existing per-character JSON envelope so it remains cloud
    // persistent without a production D1 schema migration.
    pets_json: JSON.stringify({
      list: flatSave.pets || [],
      dup: flatSave.petDuplicates || {},
      skills: flatSave.character.skillLevels || {},
      skillVersion: 1,
      skillResetPoints: Number(flatSave.character.skillResetPoints) || 0
    }),
    active_pet_id: flatSave.activePetId || ""
  };
}

// ---------- items <-> server ----------
// No characterId tagging needed here anymore — syncItems takes characterId as its own
// authenticated top-level parameter (see App.js's pushItems), and the server stamps every row
// with THAT value server-side rather than trusting anything the client puts in extra_json. This
// is what makes it structurally impossible for syncing one character's inventory to touch
// another's: the server's delete-stale-rows query is scoped by character_id, not just player_id.
function itemsToServerList(inventory, equipped, overflow = []) {
  const list = [];
  const pack = (it, equippedFlag) => ({
    itemId: it.id,
    slotType: it.type,
    equipped: equippedFlag,
    rarity: it.rarity,
    name: it.name,
    atk: it.atk,
    def: it.def,
    hp: it.hp,
    mp: it.mp,
    itemLevel: it.level || it.itemLevel || 0,
    enhanceLevel: it.enhanceLevel || 0,
    // dodgeChance/critChance/critDamage (accessory base rolls) and junk/potion stack data
    // (junkId/potionId/quantity/icon) don't have their own server columns, so they ride along
    // inside the extra JSON blob instead (this part is unaffected by the schema-v2 change — the
    // items table's extra_json column was always real, unlike progress.materials_json).
    extra: {
      empowerSlots: it.empowerSlots || [],
      dodgeChance: it.dodgeChance || undefined,
      critChance: it.critChance || undefined,
      critDamage: it.critDamage || undefined,
      junkId: it.junkId || undefined,
      potionId: it.potionId || undefined,
      quantity: it.quantity || undefined,
      icon: it.icon || undefined,
      setId: it.setId || undefined,
      star: it.star || undefined,
      craftRecipeId: it.craftRecipeId || undefined,
      favorite: it.favorite === true || undefined,
      overflow: it.overflow === true || undefined
    }
  });
  Object.values(equipped).forEach(it => {
    if (it) list.push(pack(it, true));
  });
  inventory.forEach(it => list.push(pack(it, false)));
  overflow.forEach(it => list.push(pack({ ...it, overflow: true }, false)));
  return list;
}
function itemsFromServerList(rows) {
  const equipped = emptyEquipped();
  const inventory = [];
  const overflow = [];
  if (!Array.isArray(rows)) return {
    equipped,
    inventory,
    overflow
  };
  rows.forEach(r => {
    // A single malformed row (bad JSON, unexpected type, etc) should never take down the whole
    // inventory load — skip just that row and keep processing the rest.
    try {
      const extra = safeJsonParse(r.extra_json, {});
      if (r.slot_type === "junk") {
        (extra.overflow ? overflow : inventory).push({
          id: r.item_id,
          type: "junk",
          junkId: extra.junkId,
          name: r.name,
          icon: extra.icon || (JUNK_INFO[extra.junkId] || {}).icon || "📦",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1),
          favorite: extra.favorite === true
        });
        return;
      }
      if (r.slot_type === "potion") {
        const def = getPotionDef(extra.potionId);
        (extra.overflow ? overflow : inventory).push({
          id: r.item_id,
          type: "potion",
          potionId: extra.potionId,
          name: r.name || (def && def.name) || "Potion",
          icon: extra.icon || (def && def.icon) || "🧪",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1),
          favorite: extra.favorite === true
        });
        return;
      }
      const it = {
        id: r.item_id,
        type: r.slot_type,
        rarity: r.rarity,
        name: r.name,
        atk: numOr(r.atk, 0),
        def: numOr(r.def, 0),
        hp: numOr(r.hp, 0),
        mp: numOr(r.mp, 0),
        dodgeChance: numOr(extra.dodgeChance, 0),
        critChance: numOr(extra.critChance, 0),
        critDamage: numOr(extra.critDamage, 0),
        enhanceLevel: numOr(r.enhance_level, 0),
        level: numOr(r.item_level, 0),
        favorite: extra.favorite === true,
        empowerSlots: Array.isArray(extra.empowerSlots) ? extra.empowerSlots : Array(RARITY_STARS[r.rarity] || 1).fill(null)
      };
      if (extra.setId) it.setId = extra.setId;
      if (extra.star) it.star = numOr(extra.star, 0);
      if (extra.craftRecipeId) it.craftRecipeId = extra.craftRecipeId;
      ["atk", "def", "hp", "mp", "dodgeChance", "critChance", "critDamage"].forEach(k => {
        if (!it[k]) delete it[k];
      });
      if (String(r.equipped) === "1" || r.equipped === true) equipped[r.slot_type] = it;
      else if (extra.overflow) overflow.push(it);
      else inventory.push(it);
    } catch (e) {
      console.warn("[ThornieDungeons] Skipped a corrupted item row:", e);
    }
  });
  return {
    equipped,
    inventory,
    overflow
  };
}

function unlockedSkills(level) {

}

// Existing characters receive their full budget from their current level. Only committed
// levels are stored; a missing entry is Lv.1, so old saves migrate without a data rewrite.
function totalSkillPointBudget(level) {
  return Math.max(0, Math.floor((Number(level) || 0) / 5));
}
function committedSkillLevel(save, skillKey) {
  const raw = save?.character?.skillLevels?.[skillKey];
  return Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(raw) || 1)));
}
function spentSkillPoints(save) {
  return Object.keys(save?.character?.skillLevels || {}).reduce((sum, key) => {
    return sum + Math.max(0, committedSkillLevel(save, key) - 1);
  }, 0);
}
function remainingSkillPoints(save) {
  return Math.max(0, totalSkillPointBudget(save?.character?.level) - spentSkillPoints(save));
}
function skillAtLevel(skill, level) {
  const lv = Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(level) || 1)));
  const bonusLevels = lv - 1;
  const next = { ...skill, skillLevel: lv };
  if (Number.isFinite(skill.mult)) next.mult = roundTo(skill.mult * (1 + bonusLevels * 0.08), 2);
  if (Number.isFinite(skill.healPct)) next.healPct = roundTo(skill.healPct + bonusLevels * 0.03, 2);
  return next;
}

      log(state, "survive", "Thorned Aegis prevented lethal damage", { targetId: target.id });
      if (rank(target, "thorned_aegis") >= 3 && priorAegis === 3) {
        performCounter(state, target, actor, context); resources.aegis = 0;
      } else if (rank(target, "thorned_aegis") >= 4 && priorAegis < 3 && living(actor)) {
        performCounter(state, target, actor, context);
      }
    }
    if (target.kind === "hero" && target.hp > 0 && amount > 0) {
      const secondWind = skillData(target, "second_wind");
      if (secondWind && hpPct(target) <= 40 && !target.flags.secondWindUsed) {
        heal(state, target, target.maxHp * pct(secondWind.healMaxHpPct), target, "Second Wind");
        target.flags.secondWindUsed = true;
      }
      const lastStand = directHit ? skillData(target, "last_stand") : null;
      if (lastStand && hpPct(target) <= 40 && !(target.flags.lastStandCooldown > 0) && chance(state, lastStand.chance)) {
        target.statuses.def_up = { key: "def_up", duration: 2, harmful: false };
        target.flags.lastStandCooldown = lastStand.internalCooldown;
        log(state, "status", "Last Stand granted DEF Up", { targetId: target.id });
      }
    }
    if (amount) {
      const dealt = before - target.hp;
      const text = context.direct
        ? `${unitName(actor)} ${context.actionName === "basic attack" || context.actionName === "counter attack" ? context.actionName : `use ${context.actionName || "skill"}`} to ${unitName(target)} damage ${dealt}.`
        : `${unitName(target)} took ${dealt}.`;
      log(state, "damage", text, { actorId: actor.id, targetId: target.id, amount: dealt, crit: !!context.crit, actionName: context.actionName || null });
    }
    if (directHit && target.kind === "hero" && actor.side !== target.side && before > target.hp && !context.indirect) {
      const survival = skillData(target, "survival_instinct");
      if (survival && living(actor)) {
        const playtest = root.HERO_SKILL_V1_PLAYTEST || (typeof HERO_SKILL_V1_PLAYTEST !== "undefined" ? HERO_SKILL_V1_PLAYTEST : {});
        const reflectCap = target.maxHp * pct(Number(playtest.survivalReflectCapMaxHpPct) || 10);
        const reflected = Math.max(1, Math.round(Math.min((before - target.hp) * pct(survival.reflectPct), reflectCap)));
        receiveDamage(state, target, actor, reflected, { ...context, indirect: true });
        log(state, "reflect", `Reflected ${reflected} damage`, { actorId: target.id, targetId: actor.id });
      }
    }
    markDead(state, target);
    return before - target.hp;
  }

  function attackHit(state, actor, target, spec, actionContext) {
    if (!living(actor) || !living(target)) return { hit: false, damage: 0 };
    if (!chance(state, clamp(actor.accuracy - target.dodge, 5, 99))) {
      log(state, "miss", `${unitName(actor)} missed.`, { actorId: actor.id, targetId: target.id, actionName: attackActionName(spec, actionContext) });
      return { hit: false, damage: 0 };
    }
    // Proc rolls must be known before damage for Boss conversion, but a newly
    // applied Armor Break affects subsequent hits/actions rather than the hit
    // that created it. Snapshot DEF before applying this hit's statuses.
    const targetDefAtHitStart = effectiveDef(target);
    const conversions = [];
    for (const statusSpec of spec.statuses || []) {
      const result = applyStatus(state, actor, target, statusSpec.key, statusSpec, { ...actionContext, active: spec.actionType === "active", fixed: !!statusSpec.fixed });
      if (result.converted) conversions.push(result.converted);
      if (result.applied) actionContext.debuffApplied = actionContext.debuffApplied || HARMFUL.has(statusSpec.key);
    }
    let critChance = actor.crit + (Number(spec.critBonus) || 0);
    if (actor.kind === "hero") {
      const killer = skillData(actor, "killer_instinct"); if (killer && hpPct(target) < 50) critChance += killer.critPct;
      const bloodlust = skillData(actor, "bloodlust"); if (bloodlust && hpPct(actor) <= 40) critChance += bloodlust.critPct || 0;
      if (status(actor, "rampage")) critChance += Number(status(actor, "rampage").critPct) || 0;
    }
    if (target.kind === "hero") critChance -= resourcesFor(state, target).aegis * 5;
    const crit = conversions.includes("critical") || !!spec.guaranteedCrit || chance(state, critChance);
    const pierce = Math.max(Number(spec.defPierce) || 0, conversions.includes("armor_pierce") ? 0.3 : 0);
    const attackPower = actor.atk * (Number(spec.mult) || 1) * activeBuffDamageMultiplier(actor) * heroPassiveDamageMultiplier(state, actor, target);
    const critMult = crit ? actor.critDamage + pct(Number(spec.critDamageBonus) || 0) + pct((skillData(actor, "critical_mastery") || {}).critDamagePct || 0) : 1;
    const damage = Math.max(1, Math.round((attackPower - targetDefAtHitStart * (1 - pierce)) * critMult));
    const dealt = receiveDamage(state, actor, target, damage, { ...actionContext, actionName: attackActionName(spec, actionContext), crit, direct: true });
    actionContext.totalDamage += dealt;
    actionContext.hitAny = true;
    if (target.kind === "hero" && dealt > 0) {
      actionContext.heroStruck = true;
      actionContext.struckHeroIds.add(target.id);
    }
    if (target.dead) actionContext.killed = true;
    return { hit: true, crit, damage: dealt };
  }

  function basicTarget(state, actor, requestedId) {
    const targets = opposingUnits(state, actor);
    const requested = requestedId && state.units[requestedId];
    if (living(requested) && requested.side !== actor.side) return requested;
    return targets.sort((a, b) => a.hp - b.hp || a.tieOrder - b.tieOrder)[0] || null;
  }
  function tickCooldowns(unit, justUsedId) {
    for (const key of Object.keys(unit.cooldowns)) if (key !== justUsedId) unit.cooldowns[key] = Math.max(0, Number(unit.cooldowns[key]) - 1);
  }
  function tickStatuses(unit, appliedStatuses) {
    for (const [key, value] of Object.entries(unit.statuses || {})) {
      if (key === "poison" || appliedStatuses.has(`${unit.id}:${key}`)) continue;
      value.duration -= 1;
      if (value.duration <= 0) delete unit.statuses[key];
    }
  }
  function reduceOneCooldown(unit, excludedId, state) {
    const candidates = Object.entries(unit.cooldowns).filter(([id, cd]) => id !== excludedId && Number(cd) > 0);
    if (!candidates.length) return false;
    const selected = state ? choose(state, candidates) : candidates.sort((a, b) => Number(b[1]) - Number(a[1]) || a[0].localeCompare(b[0]))[0];
    unit.cooldowns[selected[0]] -= 1;
    return true;
  }
  function reduceAllCooldowns(unit, excludedId) {
    let changed = false;
    for (const [id, cooldown] of Object.entries(unit.cooldowns)) {
      if (id !== excludedId && Number(cooldown) > 0) { unit.cooldowns[id] -= 1; changed = true; }
    }
    return changed;
  }

  function performCounter(state, hero, enemy, actionContext) {
    if (!living(hero) || !living(enemy)) return;
    const data = skillData(hero, "counter") || { counterMult: 1 };
    const statuses = data.armorBreakChance ? [{ key: "armor_break", chance: data.armorBreakChance, duration: 2 }] : [];
    const result = attackHit(state, hero, enemy, { mult: data.counterMult, actionType: "counter", statuses }, actionContext);
    if (rank(hero, "thorned_aegis") >= 5 && result.hit) {
      const playtest = root.HERO_SKILL_V1_PLAYTEST || (typeof HERO_SKILL_V1_PLAYTEST !== "undefined" ? HERO_SKILL_V1_PLAYTEST : {});
      const stun = applyStatus(state, hero, enemy, "stun", { chance: Number(playtest.aegisCounterStunChance) || 35, duration: 1 }, actionContext);
      if (stun.applied) {
        const resources = resourcesFor(state, hero);
        resources.aegis = Math.max(0, resources.aegis - 1);
      }
    }
    log(state, "counter", "Hero countered", { actorId: hero.id, targetId: enemy.id });
  }

  function heroActiveSpec(state, actor, id) {
    const data = skillData(actor, id);
    if (!data) return null;
    const base = { id, actionType: "active", mult: data.mult || 0, hits: data.hits || 1, statuses: [], ...data };
    if (id === "heavy_blow") base.statuses.push({ key: "armor_break", chance: data.armorBreakChance, duration: 2 });
    if (id === "toxic_strike") base.statuses.push({ key: "poison", chance: data.poisonChance, duration: 3 + ((skillData(actor, "toxic_mastery") || {}).durationBonus || 0), damage: Math.max(1, Math.round(actor.atk * 0.2 * (1 + pct((skillData(actor, "toxic_mastery") || {}).poisonDamagePct || 0)))) });
    if (id === "stunning_blow") base.statuses.push({ key: "stun", chance: data.stunChance, duration: 1 });
    if (id === "silent_edge") base.statuses.push({ key: "silence", chance: data.silenceChance, duration: 2 });
    if (id === "guard") base.statuses = [];
    return base;
  }

  function consumeScheme(state, actor, target, context) {
    const resources = resourcesFor(state, actor);
    if (rank(actor, "usurper") < 3 || resources.scheme < 3) return false;
    const buffKey = Object.keys(target.statuses || {}).find(key => !HARMFUL.has(key) && !STEALABLE_BLOCKLIST.has(key) && target.statuses[key].stealable !== false);
    if (buffKey) {
      actor.statuses[buffKey] = copy(target.statuses[buffKey]); delete target.statuses[buffKey];
      log(state, "scheme", `Stole ${buffKey}`, { actorId: actor.id, targetId: target.id });
    } else {
      const extendable = Object.keys(target.statuses || {}).filter(key => HARMFUL.has(key) && key !== "stun");
      const key = choose(state, extendable);
      if (!key) return false;
      target.statuses[key].duration += 1;
      log(state, "scheme", `Extended ${key}`, { actorId: actor.id, targetId: target.id });
    }
    resources.scheme -= 1; resources.schemeConsumed += 1;
    context.schemeConsumed = true;
    if (rank(actor, "usurper") >= 4) resources.nextActiveDebuffBonus = 10;
    if (rank(actor, "usurper") >= 5 && resources.schemeConsumed >= 3) {
      if (!context.cdrUsed && reduceAllCooldowns(actor, context.usedSkillId)) context.cdrUsed = true;
      resources.schemeConsumed = 0;
    }
    return true;
  }

  function resolveHeroAction(state, actor, command, context) {
    const resources = resourcesFor(state, actor);
    const type = command.type || "basic";
    if (type === "flee") {
      if (!state.rules.allowFlee) { log(state, "flee", "Flee is not allowed"); return; }
      if (chance(state, Math.min(99, 50 + (Number(actor.agi) || 0) * 0.5))) { state.flags.fled = true; state.result = "fled"; log(state, "flee", "Escaped successfully"); }
      else log(state, "flee", "Escape Failed!");
      return;
    }
    if (type === "potion") {
      if ((Number(command.count) || 0) <= 0) { log(state, "invalid", "No potion available"); return; }
      heal(state, actor, Number(command.heal) || actor.maxHp * 0.35, actor, "Potion");
      if (command.restoreSp) restoreSp(state, actor, Number(command.restoreSp), actor, "Potion SP");
      context.consumePotion = true; return;
    }
    const target = basicTarget(state, actor, command.targetId || state.selectedTargetIds?.[actor.side] || state.selectedTargetId);
    if (!target) return;
    context.targetHadDebuff = hasDebuff(target);
    if (type === "active") {
      const id = command.skillId;
      const spec = heroActiveSpec(state, actor, id);
      if (!spec || !actor.activeSkills.includes(id) || (actor.cooldowns[id] || 0) > 0 || status(actor, "silence")) { log(state, "invalid", "Active skill unavailable"); return; }
      const efficiency = skillData(actor, "skill_efficiency");
      const cost = Math.max(0, Math.ceil(spec.sp * (1 - pct(efficiency ? efficiency.spReductionPct : 0))));
      if (actor.sp < cost) { log(state, "invalid", "Not enough SP"); return; }
      actor.sp -= cost; context.usedSkillId = id; context.wasActive = true;
      context.attackAction = Number(spec.mult) > 0;
      const schemeEligible = context.attackAction || id === "disruption";
      context.activeDebuffBonus = schemeEligible ? resources.nextActiveDebuffBonus : 0;
      if (schemeEligible) resources.nextActiveDebuffBonus = 0;
      if (id === "rampage") { actor.statuses.rampage = { key: "rampage", duration: spec.duration, damagePct: spec.damagePct, critPct: spec.critPct || 0, takenPct: spec.takenPct, stealable: false }; context.appliedStatuses.add(`${actor.id}:rampage`); }
      else if (id === "shield_wall") {
        actor.statuses.shield_wall = { key: "shield_wall", duration: spec.duration, damagePenaltyPct: spec.damagePenaltyPct, stealable: false };
        actor.statuses.def_up = { key: "def_up", duration: spec.duration, harmful: false };
        context.appliedStatuses.add(`${actor.id}:shield_wall`); context.appliedStatuses.add(`${actor.id}:def_up`);
      }
      else if (id === "fortress") { actor.statuses.fortress = { key: "fortress", duration: spec.duration, defPct: spec.defPct, damagePenaltyPct: spec.damagePenaltyPct, stealable: false }; context.appliedStatuses.add(`${actor.id}:fortress`); }
      else if (id === "counter") { actor.statuses.counter = { key: "counter", duration: 1, counterMult: spec.counterMult, stealable: false }; context.appliedStatuses.add(`${actor.id}:counter`); }
      else if (id === "disruption") {
        const pool = ["poison", "armor_break", "silence", "stun"];
        const picked = [];
        while (picked.length < spec.count && pool.length) {
          const key = chooseWeighted(state, pool, candidate => candidate === "stun" && spec.count < 4 ? spec.stunWeight : 1);
          picked.push(key); pool.splice(pool.indexOf(key), 1);
        }
        for (const key of picked) {
          const applied = applyStatus(state, actor, target, key, { chance: spec.procChance, duration: key === "stun" ? 1 : key === "armor_break" ? 2 : 3, damage: key === "poison" ? Math.round(actor.atk * 0.2) : undefined }, { ...context, active: true });
          if (applied.applied) context.debuffApplied = true;
        }
      } else {
        const distributedTargets = id === "blade_storm"
          ? [target, ...opposingUnits(state, actor).filter(unit => unit.id !== target.id)]
          : [target];
        for (let hit = 0; hit < spec.hits; hit++) {
          let hitTarget = distributedTargets[hit % distributedTargets.length];
          if (!living(hitTarget)) hitTarget = distributedTargets.find(living) || basicTarget(state, actor, null);
          if (!hitTarget) break;
          const hitSpec = { ...spec, statuses: spec.statuses.slice() };
          if (hit === 0 && rank(actor, "relentless_fury") >= 3 && resources.fury === 3) hitSpec.statuses.push({ key: "stun", chance: 5, duration: 1, fixed: true });
          if (id === "blade_storm" && spec.stunChancePerHit) hitSpec.statuses.push({ key: "stun", chance: spec.stunChancePerHit, duration: 1, fixed: true });
          attackHit(state, actor, hitTarget, hitSpec, context);
        }
        if (id === "guard") { actor.statuses.def_up = { key: "def_up", duration: spec.duration, harmful: false }; context.appliedStatuses.add(`${actor.id}:def_up`); }
      }
      actor.cooldowns[id] = Number(spec.cooldown) || 0;
      if (schemeEligible) consumeScheme(state, actor, target, context);
    } else {
      context.attackAction = true;
      const statuses = rank(actor, "relentless_fury") >= 3 && resources.fury === 3 ? [{ key: "stun", chance: 5, duration: 1, fixed: true }] : [];
      const hit = attackHit(state, actor, target, { mult: 1, actionType: "basic", statuses }, context);
      const drain = skillData(actor, "life_drain");
      if (hit.damage && drain) heal(state, actor, Math.min(hit.damage * pct(drain.drainPct), actor.maxHp * 0.10), actor, "Life Drain");
      const spirit = skillData(actor, "spirit_drain"); if (hit.hit && spirit) restoreSp(state, actor, spirit.spRestore, actor, "Spirit Drain");
    }
    if (context.attackAction) {
      const furyRank = rank(actor, "relentless_fury"); if (furyRank) resources.fury = Math.min(3, resources.fury + 1);
      const quick = skillData(actor, "quick_recovery");
      if (quick && context.targetHadDebuff && !context.cdrUsed && chance(state, quick.chance + (rank(actor, "usurper") >= 2 ? resources.scheme * 2 : 0)) && reduceOneCooldown(actor, context.usedSkillId, state)) context.cdrUsed = true;
    }
    if (context.debuffApplied && rank(actor, "usurper")) resources.scheme = Math.min(3, resources.scheme + 1);
    const tactician = skillData(actor, "master_tactician");
    if (tactician && context.targetHadDebuff && chance(state, tactician.chance)) {
      const extendable = Object.keys(target.statuses || {}).filter(key => HARMFUL.has(key) && key !== "stun");
      const key = choose(state, extendable);
      if (key) { target.statuses[key].duration += 1; log(state, "status", `Master Tactician extended ${key}`, { actorId: actor.id, targetId: target.id }); }
    }
    if (context.killed && rank(actor, "relentless_fury") >= 5 && resources.fury > 0 && !context.cdrUsed && reduceOneCooldown(actor, context.usedSkillId, state)) { resources.fury -= 1; context.cdrUsed = true; }
  }

  function resolvePetAction(state, actor, context) {
    const hero = heroForSide(state, actor.side);
    const target = basicTarget(state, actor, state.selectedTargetIds?.[actor.side] || state.selectedTargetId);
    if (!target) return;
    const { active } = petSkillData(actor);
    const activeReady = (actor.cooldowns.pet_active || 0) === 0;
    const activeName = active.name || "Pet Active";
    const isSupport = active.type === "regen" || active.type === "groupHeal";
    const needsHeal = living(hero) && (hpPct(hero) <= 60 || (active.type === "groupHeal" && hpPct(actor) <= 60));
    if (isSupport && activeReady && needsHeal) {
      log(state, "pet_active", `${unitName(actor)} use ${activeName}.`, { actorId: actor.id, skillName: activeName });
      const amount = actor.maxHp * (Number(active.healPetHpPct) || 0) + (Number(actor.vit) || 0) * (Number(active.vitScale) || 0);
      if (active.type === "regen") hero.statuses.pet_regrowth = { key: "pet_regrowth", duration: Math.max(1, Number(active.regenTurns) || 1), heal: Math.round(amount), sourceId: actor.id, stealable: false };
      else { heal(state, hero, amount, actor, "Moonlight Heal"); heal(state, actor, amount, actor, "Moonlight Heal"); }
      actor.cooldowns.pet_active = Number(active.cooldown) || 0; context.usedSkillId = "pet_active"; return;
    }
    if (!activeReady) { attackHit(state, actor, target, { mult: 1, actionType: "basic", statuses: [] }, context); return; }
    if (active.type !== "damage" && active.type !== "aoe") { attackHit(state, actor, target, { mult: 1, actionType: "basic", statuses: [] }, context); return; }
    const spec = { mult: Number(active.mult) || 1, actionType: "active", actionName: activeName, statuses: [] };
    if (active.stunChance) spec.statuses.push({ key: "stun", chance: chancePercent(active.stunChance), duration: 1 });
    if (active.armorBreakChance) spec.statuses.push({ key: "armor_break", chance: chancePercent(active.armorBreakChance), duration: 2 });
    if (active.poisonChance) spec.statuses.push({ key: "poison", chance: chancePercent(active.poisonChance), duration: Math.max(1, Number(active.poisonTurns) || 1), damage: Math.round(actor.atk * (Number(active.poisonPct) || 0)) });
    if (active.silenceChance) spec.statuses.push({ key: "silence", chance: chancePercent(active.silenceChance), duration: 2 });
    const targets = active.type === "aoe" ? opposingUnits(state, actor).slice(0, 3) : [target];
    log(state, "pet_active", `${unitName(actor)} use ${activeName}.`, { actorId: actor.id, skillName: activeName });
    targets.forEach(unit => attackHit(state, actor, unit, spec, context));
    if (living(hero) && active.defUpChance && chance(state, chancePercent(active.defUpChance))) applyStatus(state, actor, hero, "def_up", { chance: 100, duration: Math.max(1, Number(active.defUpTurns) || 1) }, context);
    actor.cooldowns.pet_active = Number(active.cooldown) || 0; context.usedSkillId = "pet_active";
  }

  function resolveEnemyAction(state, actor, context) {
    const targets = opposingUnits(state, actor);
    if (!targets.length) return;
    const target = choose(state, targets);
    const hits = Math.max(1, Math.floor(Number(actor.ai.hits) || 1));
    for (let hit = 0; hit < hits && living(target); hit++) attackHit(state, actor, target, { mult: Number(actor.ai.mult) || 1, actionType: "enemy", statuses: actor.ai.statuses || [] }, context);
  }

  function startEffects(state, actor, context) {
    const poison = status(actor, "poison");
    if (poison) {
      const source = state.units[poison.sourceId] || { id: poison.sourceId || "poison", side: state.teamIds.find(side => side !== actor.side) };
      receiveDamage(state, source, actor, poison.damage, context);
      poison.duration -= 1; if (poison.duration <= 0) delete actor.statuses.poison;
    }
    const regen = status(actor, "pet_regrowth"); if (regen) heal(state, actor, regen.heal, state.units[regen.sourceId], "Regrowth");
  }

  function resolveHeroReactionsAfterAction(state, actor, context) {
    for (const heroId of context.struckHeroIds) {
      const hero = state.units[heroId];
      if (!living(hero) || hero.side === actor.side) continue;
      if (status(hero, "counter") && living(actor)) { performCounter(state, hero, actor, context); delete hero.statuses.counter; }
      if (!rank(hero, "thorned_aegis")) continue;
      hero.flags.hitSinceLastHeroAction = true;
      if (status(hero, "def_up")) {
        const resources = resourcesFor(state, hero);
        const before = resources.aegis; resources.aegis = Math.min(3, before + 1);
        if (rank(hero, "thorned_aegis") >= 4 && before < 3 && resources.aegis === 3 && living(actor)) performCounter(state, hero, actor, context);
      }
    }
  }

  function checkBattleEnd(state) {
    const aliveSides = state.teamIds.filter(side => livingTeamUnits(state, side).length);
    if (aliveSides.length > 1) return;
    state.winnerSide = aliveSides[0] || null;
    state.result = state.winnerSide === state.controlledSide ? "victory" : "defeat";
    state.flags.auto = false;
    const hero = heroForSide(state, state.controlledSide);
    const pet = petForSide(state, state.controlledSide);
    if (state.mode === "dungeon" && !living(hero) && living(pet) && state.result === "victory") state.flags.heroReviveNextFloor = true;
    resetBattleResources(state);
    log(state, "battle_end", state.result === "victory" ? "Victory" : "Defeat");
  }

  function validateHeroCommand(state, actor, command) {
    const type = command && command.type || "basic";
    if (type === "basic") return null;
    if (type === "potion") return (Number(command.count) || 0) > 0 ? null : "No potion available";
    if (type === "flee") return state.rules.allowFlee ? null : "Flee is not allowed";
    if (type !== "active") return "Unknown Hero action";
    const id = command.skillId;
    const spec = heroActiveSpec(state, actor, id);
    if (!spec || !actor.activeSkills.includes(id) || (actor.cooldowns[id] || 0) > 0 || status(actor, "silence")) return "Active skill unavailable";
    const efficiency = skillData(actor, "skill_efficiency");
    const cost = Math.max(0, Math.ceil(spec.sp * (1 - pct(efficiency ? efficiency.spReductionPct : 0))));
    return actor.sp >= cost ? null : "Not enough SP";
  }

  function battleStep(inputState, command) {
    // Presentation only observes the returned state/log. Animation timing, UI
    // speed and VFX must never decide queue order or gameplay resolution here.
    const state = ensureTeamModel(copy(inputState));
    if (state.result) return { state, waiting: false, completedAction: false };
    const actor = currentUnit(state);
    if (!actor) { checkBattleEnd(state); return { state, waiting: false, completedAction: false }; }
    const manualActor = actor.kind === "hero" && actor.side === state.controlledSide;
    if (manualActor && !command && !state.flags.auto && !state.flags.skipResolving) return { state, waiting: true, completedAction: false };
    if (manualActor && command) {
      const invalid = validateHeroCommand(state, actor, command);
      if (invalid) {
        log(state, "invalid", invalid);
        return { state, waiting: true, completedAction: false, error: invalid };

// ---------- Inventory V2 capacity / overflow ----------
// All reward and purchase insertion must cross this boundary. It is intentionally
// presentation-agnostic so future Storage can reuse the same slot policy safely.
const INVENTORY_CAPACITY = 30;
const INVENTORY_STACK_MAX = 99;
const INVENTORY_EQUIPMENT_TYPES = ["weapon", "helmet", "chest", "gloves", "boots", "accessory", "wings"];

function inventoryStackKey(item) {
  if (!item) return "";
  if (item.type === "junk" && item.junkId) return `junk:${item.junkId}`;
  if (item.type === "potion" && item.potionId) return `potion:${item.potionId}`;
  return "";
}

function cloneInventoryItem(item, quantity, suffix = "") {
  const next = { ...item };
  if (quantity !== undefined) next.quantity = quantity;
  if (suffix) next.id = `${item.id || "item"}-${suffix}`;
  return next;
}

function mergeStackInto(list, incoming) {
  const key = inventoryStackKey(incoming);
  let remaining = Math.max(0, Number(incoming.quantity) || 0);
  if (!key || !remaining) return { list: list.slice(), remaining };
  const next = list.map(item => {
    if (!remaining || inventoryStackKey(item) !== key) return item;
    const quantity = Math.max(0, Number(item.quantity) || 0);
    const add = Math.min(INVENTORY_STACK_MAX - quantity, remaining);
    if (add <= 0) return item;
    remaining -= add;
    return { ...item, quantity: quantity + add };
  });
  return { list: next, remaining };
}

function appendToOverflow(overflow, item, quantity) {
  const initial = cloneInventoryItem(item, quantity);
  const merged = mergeStackInto(overflow, initial);
  const next = merged.list;
  let remaining = merged.remaining;
  if (!inventoryStackKey(item)) {
    next.push(cloneInventoryItem(item));
    return next;
  }
  let part = 0;
  while (remaining > 0) {
    const chunk = Math.min(INVENTORY_STACK_MAX, remaining);
    next.push(cloneInventoryItem(item, chunk, `overflow-${Date.now()}-${part++}`));
    remaining -= chunk;
  }
  return next;
}

function insertInventoryItems(inventory, overflow, items, capacity = INVENTORY_CAPACITY) {
  let nextInventory = (inventory || []).slice();
  let nextOverflow = (overflow || []).slice();
  let insertedCount = 0;
  let overflowedCount = 0;
  (Array.isArray(items) ? items : [items]).filter(Boolean).forEach((item, itemIndex) => {
    const stackKey = inventoryStackKey(item);
    if (!stackKey) {
      if (nextInventory.length < capacity) {
        nextInventory.push(cloneInventoryItem(item));
        insertedCount += 1;
      } else {
        nextOverflow = appendToOverflow(nextOverflow, item);
        overflowedCount += 1;
      }
      return;
    }
    const quantity = Math.max(1, Number(item.quantity) || 1);
    const merged = mergeStackInto(nextInventory, { ...item, quantity });
    nextInventory = merged.list;
    let remaining = merged.remaining;
    insertedCount += quantity - remaining;
    let part = 0;
    while (remaining > 0 && nextInventory.length < capacity) {
      const chunk = Math.min(INVENTORY_STACK_MAX, remaining);
      nextInventory.push(cloneInventoryItem(item, chunk, `slot-${Date.now()}-${itemIndex}-${part++}`));
      remaining -= chunk;
      insertedCount += chunk;
    }
    if (remaining > 0) {
      nextOverflow = appendToOverflow(nextOverflow, item, remaining);
      overflowedCount += remaining;
    }
  });
  return { inventory: nextInventory, overflow: nextOverflow, insertedCount, overflowedCount };
}

function normalizeInventoryCapacity(inventory, overflow, capacity = INVENTORY_CAPACITY) {
  return insertInventoryItems([], overflow || [], inventory || [], capacity);
}

function claimOverflowItem(inventory, overflow, itemId, capacity = INVENTORY_CAPACITY) {
  const index = (overflow || []).findIndex(item => item.id === itemId);
  if (index < 0) return { inventory: (inventory || []).slice(), overflow: (overflow || []).slice(), claimed: 0 };
  const item = overflow[index];
  const without = overflow.filter((_, i) => i !== index);
  const result = insertInventoryItems(inventory, [], [item], capacity);
  let nextOverflow = without;
  if (result.overflow.length) nextOverflow.splice(index, 0, ...result.overflow);
  return { inventory: result.inventory, overflow: nextOverflow, claimed: result.insertedCount };
}

function claimAllOverflowThatFits(inventory, overflow, capacity = INVENTORY_CAPACITY) {
  let nextInventory = (inventory || []).slice();
  let remaining = [];
  let claimed = 0;
  (overflow || []).forEach(item => {
    const result = insertInventoryItems(nextInventory, [], [item], capacity);
    nextInventory = result.inventory;
    remaining.push(...result.overflow);
    claimed += result.insertedCount;
  });
  return { inventory: nextInventory, overflow: remaining, claimed };
}

    || (Number(b.enhanceLevel) || 0) - (Number(a.enhanceLevel) || 0)

    || String(a.name || "").localeCompare(String(b.name || ""))
    || String(a.id || "").localeCompare(String(b.id || ""))

  inventoryItemRuntimeId, inventoryItemBackendId, inventoryItemType, inventoryItemJunkId,
  inventoryItemPotionId, inventoryItemQuantity, inventoryItemLocked, inventoryItemEquippedSlot,

const BATTLE_VFX_PRESENTATION = (() => {
  const OPTIONAL_BASIC_EFFECT_KEY = "slash_normal";
  const SKILL_EFFECTS = Object.freeze({
    power_strike: { effectKey: "slash_basic", kind: "single", placement: "anchor" },
    heavy_blow: { effectKey: "slash_heavy", kind: "single", placement: "anchor" },
    toxic_strike: { effectKey: "slash_status.toxic", kind: "single", placement: "anchor", status: "poison", statusEffectKey: "poison_hit" },
    silent_edge: { effectKey: "slash_status.silence", kind: "single", placement: "anchor", status: "silence", statusEffectKey: "silence_hit" },
    guard: { effectKey: "buff_aura", kind: "aura", placement: "target", self: true },

  });

    silence: "silence_hit"
  });

    return [...new Set(values.filter(Boolean))];

    if (actor?.kind === "pet") return "pet";

    return unique(logs

      .map(entry => entry.targetId)
      .filter(targetId => next?.units?.[targetId]?.side !== actor.side));
  }

  function targetConfirmations(logs, actor, skillId, statuses = Object.keys(STATUS_CONFIRMATIONS)) {
    const allowed = new Set(statuses);

      .filter(entry => entry.type === "status" && entry.actorId === actor.id && allowed.has(entry.status) && STATUS_CONFIRMATIONS[entry.status])
      .map(entry => ({
        effectKey: STATUS_CONFIRMATIONS[entry.status],

      : SKILL_EFFECTS[skillId];

    const beforeActor = previous?.units?.[actor.id];
    const nextActor = next?.units?.[actor.id];
    const cooldownAdvanced = skillId !== "basic_attack" && Number(nextActor?.cooldowns?.[skillId] || 0) > Number(beforeActor?.cooldowns?.[skillId] || 0);
    const spentSp = Number(nextActor?.sp || 0) < Number(beforeActor?.sp || 0);

      entry.actorId === actor.id && (

// ===== ui/resumePreviewPatch.js =====
// Keeps Dungeon Floor Preview aligned with an active Battle V1 checkpoint.
// The map normally pre-rolls a fresh encounter for preview; when a safe cloud checkpoint
// exists, continuing that floor must preview the checkpoint's exact enemy pack instead.
(function installResumeFloorPreviewPatch(root) {
  if (typeof cloudGetBattleState !== "function" || typeof makeEncounter !== "function") return;

  let activeResume = null;

  function encounterFromCheckpoint(payload) {
    if (!payload || !Array.isArray(payload.enemyIds) || !payload.units) return null;
    const monsters = payload.enemyIds.map((enemyId) => {
      const unit = payload.units[enemyId];
      if (!unit) return null;
      return {
        ...unit,
        id: unit.monsterDefId || unit.id,
        uid: unit.id,
        hp: Number(unit.hp) || 0,
        maxHp: Math.max(1, Number(unit.maxHp) || Number(unit.hp) || 1),
        isBoss: unit.kind === "boss" || unit.kind === "raid_boss" || !!unit.isBoss,
        isEliteBoss: !!unit.isEliteBoss,
      };
    }).filter(Boolean);
    return monsters.length ? monsters : null;
  }

  function rememberCheckpoint(characterId, checkpoint) {
    const payload = checkpoint && checkpoint.payload;
    const encounter = encounterFromCheckpoint(payload);
    if (!payload || !encounter) {
      if (!characterId || activeResume?.characterId === String(characterId)) activeResume = null;
      return;
    }
    activeResume = {
      characterId: String(characterId || ""),
      battleId: String(payload.battleId || checkpoint.battleId || ""),
      floor: Math.max(1, Math.floor(Number(payload.floor) || 1)),
      encounter,
    };
  }

  const originalGetBattleState = cloudGetBattleState;
  cloudGetBattleState = async function patchedCloudGetBattleState(serverUrl, characterId, ...rest) {
    const result = await originalGetBattleState(serverUrl, characterId, ...rest);
    if (result?.ok) rememberCheckpoint(characterId, result.checkpoint);
    return result;
  };

  const originalMakeEncounter = makeEncounter;
  makeEncounter = function patchedMakeEncounter(floor) {
    if (activeResume && Number(floor) === activeResume.floor) {
      return activeResume.encounter.map(monster => ({ ...monster }));
    }
    return originalMakeEncounter(floor);
  };

  if (typeof cloudCompleteBattle === "function") {
    const originalCompleteBattle = cloudCompleteBattle;
    cloudCompleteBattle = async function patchedCloudCompleteBattle(serverUrl, characterId, battleId, ...rest) {
      const result = await originalCompleteBattle(serverUrl, characterId, battleId, ...rest);
      if (result?.ok && activeResume && String(battleId) === activeResume.battleId) activeResume = null;
      return result;
    };
  }

  if (typeof cloudClearBattleCheckpoint === "function") {
    const originalClearBattleCheckpoint = cloudClearBattleCheckpoint;
    cloudClearBattleCheckpoint = async function patchedCloudClearBattleCheckpoint(serverUrl, characterId, battleId, ...rest) {
      const result = await originalClearBattleCheckpoint(serverUrl, characterId, battleId, ...rest);
      if (result?.ok && activeResume && String(battleId) === activeResume.battleId) activeResume = null;
      return result;
    };
  }

  root.__thornieResumeFloorPreview = {
    getActive: () => activeResume ? { ...activeResume, encounter: activeResume.encounter.map(monster => ({ ...monster })) } : null,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ThornieDungeons));
clearTimeout(window.__thornieBootTimer);
} catch (err) {
  clearTimeout(window.__thornieBootTimer);
  showBootError('Render Error: ' + (err && err.message ? err.message : String(err)) + (err && err.stack ? '\n' + err.stack : ''));
}
</script>
