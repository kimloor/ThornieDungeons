function apiPolicyOrDefault(action, method) {
  if (typeof apiPolicyFor === "function") return apiPolicyFor(action, method);
  return method === "GET" ? { timeoutMs: API_GET_TIMEOUT_MS, retries: 2 } : { timeoutMs: 0, retries: 0 };
}
function withDedupe(key, fn) {
  if (_inFlight.has(key)) return _inFlight.get(key);
  const p = fn().finally(() => _inFlight.delete(key));
  _inFlight.set(key, p);
  return p;
}

async function cloudGet(url, params, { headers = {}, timeoutMs, retries } = {}) {
  const qs = new URLSearchParams(params).toString();
  const fullUrl = `${url}?${qs}`;
  const policy = apiPolicyOrDefault(params && params.action, "GET");
  const effectiveTimeoutMs = timeoutMs !== undefined ? timeoutMs : policy.timeoutMs;
  const effectiveRetries = retries !== undefined ? retries : policy.retries;
  return withDedupe(dedupeKey(fullUrl, headers), () => withRetry(async () => {
    const controller = effectiveTimeoutMs > 0 && typeof AbortController === "function" ? new AbortController() : null;
    let timedOut = false;
    const timer = controller ? setTimeout(() => { timedOut = true; controller.abort(); }, effectiveTimeoutMs) : null;
    try {
      const res = await fetch(fullUrl, controller ? { headers, signal: controller.signal } : { headers });
      const data = await res.json();
      if (!res.ok) return { ...data, error: data.error || (res.status >= 500 ? "server_error" : "request_failed"), status: res.status };
      return data;
    } catch (e) {
      return timedOut ? { error: "network_error", timedOut: true } : { error: "network_error" };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }, { retries: effectiveRetries }));
}
async function cloudPost(url, body, { retries, baseDelayMs = 300, headers = {}, keepalive = false, timeoutMs } = {}) {
  const policy = apiPolicyOrDefault(body && body.action, "POST");
  const effectiveRetries = retries !== undefined ? retries : policy.retries;
  // keepalive requests (page-close flushes) are fire-and-forget: never time them out.
  const effectiveTimeoutMs = keepalive ? 0 : (timeoutMs !== undefined ? timeoutMs : policy.timeoutMs);
  return withDedupe(dedupeKey(url, { body, headers, keepalive }), () => withRetry(async () => {
    const controller = effectiveTimeoutMs > 0 && typeof AbortController === "function" ? new AbortController() : null;
    let timedOut = false;
    const timer = controller ? setTimeout(() => { timedOut = true; controller.abort(); }, effectiveTimeoutMs) : null;
    try {
      const init = {
        method: "POST",
        headers: { "Content-Type": "application/json", ...headers },
        body: JSON.stringify(body),
        keepalive: !!keepalive
      };
      if (controller) init.signal = controller.signal;
      const res = await fetch(url, init);
      const data = await res.json();
      if (res.status >= 500) return { ...data, error: data.error || "server_error", status: res.status };
      return data;
    } catch (e) {
      return timedOut ? { error: "network_error", timedOut: true } : { error: "network_error" };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }, { retries: effectiveRetries, baseDelayMs }));
}

// ===== state/operations.js =====
// Server Operation Manager (docs/CLIENT-SYSTEMS-V1.md section 11)
// Standard lifecycle for state-changing server actions: one requestId per player intent,
// automatic retry of receipt-protected actions, per-character queue, pending registry for
// disabling controls, optimistic apply + scoped rollback, errors via the catalog.
// It never resolves gameplay: the Worker stays authoritative; callers keep their own result handling.
const OPERATIONS_DEFAULTS = Object.freeze({
  maxRetries: 3,              // retries after the first attempt (receipt actions only)
  backoffMs: [1000, 2000, 4000],
  jitter: 0.2,                // +/-20% so devices do not retry in lockstep
  budgetMs: 45000,            // stop retrying once an intent has taken this long in total
  busyMessage: "\u0e01\u0e33\u0e25\u0e31\u0e07\u0e17\u0e33\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e01\u0e48\u0e2d\u0e19\u0e2b\u0e19\u0e49\u0e32 \u0e01\u0e23\u0e38\u0e13\u0e32\u0e23\u0e2d\u0e2a\u0e31\u0e01\u0e04\u0e23\u0e39\u0e48"
});

function newOperationRequestId(prefix) {
  const rand = (typeof globalThis !== "undefined" && globalThis.crypto && typeof globalThis.crypto.randomUUID === "function")
    ? globalThis.crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  return `${prefix || "op"}-${rand}`;
}

// Transient = the request may not have reached (or finished on) the server. Business errors
// (insufficient_funds, item_not_found, ...) are final and never retried.
function isTransientOperationResult(result) {
  if (!result || typeof result !== "object") return false;
  return result.error === "network_error" || result.error === "server_error" ||
    result.timedOut === true || Number(result.status) >= 500;
}

// Reverts only the keys this operation changed, and only when nobody else has changed them since.
// current: live state, applied: state right after the optimistic apply, previous: state before it.
// Anything that moved on its own (e.g. a reward that arrived while waiting) is left untouched.
function revertOperationFields(current, applied, previous, keys) {
  const next = { ...current };
  (keys || Object.keys(applied || {})).forEach(key => {
    if (Object.is(current[key], applied[key])) next[key] = previous[key];
  });
  return next;
}

function createOperationManager(options = {}) {
  const cfg = { ...OPERATIONS_DEFAULTS, ...(options.config || {}) };
  const sleep = options.sleep || (ms => new Promise(resolve => setTimeout(resolve, ms)));
  const now = options.now || (() => Date.now());
  const random = options.random || Math.random;
  const policyFor = options.policyFor || null;     // (action, "POST") => { idempotency }
  const loading = options.loading || null;         // GLOBAL_LOADING-like { run(spec, task) }
  const explain = options.errorMessage || null;    // errorMessage(code, { overrides, fallback })
  const beforeRetry = typeof options.beforeRetry === "function" ? options.beforeRetry : null;

  const pending = new Map();      // key -> count (inline pending registry)
  const queues = new Map();       // `${characterId}:${group}` -> tail promise
  const listeners = new Set();
  let version = 0;

  function notify() {
    version += 1;
    listeners.forEach(fn => { try { fn(version); } catch (_) { /* ignore */ } });
  }
  function mark(key, delta) {
    const count = (pending.get(key) || 0) + delta;
    if (count > 0) pending.set(key, count); else pending.delete(key);
    notify();
  }

  function canRetry(spec) {
    if (spec.retry === false) return false;
    if (!spec.action || !policyFor) return false;
    const policy = policyFor(spec.action, "POST");
    return !!policy && policy.idempotency === "receipt";
  }

  function backoffDelay(retryIndex) {
    const base = cfg.backoffMs[Math.min(retryIndex, cfg.backoffMs.length - 1)];
    const spread = (random() * 2 - 1) * cfg.jitter;
    return Math.max(0, Math.round(base * (1 + spread)));
  }

  function finalize(spec, result) {
    const res = result && typeof result === "object" ? result : { ok: false, error: "network_error" };
    if (res.ok || res.message || !explain) return res;
    const text = explain(res.error, { overrides: spec.errorOverrides || null, fallback: "" });
    return text ? { ...res, message: text } : res;
  }

  async function attempts(spec, task) {
    const requestId = spec.requestId || newOperationRequestId(spec.action || spec.key);
    const retriable = canRetry(spec);
    const startedAt = now();
    let result;
    for (let attempt = 0; ; attempt++) {
      try {
        result = await task(requestId, { attempt, retried: attempt > 0 });
      } catch (_) {
        result = { ok: false, error: "network_error" };
      }
      if (!retriable || !isTransientOperationResult(result) || attempt >= cfg.maxRetries) break;
      const wait = backoffDelay(attempt);
      if (now() - startedAt + wait > cfg.budgetMs) break;
      await sleep(wait);
      if (beforeRetry) { try { beforeRetry(); } catch (_) { /* ignore */ } }
    }
    return { result, requestId };
  }

  async function execute(spec, task) {
    let ctx;
    let applied = false;
    if (typeof spec.apply === "function") { ctx = spec.apply(); applied = true; }
    let outcome;
    const work = () => attempts(spec, task);
    try {
      outcome = (spec.ui === "overlay" && loading)
        ? await loading.run({ key: spec.key, label: spec.label || "" }, work)
        : await work();
    } catch (error) {
      const failed = { ok: false, error: "network_error" };
      if (typeof spec.settle === "function") { try { spec.settle(failed); } catch (_) { /* ignore */ } }
      if (applied && typeof spec.rollback === "function") spec.rollback(ctx, failed);
      throw error;
    }
    const result = finalize(spec, outcome.result);
    // settle() runs once per intent on every exit path (success, failure, throw): clear local pending UI here.
    if (typeof spec.settle === "function") { try { spec.settle(result); } catch (_) { /* ignore */ } }
    if (!result.ok && applied && typeof spec.rollback === "function") spec.rollback(ctx, result);
    return result;
  }

  // spec: { key, group?, characterId?, action?, ui?: "inline"|"overlay"|"none", label?, apply?, rollback?,
  //         requestId?, retry?, conflict?: "queue"|"reject", errorOverrides?, settle?(result) }
  function run(spec, task) {
    const key = String(spec && spec.key || "");
    if (!key) throw new Error("OPERATIONS.run requires a key");
    const groupKey = spec.group ? `${spec.characterId || "-"}:${spec.group}` : null;
    // The same intent twice (double tap) is always rejected, never queued behind itself.
    if (pending.has(key)) return Promise.resolve({ ok: false, error: "operation_busy", message: cfg.busyMessage });
    const tail = groupKey ? queues.get(groupKey) : null;
    if (tail && spec.conflict === "reject") return Promise.resolve({ ok: false, error: "operation_busy", message: cfg.busyMessage });

    mark(key, 1);
    if (spec.ui !== "none") mark(`group:${groupKey || key}`, 1);
    // Cleanup runs BEFORE the caller's await resumes, so `await run(a); run(b)` never sees a stale lock.
    const cleanup = () => {
      mark(key, -1);
      if (spec.ui !== "none") mark(`group:${groupKey || key}`, -1);
      if (groupKey && queues.get(groupKey) === done) queues.delete(groupKey);
    };
    const start = async () => {
      try { return await execute(spec, task); } finally { cleanup(); }
    };
    const job = (tail || Promise.resolve()).then(start);
    const done = job.catch(() => {});
    if (groupKey) queues.set(groupKey, done);
    return job;
  }

  return {
    run,
    isPending: key => pending.has(String(key)),
    isGroupPending: (group, characterId) => pending.has(`group:${characterId || "-"}:${group}`),
    pendingKeys: () => Array.from(pending.keys()),
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    getVersion: () => version,
    config: cfg
  };
}

const OPERATIONS = createOperationManager({
  policyFor: typeof apiPolicyFor === "function" ? apiPolicyFor : null,
  loading: typeof GLOBAL_LOADING !== "undefined" ? GLOBAL_LOADING : null,
  errorMessage: typeof errorMessage === "function" ? errorMessage : null,
  beforeRetry: () => { if (typeof cloudResetInFlight === "function") cloudResetInFlight(); }
});

// React hook: re-renders when pending state changes. Pass a key, or { group, characterId } for a whole queue.
function useOperationPending(target) {
  const [, setTick] = useState(0);
  useEffect(() => OPERATIONS.subscribe(v => setTick(v)), []);
  if (target && typeof target === "object") return OPERATIONS.isGroupPending(target.group, target.characterId);
  return OPERATIONS.isPending(target);
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { OPERATIONS_DEFAULTS, createOperationManager, isTransientOperationResult, revertOperationFields, newOperationRequestId };
}

// Public Player Card surface. This module owns profile presentation and avatar composition
// hooks; Friend, Chat, and Guild screens only pass a public-profile target into this interface.
const PLAYER_CARD_RELATIONSHIP_LABELS = Object.freeze({
  self: "นี่คือตัวละครของคุณ",
  friend: "เพื่อน",
  blocked_by_me: "บล็อกผู้เล่นนี้อยู่",
  blocking_me: "ผู้เล่นนี้บล็อกคุณ",
  outgoing_pending: "ส่งคำขอเป็นเพื่อนแล้ว",
  incoming_pending: "มีคำขอเป็นเพื่อน",
  none: "ยังไม่ได้เป็นเพื่อน"
});

function playerCardAsset(key) {
  return typeof optionalAsset === "function" ? optionalAsset(`playerCardUi.${key}`) : "";
}
function arenaProfileFrameAsset(frameKey) {
  const map = { arena_rank_1: "profileFrames.arenaRank1", arena_rank_2: "profileFrames.arenaRank2", arena_rank_3: "profileFrames.arenaRank3" };
  return map[frameKey] && typeof optionalAsset === "function" ? optionalAsset(map[frameKey]) : "";
}

function normalizePlayerCardAvatar(avatar) {
  const source = avatar && typeof avatar === "object" ? avatar : {};
  const layers = Array.isArray(source.layers) ? source.layers : [];
  return {
    mode: "head",
    layers: layers
      .filter(layer => layer && typeof layer === "object" && typeof layer.assetKey === "string")
      .map(layer => ({
        assetKey: layer.assetKey,
        x: Number(layer.x) || 0,
        y: Number(layer.y) || 0,
        scale: Number(layer.scale) || 1,
        zIndex: Number(layer.zIndex) || 0
      }))
      .sort((a, b) => a.zIndex - b.zIndex)
  };
}

function playerCardAvatarLayers(avatar) {
  return normalizePlayerCardAvatar(avatar).layers
    .map(layer => ({
      ...layer,
      src: playerCardAsset(layer.assetKey) || (typeof optionalAsset === "function" ? optionalAsset(layer.assetKey) : "")
    }))
    .filter(layer => layer.src);
}

function PlayerCardTrigger({ characterId, name, level, onOpenPlayerCard }) {
  const e = React.createElement;
  if (!characterId || !onOpenPlayerCard) return e(React.Fragment, null, name, ` (Lv.${level})`);
  return e("button", {
    type: "button",
    className: "md-player-card-trigger",
    onClick: event => {
      event.stopPropagation();
      onOpenPlayerCard(characterId);
    },
    "aria-label": `เปิด Player Card ของ ${name}`
  },
    e("span", null, name),
    level != null && e("small", null, `(Lv.${level})`)
  );
}

function PlayerCardOverlay({ serverUrl, viewerCharacterId, targetCharacterId, onClose, onGuildLink }) {
  const e = React.createElement;
  const [state, setState] = React.useState({ loading: true, error: "", profile: null });
  const [friendBusy, setFriendBusy] = React.useState(false);
  const url = serverUrl || DEFAULT_SERVER_URL;

  React.useEffect(() => {
    let cancelled = false;
    setState({ loading: true, error: "", profile: null });
    cloudGetPublicProfile(url, viewerCharacterId, targetCharacterId).then(res => {
      if (cancelled) return;
      if (!res || res.error) {
        setState({ loading: false, error: "ไม่สามารถโหลดข้อมูลผู้เล่นได้", profile: null });
        return;
      }
      setState({ loading: false, error: "", profile: res.profile || null });
    }).catch(() => {
      if (!cancelled) setState({ loading: false, error: "เชื่อมต่อ Server ไม่สำเร็จ", profile: null });
    });
    return () => { cancelled = true; };
  }, [url, viewerCharacterId, targetCharacterId]);

  const profile = state.profile;
  const guild = profile?.guild;
  const relationship = PLAYER_CARD_RELATIONSHIP_LABELS[profile?.relationship] || PLAYER_CARD_RELATIONSHIP_LABELS.none;
  const avatarLayers = playerCardAvatarLayers(profile?.avatar);
  const friendActionLabel = !profile ? "เพิ่มเพื่อน"
    : profile.relationship === "none" ? "เพิ่มเพื่อน"
    : profile.relationship === "outgoing_pending" ? "ส่งคำขอแล้ว"
    : profile.relationship === "incoming_pending" ? "มีคำขอเป็นเพื่อน"
    : profile.relationship === "friend" ? "เป็นเพื่อนแล้ว"
    : profile.relationship === "blocked_by_me" ? "บล็อกอยู่"
    : profile.relationship === "blocking_me" ? "ไม่สามารถเพิ่มเพื่อนได้"
    : profile.relationship === "self" ? "ตัวละครของคุณ"
    : "เพิ่มเพื่อน";
  const canAddFriend = profile?.relationship === "none" && !friendBusy;
  const handleFriendAction = () => {
    if (!canAddFriend) return;
    setFriendBusy(true);
    cloudSendFriendRequest(url, viewerCharacterId, targetCharacterId).then(res => {
      setFriendBusy(false);
      if (!res?.ok) return;
      setState(current => current.profile
        ? { ...current, profile: { ...current.profile, relationship: "outgoing_pending" } }
        : current);
    }).catch(() => setFriendBusy(false));
  };
  const close = e("button", {
    type: "button",
    className: "md-player-card-close",
    onClick: onClose,
    "aria-label": "ปิด Player Card"
  }, playerCardAsset("buttonClose") ? e("img", { src: playerCardAsset("buttonClose"), alt: "ปิด" }) : "✕");

  const overlay = e("div", { className: "md-player-card-overlay", role: "presentation", onClick: event => { if (event.target === event.currentTarget) onClose(); } },
    e("section", {
      className: "md-player-card",
      role: "dialog",
      "aria-modal": "true",
      "aria-labelledby": "md-player-card-name",
      style: {
        "--player-card-bg": playerCardAsset("cardBg") ? `url("${playerCardAsset("cardBg")}")` : "none",
        "--player-card-detail-panel": playerCardAsset("detailPanel") ? `url("${playerCardAsset("detailPanel")}")` : "none",
        "--player-card-name-plate": playerCardAsset("namePlate") ? `url("${playerCardAsset("namePlate")}")` : "none",
        "--player-card-button-primary": playerCardAsset("buttonPrimary") ? `url("${playerCardAsset("buttonPrimary")}")` : "none",
        "--player-card-button-secondary": playerCardAsset("buttonSecondary") ? `url("${playerCardAsset("buttonSecondary")}")` : "none"
      }
    },
      close,
      e("div", { className: "md-player-card-main" },
        e("div", { className: "md-player-card-identity" },
          e("div", { className: "md-player-card-avatar" },
            avatarLayers.length
              ? avatarLayers.map(layer => e("img", {
                key: `${layer.assetKey}:${layer.zIndex}`,
                src: layer.src,
                alt: "",
                "aria-hidden": "true",
                style: { left: `${layer.x}%`, top: `${layer.y}%`, transform: `translate(-50%, -50%) scale(${layer.scale})`, zIndex: layer.zIndex }
              }))
              : playerCardAsset("avatarPlaceholderNoPic") && e("img", { src: playerCardAsset("avatarPlaceholderNoPic"), alt: "ไม่มีรูปโปรไฟล์", className: "md-player-card-placeholder" }),
            (arenaProfileFrameAsset(profile?.profileFrameKey) || playerCardAsset("avatarFrame")) && e("img", { src: arenaProfileFrameAsset(profile?.profileFrameKey) || playerCardAsset("avatarFrame"), alt: "", "aria-hidden": "true", className: "md-player-card-avatar-frame" })
          ),
          e("div", { className: "md-player-card-nameplate" },
            e("h2", { id: "md-player-card-name" }, profile?.name || (state.loading ? "กำลังโหลด..." : "Player Card"))
          )
        ),
        e("div", { className: "md-player-card-details" },
          state.loading && e("p", { className: "md-sub" }, "กำลังโหลดข้อมูลสาธารณะ..."),
          state.error && e("p", { className: "md-auth-error", role: "alert" }, state.error),
          profile && e(React.Fragment, null,
            e("div", null, e("span", null, "Level"), e("strong", null, profile.level ?? "-")),
            e("div", null, e("span", null, "CP"), e("strong", null, Number(profile.cp || 0).toLocaleString("en-US"))),
            e("div", null, e("span", null, "Guild"), guild?.name ? e("strong", null, guild.name) : e("strong", null, "ไม่มีสังกัด")),
            e("div", null, e("span", null, "Guild Lv"), e("strong", null, guild?.level ?? "-")),
            e("div", null, e("span", null, "สถานะ"), e("strong", null, relationship))
          )
        )
      ),
      e("div", { className: "md-player-card-actions" },
        e("button", {
          type: "button",

      if (r.slot_type === "junk") {
        (extra.overflow ? overflow : inventory).push({
          id: r.item_id,
          serverItemId: String(r.item_id || ""),
          type: "junk",
          junkId: extra.junkId,
          name: r.name,
          icon: extra.icon || (JUNK_INFO[extra.junkId] || {}).icon || "📦",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1),
          favorite: extra.favorite === true,
          ...(extra.sourceType ? { sourceType: String(extra.sourceType) } : {}),
          ...(extra.sourceFloor ? { sourceFloor: numOr(extra.sourceFloor, 0) } : {}),
          ...(extra.sourceIdentity ? { sourceIdentity: String(extra.sourceIdentity) } : {})
        });
        return;
      }
      if (r.slot_type === "potion") {
        const def = getPotionDef(extra.potionId);
        (extra.overflow ? overflow : inventory).push({
          id: r.item_id,
          serverItemId: String(r.item_id || ""),
          type: "potion",
          potionId: extra.potionId,
          name: r.name || (def && def.name) || "Potion",
          icon: extra.icon || (def && def.icon) || "🧪",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1),
          favorite: extra.favorite === true
        });
        return;
      }
      const normalizedEquipment = normalizeEquipmentNameForLoad(r.slot_type, r.name, extra.gearTier);
      if (normalizedEquipment.migrated) legacyEquipmentMigrated = true;
      const it = {
        id: r.item_id,
          serverItemId: String(r.item_id || ""),
        type: r.slot_type,
        rarity: r.rarity,
        name: normalizedEquipment.name,
        atk: numOr(r.atk, 0),
        def: numOr(r.def, 0),
        hp: numOr(r.hp, 0),
        mp: numOr(r.mp, 0),
        dodgeChance: numOr(extra.dodgeChance, 0),
        critChance: numOr(extra.critChance, 0),
        critDamage: numOr(extra.critDamage, 0),
        enhanceLevel: numOr(r.enhance_level, 0),
        level: numOr(r.item_level, 0),
        favorite: extra.favorite === true,
        empowerSlots: Array.isArray(extra.empowerSlots)
          ? extra.empowerSlots
          : (Number(extra.itemModelVersion) === 2 || Number(extra.rewardVersion) === 2
            ? Array(Math.max(0, Number(extra.empowerSlotCapacity) || 0)).fill(null)
            : Array(RARITY_STARS[r.rarity] || 1).fill(null))
      };
      if (normalizedEquipment.gearTier) it.gearTier = normalizedEquipment.gearTier;
      if (extra.setId) it.setId = extra.setId;
      if (extra.star) it.star = numOr(extra.star, 0);
      if (extra.craftRecipeId) it.craftRecipeId = extra.craftRecipeId;
      if (extra.rewardVersion) it.rewardVersion = numOr(extra.rewardVersion, 0);
      if (extra.itemModelVersion) it.itemModelVersion = numOr(extra.itemModelVersion, 0);
      if (extra.empowerSlotCapacity !== undefined) it.empowerSlotCapacity = numOr(extra.empowerSlotCapacity, 0);
      if (extra.utilityStat) it.utilityStat = String(extra.utilityStat);
      if (extra.sourceType) it.sourceType = String(extra.sourceType);
      if (extra.sourceFloor) it.sourceFloor = numOr(extra.sourceFloor, 0);
      if (extra.specialSource) it.specialSource = String(extra.specialSource);
      if (extra.sourceIdentity) it.sourceIdentity = String(extra.sourceIdentity);
      if (extra.wingFamily) it.wingFamily = String(extra.wingFamily);
      if (extra.blacksmithVersion) it.blacksmithVersion = numOr(extra.blacksmithVersion, 0);
      if (Array.isArray(extra.blacksmithReceipts)) it.blacksmithReceipts = extra.blacksmithReceipts.map(String).filter(Boolean).slice(-32);
      if (extra.blacksmithLastResult && typeof extra.blacksmithLastResult === "object") it.blacksmithLastResult = extra.blacksmithLastResult;
      if (extra.bossWeaponId) it.bossWeaponId = String(extra.bossWeaponId);
      if (extra.signatureId) it.signatureId = String(extra.signatureId);
      if (extra.sourceBossId) it.sourceBossId = String(extra.sourceBossId);
      ["atk", "def", "hp", "mp", "dodgeChance", "critChance", "critDamage"].forEach(k => {
        if (!it[k]) delete it[k];
      });
      if (String(r.equipped) === "1" || r.equipped === true) equipped[r.slot_type] = it;
      else if (extra.overflow) overflow.push(it);
      else inventory.push(it);
    } catch (e) {
      console.warn("[ThornieDungeons] Skipped a corrupted item row:", e);
    }
  });
  return {
    equipped,
    inventory,
    overflow,
    legacyEquipmentMigrated
  };
}

function infoFindSection(id) {
  return INFO_CENTER.sections.find(section => section.id === id) || null;
}

// Route formats: "terms" (section) or "guide/<topicId>" (section + topic, for future contextual "?" help).
// Unknown ids resolve to null so callers can fall back to the menu instead of showing a blank page.
function infoResolveRoute(route) {
  if (!route) return null;
  const [sectionId, topicId = ""] = String(route).split("/");
  const section = infoFindSection(sectionId);
  if (!section) return null;
  const topic = topicId && Array.isArray(section.topics) ? (section.topics.find(item => item.id === topicId) || null) : null;
  return { sectionId: section.id, topicId: topic ? topic.id : "" };
}

function infoLatestVersion() {
  return INFO_CENTER.announcements.latest.version;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { INFO_CENTER, INFO_CENTER_VERSION_SEEN_KEY, infoFindSection, infoResolveRoute, infoLatestVersion };
}

// Existing characters receive their full budget from their current level. Only committed
// levels are stored; a missing entry is Lv.1, so old saves migrate without a data rewrite.
function totalSkillPointBudget(level) {
  return Math.max(0, Math.floor((Number(level) || 0) / 5));
}
function committedSkillLevel(save, skillKey) {
  const raw = save?.character?.skillLevels?.[skillKey];
  return Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(raw) || 1)));
}
function spentSkillPoints(save) {
  return Object.keys(save?.character?.skillLevels || {}).reduce((sum, key) => {
    return sum + Math.max(0, committedSkillLevel(save, key) - 1);
  }, 0);
}
function remainingSkillPoints(save) {
  return Math.max(0, totalSkillPointBudget(save?.character?.level) - spentSkillPoints(save));
}
function skillAtLevel(skill, level) {
  const lv = Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(level) || 1)));
  const bonusLevels = lv - 1;
  const next = { ...skill, skillLevel: lv };
  if (Number.isFinite(skill.mult)) next.mult = roundTo(skill.mult * (1 + bonusLevels * 0.08), 2);
  if (Number.isFinite(skill.healPct)) next.healPct = roundTo(skill.healPct + bonusLevels * 0.03, 2);
  return next;
}

const BATTLE_SAVE_VERSION = 1;

function migratePetV2Instance(pet) {
  if (!pet || typeof pet !== "object") return pet;
  const defId = PET_V2_ID_ALIASES[pet.defId] || pet.defId;
  return { ...pet, defId, star: Math.max(1, Math.min(3, Math.floor(Number(pet.star) || 1))) };
}

function migratePetDuplicatePoolV2(pool) {
  const next = {};
  for (const [rawId, rawCount] of Object.entries(pool || {})) {
    const id = PET_V2_ID_ALIASES[rawId] || rawId;
    next[id] = (next[id] || 0) + Math.max(0, Math.floor(Number(rawCount) || 0));
  }
  return next;
}

function migrateBattleV1Save(save) {
  const next = { ...(save || {}) };
  next.character = { ...(next.character || {}) };
  next.pets = (next.pets || []).map(migratePetV2Instance);
  next.petDuplicates = migratePetDuplicatePoolV2(next.petDuplicates);

  if (Number(next.character.skillVersion) !== BATTLE_SAVE_VERSION) {
    // Old skill ownership has no rank-for-rank equivalent. Reset only the old
    // allocation and preserve its full level entitlement for V1 redistribution.
    next.character.skillLevels = {};
    next.character.skillVersion = BATTLE_SAVE_VERSION;
    next.character.skillResetPoints = Math.max(0, Math.min(98, Math.floor(Number(next.character.level) || 1) - 1));
  }
  if (!next.character.skillLevels || typeof next.character.skillLevels !== "object") next.character.skillLevels = {};

  const validActive = new Set((typeof HERO_SKILLS_V1 !== "undefined" ? HERO_SKILLS_V1 : [])
    .filter(skill => skill.kind === "active").map(skill => skill.id));
  if (Array.isArray(next.quickSlots)) {
    next.quickSlots = next.quickSlots.slice(0, 4).map(slot => {
      if (!slot || slot.kind !== "skill") return slot || null;
      return validActive.has(slot.key || slot.skillId) ? slot : null;
    });
    while (next.quickSlots.length < 4) next.quickSlots.push(null);
  }
  return next;
}

const CHAT_TABS = [
  { key: "global", label: "โลก" },
  { key: "guild", label: "กิลด์" },
  { key: "direct", label: "ส่วนตัว" },
  { key: "sticker", label: "สติกเกอร์" },

function ChatScreen({
  serverUrl,
  characterId,
  characterName,
  initialDirectTarget,
  initialChannel,
  guildUnread = false,
  onGuildUnread,
  onChannelChange,
  onCharacter,
  onOpenInv,
  onPets,
  onSettings,
  onSave,
  onFriend,
  onGuild,
  onMainHub,
  onOpenPlayerCard,
  onBack

  const e = React.createElement;
  const url = serverUrl || DEFAULT_SERVER_URL;
  const [tab, setTab] = useState(initialDirectTarget ? "direct" : (initialChannel === "guild" ? "guild" : "global"));
  const [activeConversation, setActiveConversation] = useState(initialDirectTarget || null);
  const [globalMessages, setGlobalMessages] = useState([]);
  const [globalLoaded, setGlobalLoaded] = useState(false);
  const [globalInput, setGlobalInput] = useState("");
  const [globalError, setGlobalError] = useState("");
  const [globalSending, setGlobalSending] = useState(false);
  const [guildMessages, setGuildMessages] = useState([]);
  const [guildLoaded, setGuildLoaded] = useState(false);
  const [guildName, setGuildName] = useState("");
  const [guildInput, setGuildInput] = useState("");
  const [guildError, setGuildError] = useState("");
  const [guildSending, setGuildSending] = useState(false);
  const [conversations, setConversations] = useState(null);
  const [threadMessages, setThreadMessages] = useState([]);
  const [threadLoaded, setThreadLoaded] = useState(false);
  const [threadCanSend, setThreadCanSend] = useState(true);
  const [threadInput, setThreadInput] = useState("");
  const [threadError, setThreadError] = useState("");
  const [threadSending, setThreadSending] = useState(false);
  const [pollError, setPollError] = useState(false);

  const lastGlobalIdRef = React.useRef(0);
  const lastThreadIdRef = React.useRef(0);
  const lastGuildIdRef = React.useRef(0);
  const guildNonceRef = React.useRef(null);
  const guildSendLockRef = React.useRef(false);
  const onGuildUnreadRef = React.useRef(onGuildUnread);
  onGuildUnreadRef.current = onGuildUnread;
  const pollTimerRef = React.useRef(null);

  const lastCharacterIdRef = React.useRef(characterId);
  React.useEffect(() => {
    if (lastCharacterIdRef.current === characterId) return;
    lastCharacterIdRef.current = characterId;
    setGlobalMessages([]); setGlobalLoaded(false); setConversations(null);
    setThreadMessages([]); setThreadLoaded(false); setActiveConversation(null);
    setGuildMessages([]); setGuildLoaded(false); setGuildName("");
    setGlobalInput(""); setThreadInput(""); setGuildInput("");
    setGlobalError(""); setThreadError(""); setGuildError("");
    lastGlobalIdRef.current = 0; lastThreadIdRef.current = 0; lastGuildIdRef.current = 0;
    guildNonceRef.current = null;
    guildSendLockRef.current = false;
  }, [characterId]);

  // Single active poller at a time — Global tab, or an open Direct thread, or (Direct tab
  // with no thread open) the conversation list. Cleared on unmount and whenever tab/
  // activeConversation/characterId changes, so nothing polls once Chat isn't showing it
  // (CHAT-SYSTEM-V1.md §6). Baseline ~3s, backs off 3s -> 5s -> 10s on failure and resets
  // to baseline the moment a poll succeeds again; old messages are never cleared on
  // failure, only appended to on success.
  React.useEffect(() => {
    let cancelled = false;
    let delay = 3000;
    if (tab === "guild") { setGuildError(""); setGuildLoaded(false); }
    lastGlobalIdRef.current = 0;
    lastThreadIdRef.current = 0;
    lastGuildIdRef.current = 0;
    setPollError(false);

    const loadInitial = async () => {
      if (tab === "global") {
        const res = await cloudGetGlobalChat(url, characterId, 0);
        if (cancelled) return;
        if (res && res.ok) {
          setGlobalMessages(res.messages);
          if (res.messages.length) lastGlobalIdRef.current = res.messages[res.messages.length - 1].id;
          setGlobalLoaded(true);
        }
      } else if (tab === "guild") {
        const res = await cloudGetGuildChat(url, characterId, 0);
        if (cancelled) return;
        if (res && res.ok) {
          setGuildMessages(res.messages || []);
          setGuildName(res.guild?.name || "");
          if (res.cursor != null) lastGuildIdRef.current = Number(res.cursor);
          else if (res.messages?.length) lastGuildIdRef.current = res.messages[res.messages.length - 1].id;
          setGuildLoaded(true);
          const read = await cloudMarkGuildChatRead(url, characterId);
          if (!cancelled && read && read.ok && onGuildUnreadRef.current) onGuildUnreadRef.current(characterId, false);
        } else if (res?.error === "not_guild_member") {
          setGuildMessages([]); setGuildLoaded(true); setGuildError(chatErrorText(res.error));
        } else if (res?.error) throw new Error(res.error);
      } else if (tab === "direct" && activeConversation) {
        const res = await cloudGetDirectMessages(url, characterId, activeConversation.characterId, 0);
        if (cancelled) return;
        if (res && res.ok) {
          setThreadMessages(res.messages);
          setThreadCanSend(!!res.canSend);
          if (res.messages.length) lastThreadIdRef.current = res.messages[res.messages.length - 1].id;
          setThreadLoaded(true);
          // Only mark read after a confirmed successful render — never on a failed fetch
          // (§10/§14).

        const res = await cloudGetDirectConversations(url, characterId);
        if (cancelled) return;
        if (res && res.ok) setConversations(res.conversations);
      }
    };

    const poll = async () => {
      if (cancelled) return;
      try {
        if (tab === "global") {
          const res = await cloudGetGlobalChat(url, characterId, lastGlobalIdRef.current);
          if (cancelled) return;
          if (!res || res.error) throw new Error("poll_failed");
          if (res.messages.length) {
            setGlobalMessages((prev) => [...prev, ...res.messages]);
            lastGlobalIdRef.current = res.messages[res.messages.length - 1].id;
          }
          setPollError(false);
          delay = 3000;
        } else if (tab === "guild") {
          const res = await cloudGetGuildChat(url, characterId, lastGuildIdRef.current);
          if (cancelled) return;
          if (res?.error === "not_guild_member") {
            setGuildMessages([]); setGuildLoaded(true); setGuildName(""); setGuildError(chatErrorText(res.error));
            if (onGuildUnreadRef.current) onGuildUnreadRef.current(characterId, false);
            return;
          }
          if (!res || res.error) throw new Error(res?.error || "poll_failed");
          if (res.guild) setGuildName(res.guild.name || "");
          if (res.messages.length) {
            setGuildMessages((prev) => [...prev, ...res.messages]);
            await cloudMarkGuildChatRead(url, characterId);
          }
          if (res.cursor != null) lastGuildIdRef.current = Number(res.cursor);
          else if (res.messages.length) lastGuildIdRef.current = res.messages[res.messages.length - 1].id;
          if (onGuildUnreadRef.current) onGuildUnreadRef.current(characterId, false);
          setPollError(false);
          delay = 3000;
        } else if (tab === "direct" && activeConversation) {
          const res = await cloudGetDirectMessages(url, characterId, activeConversation.characterId, lastThreadIdRef.current);
          if (cancelled) return;
          if (!res || res.error) throw new Error("poll_failed");
          if (res.messages.length) {
            setThreadMessages((prev) => [...prev, ...res.messages]);
            lastThreadIdRef.current = res.messages[res.messages.length - 1].id;
            cloudMarkConversationRead(url, characterId, activeConversation.characterId);
          }
          setThreadCanSend(!!res.canSend);
          setPollError(false);
          delay = 3000;
        } else if (tab === "direct" && !activeConversation) {
          const res = await cloudGetDirectConversations(url, characterId);
          if (cancelled) return;
          if (!res || res.error) throw new Error("poll_failed");
          setConversations(res.conversations);
          setPollError(false);
          delay = 3000;

        if (tab !== "guild") {

      .then(() => {

      .catch((err) => {

        const code = err?.message || "";

          setGuildMessages([]);

          if (onGuildUnreadRef.current) onGuildUnreadRef.current(characterId, false);

      cancelled = true;
      if (pollTimerRef.current) clearTimeout(pollTimerRef.current);

  const handleSendGuild = () => {

      guildSendLockRef.current = false;

      setGuildMessages((prev) => prev.some(message => Number(message.id) === Number(res.id)) ? prev : [...prev, { id: res.id, characterId, name: characterName, text, createdAt: res.createdAt }]);
      if (res.id > lastGuildIdRef.current) lastGuildIdRef.current = res.id;
      await cloudMarkGuildChatRead(url, characterId);
      if (onGuildUnreadRef.current) onGuildUnreadRef.current(characterId, false);

  const handleSendGlobal = () => {
    const text = globalInput.trim();
    if (!text || globalSending) return;
    setGlobalSending(true);
    setGlobalError("");
    // §3 — one nonce per logical send attempt; the server dedupes retries of this exact
    // attempt against it (see workers' handleSendGlobalMessage), so a lost response +
    // resend (or the client's own retry layer) can't create a duplicate message.
    const nonce = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : `n-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    cloudSendGlobalMessage(url, characterId, text, nonce).then((res) => {
      setGlobalSending(false);
      if (!res || res.error) { setGlobalError(chatErrorText(res && res.error)); return; }
      setGlobalInput("");
      setGlobalMessages((prev) => [...prev, { id: res.id, characterId, name: characterName, text, createdAt: res.createdAt }]);
      lastGlobalIdRef.current = res.id;
    }).catch(() => { setGlobalSending(false); setGlobalError(chatErrorText("network_error")); });
  };

  const handleSendDirect = () => {
    const text = threadInput.trim();
    if (!text || threadSending || !activeConversation || !threadCanSend) return;
    setThreadSending(true);
    setThreadError("");
    const nonce = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : `n-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    cloudSendDirectMessage(url, characterId, activeConversation.characterId, text, nonce).then((res) => {
      setThreadSending(false);
      if (!res || res.error) { setThreadError(chatErrorText(res && res.error)); return; }
      setThreadInput("");
      setThreadMessages((prev) => [...prev, { id: res.id, characterId, name: characterName, text, createdAt: res.createdAt }]);
      lastThreadIdRef.current = res.id;
    }).catch(() => { setThreadSending(false); setThreadError(chatErrorText("network_error")); });
  };

  const openConversation = (conv) => {
    setThreadMessages([]);
    setThreadLoaded(false);
    setThreadError("");
    setActiveConversation({ characterId: conv.characterId, name: conv.name });
  };

  const bubble = (m) => e("div", {
    key: m.id,
    className: "md-shop-row",
    style: { flexDirection: "column", alignItems: m.characterId === characterId ? "flex-end" : "flex-start" }

    m.characterId !== characterId && e("div", { className: "md-sub md-chat-sender" , style: { margin: 0 } },
      e(PlayerCardTrigger, { characterId: m.characterId, name: m.name, level: m.level, onOpenPlayerCard })

    return e("div", { className: "md-inv-list" }, messages.map(bubble));
  };

  const globalPane = () => e(React.Fragment, null,
    e("div", { className: "md-card", style: { marginBottom: 10, overflowY: "auto", minHeight: 0, flex: 1 } },

    pollError && e("p", { className: "md-sub" }, "การเชื่อมต่อไม่เสถียร กำลังลองใหม่..."),
    globalError && e("p", { className: "md-sub" }, globalError),
    e("div", { className: "md-card", style: { display: "flex", gap: 6 } },
      e("input", {
        className: "md-field",
        style: { flex: 1 },
        placeholder: "พิมพ์ข้อความ... (สูงสุด 200 ตัวอักษร)",

    pollError && e("p", { className: "md-sub" }, "การเชื่อมต่อไม่เสถียร กำลังลองใหม่..."),
    guildError && e("p", { className: "md-sub", role: "alert" }, guildError),
    guildLoaded && guildError === chatErrorText("not_guild_member") ? null : e("div", { className: "md-card", style: { display: "flex", gap: 6 } },
      e("input", { className: "md-field", style: { flex: 1, minWidth: 0 }, placeholder: "พิมพ์ข้อความ... (สูงสุด 300 ตัวอักษร)", value: guildInput, maxLength: 300,
        onChange: (ev) => { setGuildInput(ev.target.value); if (guildNonceRef.current?.text !== ev.target.value.trim()) guildNonceRef.current = null; },
        onKeyDown: (ev) => { if (ev.key === "Enter") handleSendGuild(); } }),
      e("button", { className: "md-btn small primary", disabled: guildSending || !guildInput.trim(), onClick: handleSendGuild }, "ส่ง")));

  const conversationListPane = () => {
    if (conversations === null) return e("p", { className: "md-sub" }, "กำลังโหลด...");
    if (!conversations.length) return e("p", { className: "md-sub" }, "ยังไม่มีการสนทนา — เริ่มแชทได้จากหน้าเพื่อน");
    return e("div", { className: "md-card", style: { overflowY: "auto", minHeight: 0, flex: 1 } },
      e("div", { className: "md-inv-list" }, conversations.map((c) => e("div", {
        key: c.characterId,
        className: "md-shop-row",
        style: { cursor: "pointer" },
        onClick: () => openConversation(c),
      },
          e("div", { className: "md-shop-info" },
          e(PlayerCardTrigger, { characterId: c.characterId, name: `${c.online ? "🟢" : "⚪"} ${c.name}`, level: c.level, onOpenPlayerCard }), c.unread && e("span", { style: { marginLeft: 6 } }, "🔴"),
          e("div", { className: "md-sub", style: { margin: "2px 0 0" } }, `${c.lastSenderIsMe ? "คุณ: " : ""}${c.lastMessage || ""}`)),
      ))));
  };

  const threadPane = () => e(React.Fragment, null,
    e("div", { className: "md-card", style: { marginBottom: 10, overflowY: "auto", minHeight: 0, flex: 1 } },
      messageList(threadMessages, threadLoaded, "ยังไม่มีข้อความ — ส่งข้อความแรกได้เลย")),
    pollError && e("p", { className: "md-sub" }, "การเชื่อมต่อไม่เสถียร กำลังลองใหม่..."),
    !threadCanSend && e("p", { className: "md-sub" }, "ไม่สามารถส่งข้อความได้ในขณะนี้ (ไม่ได้เป็นเพื่อนหรือมีการบล็อก)"),
    threadError && e("p", { className: "md-sub" }, threadError),
    e("div", { className: "md-card", style: { display: "flex", gap: 6 } },
      e("input", {
        className: "md-field",
        style: { flex: 1 },
        placeholder: "พิมพ์ข้อความ... (สูงสุด 300 ตัวอักษร)",
        value: threadInput,
        maxLength: 300,
        disabled: !threadCanSend,
        onChange: (ev) => setThreadInput(ev.target.value),
        onKeyDown: (ev) => { if (ev.key === "Enter") handleSendDirect(); },
      }),
      e("button", { className: "md-btn small primary", disabled: threadSending || !threadInput.trim() || !threadCanSend, onClick: handleSendDirect }, "ส่ง")));

  const stickerPane = () => e("div", { className: "md-card", style: { flex: 1, display: "flex", alignItems: "center", justifyContent: "center" } },
    e("p", { className: "md-sub" }, "😄 สติกเกอร์ — เร็วๆ นี้"));

  return e("div", { className: "md-panel md-chat-page" },
    e("div", { className: "md-card", style: { marginBottom: 10 } },
      e("p", { className: "md-title" }, "💬 แชท")),
    e("div", { style: { display: "flex", gap: 6, marginBottom: 8 } },
      CHAT_TABS.map((t) => e("button", {
        key: t.key,
        className: "md-btn small" + (tab === t.key ? " primary" : " flee"),
        style: { flex: 1 },
        onClick: () => { setTab(t.key); if (t.key !== "direct") setActiveConversation(null); if (onChannelChange && t.key !== "sticker") onChannelChange(t.key); },
      }, t.label, t.key === "guild" && guildUnread ? " 🔴" : ""))),
    tab === "global" && globalPane(),
    tab === "guild" && guildPane(),
    tab === "direct" && (activeConversation ? threadPane() : conversationListPane()),
    tab === "sticker" && stickerPane(),
    e(BackButton, { onClick: () => (tab === "direct" && activeConversation) ? setActiveConversation(null) : onBack() }),
    e(GameDock, { onCharacter, onOpenInv, onPets, onSettings, onSave, onFriend, onGuild, onMainHub }));
}

  let rejectGate;
  const promise = new Promise((resolve, reject) => { resolveGate = resolve; rejectGate = reject; });
  const finish = (ok, value) => {
    if (settled) return;
    settled = true;
    if (timer) clearTimeout(timer);

// ===== ui/combatPresentationFix.js =====
// Presentation-only combat stability overrides.
// Keeps the battle log from changing outer layout height on first multi-enemy action,
// and renders a guaranteed-visible BEGIN! cue for the existing 800ms intro gate.
(() => {
  const STYLE_ID = "thornie-combat-presentation-fix-v1";

  function installCombatPresentationFix() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = `
/* The combat log is a sibling of .md-scene, not its child. Target the real DOM shape so
   long first-turn multi-monster messages cannot grow the bottom panel and shrink the arena. */
.md-root-combat > .md-panel {
  flex: 0 0 auto !important;
  min-height: 0 !important;
  padding: 6px 10px max(7px, env(safe-area-inset-bottom, 0px)) !important;
  border-top-width: 1px !important;
}
.md-root-combat > .md-panel .md-log {
  height: 50px !important;
  min-height: 50px !important;
  max-height: 50px !important;
  overflow: hidden !important;
  overscroll-behavior: none !important;
  padding: 5px 8px !important;
  gap: 1px !important;
  contain: size layout paint !important;
}
.md-root-combat > .md-panel .md-log-line {
  flex: 0 0 auto !important;
  min-height: 12px !important;
  font-size: 9px !important;
  line-height: 1.25 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.md-root-combat > .md-panel .md-log-line.latest {
  font-size: 10.5px !important;
}

/* The original component already owns the 800ms gameplay presentation gate. Render the cue
   from the battlefield itself so reduced-motion settings cannot collapse it to a 1ms flash. */
.md-root-combat .md-battle-intro {
  display: none !important;
}
.md-root-combat .md-scene.battle-bg::after {
  content: "BEGIN!";
  position: absolute;
  left: 50%;
  top: 48%;
  z-index: 40;
  transform: translate(-50%, -50%) scale(1);
  color: #fff1ad;
  font: 800 clamp(34px, 11vw, 52px)/1 'Baloo 2', sans-serif;
  letter-spacing: .08em;
  text-shadow: 0 3px 0 #6c3d13, 0 0 18px rgba(255,209,102,.9);
  pointer-events: none;
  opacity: 0;
  animation: md-battle-begin-stable 800ms linear both;
}
@keyframes md-battle-begin-stable {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.86); }
  10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  68% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -56%) scale(1.04); }
}

@media (max-width: 380px) {
  .md-root-combat > .md-panel .md-log {
    height: 44px !important;
    min-height: 44px !important;
    max-height: 44px !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .md-root-combat .md-scene.battle-bg::after {
    animation-name: md-battle-begin-reduced !important;
  }
  @keyframes md-battle-begin-reduced {
    0%, 82% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
}
`;
    document.head.appendChild(style);
  }

  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", installCombatPresentationFix, { once: true });

    installCombatPresentationFix();
  }
})();
