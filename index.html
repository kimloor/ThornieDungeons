<script>
  // Runtime errors are queued until React mounts the central game error boundary.
  // This replaces the retired boot-error popup so gameplay errors are reported by one
  // game-wide diagnostic surface instead of an early boot-only handler.
  window.__thornieRuntimeQueue = window.__thornieRuntimeQueue || [];
  window.__thornieCaptureRuntimeError = function(kind, message, error, source, line, column) {
    // Browsers hide the details of errors thrown by foreign (cross-origin) scripts or extensions and report only
    // "Script error." with no file/line. The game's own code is same-origin and always carries them, so these
    // opaque events are counted but never shown as a game crash.
    if (kind === 'window_error' && String(message || '') === 'Script error.' && !source && !(Number(line) > 0) && !(error && error.message)) {
      window.__thornieOpaqueScriptErrors = (window.__thornieOpaqueScriptErrors || 0) + 1;
      return;
    }
    var detail = {
      event: String(kind || 'runtime_error'),
      message: String(error && error.message || message || 'Unknown runtime error'),
      source: String(source || ''),
      line: Number(line) || 0,
      column: Number(column) || 0,
      stack: String(error && error.stack || ''),
      time: new Date().toISOString()
    };
    window.__thornieRuntimeQueue.push(detail);
    if (window.__thornieRuntimeQueue.length > 8) window.__thornieRuntimeQueue.shift();
    if (typeof window.__thornieReportRuntimeError === 'function') {
      window.__thornieReportRuntimeError(detail);
    }
  };
  window.addEventListener('error', function(e) {
    window.__thornieCaptureRuntimeError('window_error', e && e.message, e && e.error, e && e.filename, e && e.lineno, e && e.colno);
  });
  window.addEventListener('unhandledrejection', function(e) {
    var reason = e && e.reason;
    window.__thornieCaptureRuntimeError('unhandled_rejection', reason && reason.message ? reason.message : String(reason || 'Unknown rejection'), reason instanceof Error ? reason : null);
  });
  window.__thornieBootTimer = setTimeout(function() {
    if (typeof React === 'undefined') {
      window.__thornieCaptureRuntimeError('boot_failure', 'React failed to load from CDN (unpkg.com).');
    } else if (typeof ReactDOM === 'undefined') {
      window.__thornieCaptureRuntimeError('boot_failure', 'ReactDOM failed to load from CDN (unpkg.com).');
    } else {
      window.__thornieCaptureRuntimeError('boot_timeout', 'Scripts loaded but the game never rendered.');
    }
  }, 6000);
</script>
