// ===== state/save.js =====
// ---------- cloud persistence (Cloudflare D1 via Worker API) ----------
const CONFIG_CACHE_KEY = "thornie-dungeons-cloud-config-v1"; // caches {url,id} only — never the password
const GAME_CONFIG_CACHE_KEY = "thornie-dungeons-game-config-v2"; // caches monster/equipment/pet/skill balance data
const RECIPES_CACHE_KEY = "thornie-dungeons-recipes-v1"; // caches crafting recipes (Phase 4 refactor)
const MONSTER_LOOT_CACHE_KEY = "thornie-dungeons-monster-loot-v1"; // caches per-monster loot tables
const JUNK_INFO_CACHE_KEY = "thornie-dungeons-junk-info-v1"; // caches material names/icons (admin.html)
const DEFAULT_SERVER_URL = "https://thornie-dungeons-api.ekqtjl.workers.dev";

// ---------- save schema version ----------
// v4: switched to the schema-v2 API worker — each character now has its own real row in a
// `characters` table server-side (character_id primary key), instead of being squeezed into a
// single JSON blob column that the old worker's D1 schema didn't even have a column for (the
// actual root cause of the "a character disappeared" bug: the client was correctly sending a
// `materials_json` field every save, but the server's fixed INSERT column list silently dropped
// anything not in it — confirmed by testing directly against the real worker logic with SQLite).
// The server is now the authority on which characters exist; this file's job is just to hold
// and safely shape whatever it returns, not to reconstruct/migrate that structure itself.
const CURRENT_SAVE_VERSION = 4;
const MAX_CHARACTER_SLOTS = 3;

// ---------- safe parsing primitives ----------
// Number(x)||0 silently turns a *legitimate* 0 into the fallback in some call sites and doesn't
// protect against NaN/Infinity from corrupted data — this is the one safe primitive everything
// below (and serialize.js) should use instead of ad-hoc `Number(x) || fallback`.
function numOr(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

// Safe JSON.parse that never throws — used for anything read from localStorage or a server JSON
// column (e.g. an item's extra_json, a character's pets_json), where the raw string could be
// missing, truncated, or otherwise corrupted.
function safeJsonParse(str, fallback = null) {
  if (!str) return fallback;
  try {
    const parsed = JSON.parse(str);
    return parsed === null || parsed === undefined ? fallback : parsed;
  } catch (e) {
    console.warn("[ThornieDungeons] Failed to parse stored JSON, using fallback.", e);
    return fallback;
  }
}

// ---------- two distinct shapes in this file — don't mix them up ----------
// 1. ACCOUNT save ({saveVersion, diamonds, activeSlot, characters}): built fresh from the
//    server's `login` response every session — never itself round-tripped back to the server
//    as one blob (each field is written back through its own dedicated endpoint instead:
//    createCharacter / deleteCharacter / saveCharacterProgress / syncItems / saveRunState).
// 2. CHARACTER SLOT (defaultCharacterSlot / characterFromServerRow): one character's own
//    progression — name, level, stats, gold, floor, pets, etc.
//
// The rest of the app (combat/shop/blacksmith/inventory/etc) still works with a single flat
// "runtime save" shaped like the pre-multi-character defaultSave() output
// ({gold, character:{...}, pets, unlockedFloor, ...}) — see flattenCharacterForRuntime() /
// packRuntimeIntoSlot() below, which convert between that flat shape and one account slot.
// This means none of the ~50 call sites throughout the game that read `save.gold` /
// `save.character` needed to change for any of this.

const defaultCharacterSlot = () => ({
  id: null,
  name: "",
  level: 1,
  xp: 0,
  statPoints: 0,
  stats: {
    str: 0,
    vit: 0,
    agi: 0,
    dex: 0,
    luk: 0
  },
  skillLevels: {},
  gold: 0,
  unlockedFloor: 1,
  potions: 2,
  pets: [],
  petDuplicates: {},
  activePetId: null,
  protectionStones: 0,
  chestPity: 0
});

// Converts one `characters` table row (snake_case, straight from the server) into the client's
// camelCase slot shape. Defensive the same way the old hydration layer was — a garbled/partial
// row should never let NaN or undefined leak into gameplay math.
function characterFromServerRow(row) {
  if (!row) return null;
  // pets_json holds either the legacy shape (a plain array of pet instances) or the current
  // shape ({list, dup}) that also carries the star-up duplicate pool — same column, no new
  // schema needed, just a richer JSON payload. Both are handled here so old saves keep loading.
  const petsRaw = safeJsonParse(row.pets_json, []);
  const pets = Array.isArray(petsRaw) ? petsRaw : (Array.isArray(petsRaw?.list) ? petsRaw.list : []);
  const petDuplicates = Array.isArray(petsRaw) ? {} : (petsRaw && typeof petsRaw.dup === "object" && petsRaw.dup ? petsRaw.dup : {});
  const skillLevels = Array.isArray(petsRaw) ? {} : (petsRaw && typeof petsRaw.skills === "object" && petsRaw.skills ? petsRaw.skills : {});
  return {
    id: row.character_id,
    name: row.name || "",
    level: numOr(row.level, 1),
    xp: numOr(row.xp, 0),
    statPoints: numOr(row.stat_points, 0),
    stats: {
      str: numOr(row.str, 0),
      vit: numOr(row.vit, 0),
      agi: numOr(row.agi, 0),
      dex: numOr(row.dex, 0),
      luk: numOr(row.luk, 0)
    },
    skillLevels,
    gold: numOr(row.gold, 0),
    unlockedFloor: numOr(row.unlocked_floor, 1),
    potions: row.potions === undefined || row.potions === null ? 2 : numOr(row.potions, 0),
    pets: Array.isArray(pets) ? pets : [],
    petDuplicates,
    activePetId: row.active_pet_id || null,
    protectionStones: numOr(row.protection_stones, 0),
    chestPity: numOr(row.chest_pity, 0)
  };
}

function defaultSave() {
  return {
    saveVersion: CURRENT_SAVE_VERSION,
    diamonds: 0,
    activeSlot: null,
    characters: new Array(MAX_CHARACTER_SLOTS).fill(null)
  };
}

// Builds the account shape straight from a fresh `login` (or post-create/delete refresh)
// response — this is the ONE place server data becomes the client's account state, so every
// field here is read defensively (numOr/Array checks) in case of a partial/odd response.
function accountFromLoginResponse(res) {
  const characters = new Array(MAX_CHARACTER_SLOTS).fill(null);
  (Array.isArray(res.characters) ? res.characters : []).forEach(row => {
    const slot = Number(row.slot_index);
    if (Number.isInteger(slot) && slot >= 0 && slot < MAX_CHARACTER_SLOTS) {
      characters[slot] = characterFromServerRow(row);
    }
  });
  const rawActiveSlot = res.player && res.player.activeSlot;
  const activeSlot = Number.isInteger(rawActiveSlot) && characters[rawActiveSlot] ? rawActiveSlot : null;
  return {
    saveVersion: CURRENT_SAVE_VERSION,
    diamonds: numOr(res.player && res.player.diamonds, 0),
    activeSlot,
    characters
  };
}

// Case-insensitive, whitespace-trimmed check for whether `name` is already used by any occupied
// slot on THIS account. Used for instant client-side feedback before even hitting the server;
// the server (handleCreateCharacter) enforces the same rule authoritatively, so this is purely a
// UX nicety, not the actual guarantee — a name collision from a race between two tabs would
// still be caught (and reported) by the server's response.
function isCharacterNameTaken(account, name) {
  const norm = String(name || "").trim().toLowerCase();
  if (!norm) return false;
  return account.characters.some(c => c && c.name.trim().toLowerCase() === norm);
}

// ---------- flat "runtime save" <-> account character slot adapters ----------
// See the big comment near the top of this file for why these exist.

function flattenCharacterForRuntime(account, slotIndex) {
  const slot = account.characters[slotIndex];
  if (!slot) return null;
  return {
    saveVersion: account.saveVersion,
    diamonds: account.diamonds,
    gold: slot.gold,
    unlockedFloor: slot.unlockedFloor,
    potions: slot.potions,
    pets: slot.pets,
    petDuplicates: slot.petDuplicates || {},
    activePetId: slot.activePetId,
    protectionStones: slot.protectionStones,
    chestPity: slot.chestPity,
    character: {
      level: slot.level,
      xp: slot.xp,
      statPoints: slot.statPoints,
      skillLevels: { ...(slot.skillLevels || {}) },
      stats: {
        ...slot.stats
      }
    },
    // Not read by any existing gameplay code — kept only so App.js can address this character
    // in server calls (saveCharacterProgress/syncItems/saveRunState all need characterId) and
    // show its name in the UI, without a second piece of state.
    characterId: slot.id,
    characterName: slot.name
  };
}

// ---------- quick slots (client-side only — no D1 schema change needed) ----------
// 4 combat quick slots, each either null or { kind: "skill", key } / { kind: "potion", potionId }.
// Stored via kvGet/kvSet (localStorage, same fallback used elsewhere) and namespaced per
// player+character so switching characters/accounts never bleeds one character's slots into
// another's, same reasoning as the per-character `thornie-run-*` resume key.
function quickSlotsStorageKey(userId, characterId) {
  return `thornie-quickslots-${userId}-${characterId}`;
}
async function loadQuickSlots(userId, characterId) {
  const raw = await kvGet(quickSlotsStorageKey(userId, characterId));
  const parsed = safeJsonParse(raw, null);
  if (Array.isArray(parsed) && parsed.length === 4) return parsed;
  return [null, null, null, null];
}
async function saveQuickSlotsLocal(userId, characterId, slots) {
  await kvSet(quickSlotsStorageKey(userId, characterId), JSON.stringify(slots));
}

function packRuntimeIntoSlot(existingSlot, flatSave) {
  return {
    ...existingSlot,
    level: flatSave.character.level,
    xp: flatSave.character.xp,
    statPoints: flatSave.character.statPoints,
    skillLevels: { ...(flatSave.character.skillLevels || {}) },
    stats: {
      ...flatSave.character.stats
    },
    gold: flatSave.gold,
    unlockedFloor: flatSave.unlockedFloor,
    potions: flatSave.potions,
    pets: flatSave.pets,
    petDuplicates: flatSave.petDuplicates || {},
    activePetId: flatSave.activePetId,
    protectionStones: flatSave.protectionStones,
    chestPity: flatSave.chestPity
  };
}

// ===== assets/loader.js =====
// ---------- R2 Asset Loader ----------
const ASSET_BASE = "/assets/";

function assetUrl(path) {
  if (!path) return "";
  return ASSET_BASE + String(path).replace(/^\/+/, "");
}

async function fetchAsset(path, options = {}) {
  const response = await fetch(assetUrl(path), options);

  if (!response.ok) {
    throw new Error(
      `Asset request failed: ${response.status} ${response.statusText}: ${path}`
    );
  }

  return response;
}

async function loadAssetText(path) {
  const response = await fetchAsset(path);
  return response.text();
}

async function loadAssetJSON(path, options = {}) {
  const response = await fetchAsset(path, options);
  return response.json();
}

function preloadAsset(path) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = () => {
      reject(new Error(`Failed to load image asset: ${path}`));
    };

    img.src = assetUrl(path);
  });
}

// ===== assets/manifest.js =====
// ---------- R2 Asset Manifest ----------
let ASSETS = {};

async function loadAssetManifest() {
  // R2 serves assets with a long max-age. A unique query plus no-store prevents
  // Safari and Cloudflare edge caches from keeping an older manifest after the
  // object is replaced under the same key.
  const manifest = await loadAssetJSON(`manifest.json?v=${Date.now()}`, { cache: "no-store" });
  ASSETS = manifest.assets || {};
  console.log("Asset Manifest loaded:", manifest);
  return ASSETS;
}

function asset(key) {
  const path = key.split(".").reduce((obj, part) => obj?.[part], ASSETS);
  if (!path || typeof path !== "string") {
    console.warn(`Asset not found in manifest: ${key}`);
    return "";
  }
  return assetUrl(path);
}

function optionalAsset(key) {
  const path = key.split(".").reduce((obj, part) => obj?.[part], ASSETS);
  return typeof path === "string" && path ? assetUrl(path) : "";
}

function battleUiStyle(key) {
  const src = optionalAsset(`battleUi.${key}`);
  return src ? { "--battle-ui-image": `url("${src}")` } : undefined;
}

const IMAGE_PRELOAD_CACHE = new Map();
function preloadAssetImage(src) {
  if (!src || typeof Image === "undefined") return Promise.resolve();
  if (!IMAGE_PRELOAD_CACHE.has(src)) {
    IMAGE_PRELOAD_CACHE.set(src, new Promise(resolve => {
      const image = new Image();
      image.decoding = "async";
      image.onload = image.onerror = () => resolve();
      image.src = src;
    }));
  }
  return IMAGE_PRELOAD_CACHE.get(src);
}

function preloadAssetImages(sources, timeoutMs = 0) {
  const loading = Promise.all([...new Set((sources || []).filter(Boolean))].map(preloadAssetImage));
  return timeoutMs ? Promise.race([loading, new Promise(resolve => setTimeout(resolve, timeoutMs))]) : loading;
}

function spriteAnimationSources(config, names) {
  return (names || []).flatMap(name => getSpriteAnimationFrames(config, name, name === "death"));
}

function battleUiAssetUrls() {
  return ["topBar", "quickSlotFrame", "buttons.auto", "buttons.flee", "buttons.settings", "buttons.attack", "hpStatusFrame"]
    .map(key => optionalAsset(`battleUi.${key}`)).filter(Boolean);
}

function battleEncounterSources({ equipped = {}, pet = null, monsters = [] } = {}, deferred = false) {
  const sources = deferred ? [] : battleUiAssetUrls();
  const selection = heroVisualSelectionFromEquipment(equipped);
  const heroConfig = getHeroV3Config("hero001");
  if (deferred) {
    const count = Array.isArray(heroConfig?.base?.attack) ? heroConfig.base.attack.length : 0;
    for (let i = 0; i < count; i += 1) {
      (resolveHeroV3Layers("hero001", selection, "attack", i) || []).forEach(layer => sources.push(layer.url));
    }
  } else {
    (resolveHeroV3Layers("hero001", selection, "idle", 0) || []).forEach(layer => sources.push(layer.url));
  }
  if (pet) sources.push(...spriteAnimationSources(getPetSpriteConfig(pet.defId), deferred ? ["attack", "death"] : ["idle"]));
  (monsters || []).forEach(enemy => {
    sources.push(...spriteAnimationSources(getMonsterSpriteConfig(enemy), deferred ? ["attack", "death"] : ["idle"]));
  });
  return sources;
}

function preloadBattleCriticalAssets(encounter) {
  const settled = preloadAssetImages(battleEncounterSources(encounter, false));
  const ready = Promise.race([
    settled,
    new Promise(resolve => setTimeout(resolve, 1200))

    }
  }
  return lastResult;
}

// If an identical request (same URL + body) is already in flight, piggyback on that same
// promise instead of firing a second one — this is what actually prevents duplicate network
// requests when a handler somehow gets invoked twice in quick succession (double-tap, retry
// logic elsewhere, etc), independent of any UI-level lock.
const _inFlight = new Map();
function dedupeKey(url, body) {
  return url + "::" + JSON.stringify(body);
}
function withDedupe(key, fn) {
  if (_inFlight.has(key)) return _inFlight.get(key);
  const p = fn().finally(() => _inFlight.delete(key));
  _inFlight.set(key, p);
  return p;
}

async function cloudGet(url, params) {
  const qs = new URLSearchParams(params).toString();
  const fullUrl = `${url}?${qs}`;
  return withDedupe(fullUrl, () => withRetry(async () => {
    try {
      const res = await fetch(fullUrl);
      return await res.json();
    } catch (e) {
      return {
        error: "network_error"
      };
    }
  }));
}
async function cloudPost(url, body) {
  return withDedupe(dedupeKey(url, body), () => withRetry(async () => {
    try {
      const res = await fetch(url, {
        method: "POST",
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (e) {
      return {
        error: "network_error"
      };
    }
  }));
}

// ===== data/gameConfig.js =====
// Applies a fetched game-balance config on top of the hardcoded defaults below.
// Every field is validated defensively — a partial or malformed sheet should never crash the game;
// missing/invalid pieces just keep their current (default) values.
function applyGameConfig(cfg) {
  if (!cfg || cfg.error) return;
  try {
    if (Array.isArray(cfg.monsters) && cfg.monsters.length) {
      const normal = cfg.monsters.filter(m => !m.isBoss).map(monsterFromConfig);
      const bosses = cfg.monsters.filter(m => m.isBoss).map(monsterFromConfig);
      if (normal.length) ENEMY_POOL = normal;
      if (bosses.length) BOSS_POOL = bosses;
    }
  } catch (e) {}
  try {
    const n = cfg.equipmentNames;
    if (n && Array.isArray(n.weapon) && n.weapon.length) WEAPON_NAMES = n.weapon;
    if (n && Array.isArray(n.helmet) && n.helmet.length) HELMET_NAMES = n.helmet;
    if (n && Array.isArray(n.chest) && n.chest.length) CHEST_NAMES = n.chest;
    if (n && Array.isArray(n.gloves) && n.gloves.length) GLOVES_NAMES = n.gloves;
    if (n && Array.isArray(n.boots) && n.boots.length) BOOTS_NAMES = n.boots;
    if (n && Array.isArray(n.accessory) && n.accessory.length) ACCESSORY_NAMES = n.accessory;
  } catch (e) {}
  try {
    const rm = cfg.rarityMult;
    if (rm && typeof rm.rare === "number" && typeof rm.unique === "number" && typeof rm.elite === "number") {
      RARITY_MULT = {
        rare: rm.rare,
        unique: rm.unique,
        elite: rm.elite,
        mythic: typeof rm.mythic === "number" ? rm.mythic : RARITY_MULT.mythic,
        azure: typeof rm.azure === "number" ? rm.azure : RARITY_MULT.azure
      };
    }
  } catch (e) {}
  try {
    if (Array.isArray(cfg.pets) && cfg.pets.length) {
      const valid = cfg.pets.filter(p => p && p.id && p.rarity && p.active && p.active.type);
      if (valid.length) PET_POOL = valid;
    }
  } catch (e) {}
  try {
    if (Array.isArray(cfg.skills) && cfg.skills.length) {
      const valid = cfg.skills.filter(s => s && s.key && s.type);
      if (valid.length) SKILLS = valid.sort((a, b) => a.unlockLevel - b.unlockLevel);
    }
  } catch (e) {}
}
// Slugify fallback for a monster that's genuinely new (added via remote config with no
// matching static entry and no explicit id supplied) — should rarely trigger in practice
// since real monster ids should always be assigned explicitly going forward.
function slugifyMonsterName(name) {
  return String(name || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "unknown_monster";
}
// BUG FIX (prerequisite for per-monster loot tables): this used to drop `id` entirely, so
// ANY monster overridden via remote config silently lost its stable identity — harmless
// while nothing read monster.id besides makeEnemy's display/uid, but fatal once loot
// tables need to join on it. Preference order: explicit `m.id` from config > matching
// static ENEMY_POOL/BOSS_POOL entry by name (covers today's config, which only overrides
// name/color/mults) > slugified name as a last resort so id is never undefined.
function monsterFromConfig(m) {
  const staticMatch = (ENEMY_POOL || []).find(s => s.name === m.name) || (BOSS_POOL || []).find(s => s.name === m.name);
  return {
    id: m.id || (staticMatch && staticMatch.id) || slugifyMonsterName(m.name),
    name: m.name,
    color: m.color || "#7ED9A8",
    sizeClass: ["small", "medium", "large"].includes(m.sizeClass) ? m.sizeClass : staticMatch?.sizeClass || "medium",
    anchorType: m.anchorType === "flying" ? "flying" : staticMatch?.anchorType || "ground",
    hpMult: typeof m.hpMult === "number" ? m.hpMult : 1,
    atkMult: typeof m.atkMult === "number" ? m.atkMult : 1,
    defBonus: typeof m.defBonus === "number" ? m.defBonus : 0,
    goldMult: typeof m.goldMult === "number" ? m.goldMult : 1,
    xpMult: typeof m.xpMult === "number" ? m.xpMult : 1
  };
}

// ---------- character progress <-> server (schema v2: real per-character rows) ----------
// Maps the flat "runtime save" (see save.js) into the field names
// handleSaveCharacterProgress on the server expects — a plain, mostly 1:1 mapping now that
// each character has its own real columns server-side, instead of the old JSON-blob-inside-a-
// single-shared-row trick that turned out to silently drop data (the server's fixed column
// list never even included that blob's column).
function characterProgressToServer(flatSave) {
  return {
    level: flatSave.character.level,
    xp: flatSave.character.xp,
    stat_points: flatSave.character.statPoints,
    str: flatSave.character.stats.str,

    // persistent without a production D1 schema migration.

    }),

  };
}

// ---------- items <-> server ----------
// No characterId tagging needed here anymore — syncItems takes characterId as its own
// authenticated top-level parameter (see App.js's pushItems), and the server stamps every row
// with THAT value server-side rather than trusting anything the client puts in extra_json. This
// is what makes it structurally impossible for syncing one character's inventory to touch
// another's: the server's delete-stale-rows query is scoped by character_id, not just player_id.
function itemsToServerList(inventory, equipped) {
  const list = [];
  const pack = (it, equippedFlag) => ({
    itemId: it.id,
    slotType: it.type,
    equipped: equippedFlag,
    rarity: it.rarity,
    name: it.name,
    atk: it.atk,
    def: it.def,
    hp: it.hp,
    mp: it.mp,
    enhanceLevel: it.enhanceLevel || 0,
    // dodgeChance/critChance/critDamage (accessory base rolls) and junk/potion stack data
    // (junkId/potionId/quantity/icon) don't have their own server columns, so they ride along
    // inside the extra JSON blob instead (this part is unaffected by the schema-v2 change — the
    // items table's extra_json column was always real, unlike progress.materials_json).
    extra: {
      empowerSlots: it.empowerSlots || [],
      dodgeChance: it.dodgeChance || undefined,
      critChance: it.critChance || undefined,
      critDamage: it.critDamage || undefined,
      junkId: it.junkId || undefined,
      potionId: it.potionId || undefined,
      quantity: it.quantity || undefined,
      icon: it.icon || undefined,
      setId: it.setId || undefined,
      star: it.star || undefined,
      craftRecipeId: it.craftRecipeId || undefined
    }
  });
  Object.values(equipped).forEach(it => {
    if (it) list.push(pack(it, true));
  });
  inventory.forEach(it => list.push(pack(it, false)));
  return list;
}
function itemsFromServerList(rows) {
  const equipped = emptyEquipped();
  const inventory = [];
  if (!Array.isArray(rows)) return {
    equipped,
    inventory
  };
  rows.forEach(r => {
    // A single malformed row (bad JSON, unexpected type, etc) should never take down the whole
    // inventory load — skip just that row and keep processing the rest.
    try {
      const extra = safeJsonParse(r.extra_json, {});
      if (r.slot_type === "junk") {
        inventory.push({
          id: r.item_id,
          type: "junk",
          junkId: extra.junkId,
          name: r.name,
          icon: extra.icon || (JUNK_INFO[extra.junkId] || {}).icon || "📦",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1)
        });
        return;
      }
      if (r.slot_type === "potion") {
        const def = getPotionDef(extra.potionId);
        inventory.push({
          id: r.item_id,
          type: "potion",
          potionId: extra.potionId,
          name: r.name || (def && def.name) || "Potion",
          icon: extra.icon || (def && def.icon) || "🧪",
          rarity: r.rarity || "common",
          quantity: numOr(extra.quantity, 1)
        });
        return;
      }
      const it = {
        id: r.item_id,
        type: r.slot_type,
        rarity: r.rarity,
        name: r.name,
        atk: numOr(r.atk, 0),
        def: numOr(r.def, 0),
        hp: numOr(r.hp, 0),
        mp: numOr(r.mp, 0),
        dodgeChance: numOr(extra.dodgeChance, 0),
        critChance: numOr(extra.critChance, 0),
        critDamage: numOr(extra.critDamage, 0),
        enhanceLevel: numOr(r.enhance_level, 0),
        empowerSlots: Array.isArray(extra.empowerSlots) ? extra.empowerSlots : Array(RARITY_STARS[r.rarity] || 1).fill(null)
      };
      if (extra.setId) it.setId = extra.setId;
      if (extra.star) it.star = numOr(extra.star, 0);
      if (extra.craftRecipeId) it.craftRecipeId = extra.craftRecipeId;
      ["atk", "def", "hp", "mp", "dodgeChance", "critChance", "critDamage"].forEach(k => {
        if (!it[k]) delete it[k];
      });
      if (String(r.equipped) === "1" || r.equipped === true) equipped[r.slot_type] = it;else inventory.push(it);
    } catch (e) {
      console.warn("[ThornieDungeons] Skipped a corrupted item row:", e);
    }
  });
  return {
    equipped,
    inventory
  };
}

function unlockedSkills(level) {

}

// Existing characters receive their full budget from their current level. Only committed
// levels are stored; a missing entry is Lv.1, so old saves migrate without a data rewrite.
function totalSkillPointBudget(level) {
  return Math.max(0, Math.floor((Number(level) || 0) / 5));
}
function committedSkillLevel(save, skillKey) {
  const raw = save?.character?.skillLevels?.[skillKey];
  return Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(raw) || 1)));
}
function spentSkillPoints(save) {
  return Object.keys(save?.character?.skillLevels || {}).reduce((sum, key) => {
    return sum + Math.max(0, committedSkillLevel(save, key) - 1);
  }, 0);
}
function remainingSkillPoints(save) {
  return Math.max(0, totalSkillPointBudget(save?.character?.level) - spentSkillPoints(save));
}
function skillAtLevel(skill, level) {
  const lv = Math.max(1, Math.min(SKILL_MAX_LEVEL, Math.floor(Number(level) || 1)));
  const bonusLevels = lv - 1;
  const next = { ...skill, skillLevel: lv };
  if (Number.isFinite(skill.mult)) next.mult = roundTo(skill.mult * (1 + bonusLevels * 0.08), 2);

    let statPoints = save.character.statPoints;

  function tickPlayerBuffs() {
