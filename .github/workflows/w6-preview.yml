name: W6 isolated Phaser preview

on:
  push:
    branches:
      - "feat/w6-shared-phaser-architecture"
    paths:
      - ".github/workflows/w6-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thornie-w6-phaser-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      WORKER_NAME: thorniedungeons-phaser-preview
      PREVIEW_URL: https://thorniedungeons-phaser-preview.ekqtjl.workers.dev

    steps:
      - name: Checkout W6 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build W6 frontend
        run: |
          set -euo pipefail
          node build.js
          grep -q 'phaserBattle' index.html

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami >/dev/null

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          wrangler deploy --config wrangler.jsonc --name "$WORKER_NAME"

      - name: Verify preview routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PREVIEW_URL/"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PREVIEW_URL/?phaserBattle=1"

      - name: Preview summary
        shell: bash
        run: |
          {
            echo "## W6 isolated preview"
            echo ""
            echo "- Worker: `$WORKER_NAME`"
            echo "- Branch: `feat/w6-shared-phaser-architecture`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Phaser URL: $PREVIEW_URL/?phaserBattle=1"
            echo "- DOM URL: $PREVIEW_URL/"
            echo "- Production Worker: **not modified**"
          } >> "$GITHUB_STEP_SUMMARY"
