name: Temporary Post-W6 Audit QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused security and authority regression
        run: >-
          node --test --test-concurrency=1
          tests/auth-v2.test.js
          tests/auth-client.test.js
          tests/auth-gameplay-callers.test.js
          tests/admin-v2-auth.test.js
          tests/w5-5-security-hardening.test.js
          tests/save-reliability.test.js
          tests/mail-claim-inventory-overflow.test.js
          tests/raid-arena-auth-contract.test.js
          tests/guild-donation-v1.test.js
          tests/guild-chat-v1.test.js
          tests/w6-v2-cutover.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js
      - name: Shared module syntax
        run: node --check workers/modules/auth.js && node --check workers/modules/shared.js
