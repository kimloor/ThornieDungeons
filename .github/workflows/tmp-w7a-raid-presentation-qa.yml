name: Temporary W7A Raid presentation QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused W7A Raid regression
        run: >-
          node --test --test-concurrency=1
          tests/w7a-raid-presentation.test.js
          tests/raid-wings-v2.test.js
          tests/raid-arena-auth-contract.test.js
          tests/phaser-foundation.test.js
          tests/phaser-shared-architecture.test.js
          tests/w7a-terminal-presentation.test.js
          tests/w7a-boss-enrage-presentation.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Commit regenerated index
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: regenerate index for W7A Raid presentation"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
