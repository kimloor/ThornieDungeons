name: W9 Browser QA Batch 2

on:
  push:
    branches:
      - "fix/w9-browser-qa-batch2"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js
      - name: Verify generated frontend
        run: |
          node build.js
          git diff --exit-code -- index.html
      - name: Browser QA regression
        run: |
          node --test --test-concurrency=1             tests/phaser-foundation.test.js             tests/phaser-shared-architecture.test.js             tests/w8-hero-preview.test.js             tests/arena-v2-w9-server-foundation.test.js             tests/arena-v2-w98-w99.test.js             tests/responsive-layout.test.js             tests/navigation-settings.test.js
