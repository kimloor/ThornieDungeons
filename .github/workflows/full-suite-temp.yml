name: Full Suite Temporary QA
on:
  push:
    branches:
      - fix/post95-latency-v2
      - fix/enrage-compare-ui-v1
jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - run: git diff --exit-code -- index.html
      - run: git diff --check
      - run: node --test --test-concurrency=2 tests/*.test.js
