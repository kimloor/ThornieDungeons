name: W9 Browser QA Batch 1

on:
  push:
    branches:
      - "fix/w9-browser-qa-batch1"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check workers/thornie-dungeons-api.js
      - name: Build is current
        run: |
          node build.js
          git diff --exit-code -- index.html
      - name: W9 browser fix regression
        run: |
          node --test             tests/arena-v2-w98-w99.test.js             tests/arena-v2-w9-server-foundation.test.js             tests/arena-v2-w9-match-lifecycle.test.js             tests/arena-v2-w9-combat.test.js             tests/arena-v2-w9-settlement.test.js             tests/raid-arena-auth-contract.test.js             tests/responsive-layout.test.js
