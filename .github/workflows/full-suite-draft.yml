name: Full suite draft QA

on:
  push:
    branches:
      - "fix/full-suite-green-v1"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: node build.js
      - name: Generated output unchanged
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Full test suite
        run: node --test --test-concurrency=2 tests/*.test.js
