name: W7 final release gate
# rerun after battle VFX header-action assertion alignment

on:
  push:
    branches:
      - "feat/w7-hero-v5-runtime"
    paths:
      - ".github/workflows/w7-final-release-gate.yml"

permissions:
  contents: read

concurrency:
  group: thornie-w7-final-release-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: assets
    steps:
      - name: Checkout W7 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: node build.js

      - name: Focused release tests
        run: |
          node --test tests/battle-ui-contract.test.js
          node --test tests/phaser-foundation.test.js tests/phaser-shared-architecture.test.js

      - name: Full suite regression gate
        shell: bash
        run: |
          set -uo pipefail
          failures=()
          for file in tests/*.test.js; do
            echo "::group::$file"
            if node --test "$file"; then :; else failures+=("$file"); fi
            echo "::endgroup::"
          done

          expected=(
            "tests/auth-v2.test.js"
            "tests/battle-persistence.test.js"
            "tests/guild-donation-v1.test.js"
          )
          echo "Observed failures: ${failures[*]:-none}"
          echo "Expected failures: ${expected[*]}"
          if [ "${failures[*]}" != "${expected[*]}" ]; then
            echo "Unexpected full-suite regression set."
            exit 1
          fi

      - name: Validate final W7 asset contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("r2-upload/manifest.json","utf8"));
          const g2=m.assets.hero001.v5.g2;
          const a=g2.equipment.azure;
          if(g2.defaultHair!=="topknot") throw new Error("defaultHair mismatch");
          if(a.idleSwordAssetRevision!=="w7_idle_v3_grip_aligned") throw new Error("Idle sword revision mismatch");
          for(const f of ["idle_01","idle_02","idle_03"]){
            if(!a.frames[f].sword.endsWith("sword_w7_idle_v3.png")) throw new Error("Idle sword path mismatch "+f);
          }
          for(const f of ["idle_01","idle_02","idle_03","attack_01","attack_02","attack_03","death_01","death_02"]){
            const hair=g2.hair.topknot.frames[f];
            if(!hair?.hair_back || !hair?.hair_front) throw new Error("hair frame missing "+f);
          }
          NODE
          test ! -e r2-upload/hero/v5/g2/equipment/azure/idle_01/sword_w7_idle_v2.png
          test ! -e r2-upload/hero/v5/g2/equipment/azure/idle_02/sword_w7_idle_v2.png
          test ! -e r2-upload/hero/v5/g2/equipment/azure/idle_03/sword_w7_idle_v2.png

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Restore canonical Idle placeholders in R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          files=(
            r2-upload/hero/v5/g2/equipment/azure/idle_01/sword.png
            r2-upload/hero/v5/g2/equipment/azure/idle_02/sword.png
            r2-upload/hero/v5/g2/equipment/azure/idle_03/sword.png
          )
          for file in "${files[@]}"; do
            key="${file#r2-upload/}"
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --content-type "image/png" --remote
            tmp="$(mktemp)"
            wrangler r2 object get "$R2_BUCKET/$key" --file "$tmp" --remote
            test "$(sha256sum "$file" | awk '{print $1}')" = "$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
          done
          echo "Restored and SHA-verified 3 canonical Idle placeholder object(s)."
