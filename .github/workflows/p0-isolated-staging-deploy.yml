name: P0 isolated staging Worker deploy

# Tooling-only lane for Actual D1 security QA. The workflow must first be
# reviewed and merged to the default branch because workflow_dispatch does not
# run a new workflow that exists only on a feature branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thornie-dungeons-shared-staging-qa
  cancel-in-progress: false

jobs:
  deploy-p0-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
      EXPECTED_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      APPROVED_SOURCE_SHA: d128b96f3a652325de77592b3f5a859ad319dc5b
      WORKER_NAME: thornie-dungeons-p0-staging
      STAGING_DB_NAME: thornie-dungeons-staging
      STAGING_DB_ID: c16e0b11-cf83-468c-a533-0ecbf522082f
      PRODUCTION_DB_ID: 2f6d52b4-3de7-4e78-98d4-fc143a4d29e2
      WRANGLER_VERSION: 4.102.0

    steps:
      - name: Checkout exact approved PR #186 source
        uses: actions/checkout@v4
        with:
          ref: d128b96f3a652325de77592b3f5a859ad319dc5b
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
          git fetch --no-tags origin "+refs/pull/186/head:refs/remotes/origin/pr-186"
          test "$(git rev-parse refs/remotes/origin/pr-186)" = "$APPROVED_SOURCE_SHA" || {
            echo "PR #186 HEAD no longer matches the approved source SHA; refusing deployment."
            exit 1
          }
          git diff --quiet "$APPROVED_SOURCE_SHA" -- workers/thornie-dungeons-api.js workers/thornie-dungeons-api-entry.js

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate runtime entrypoint and binding contract
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/thornie-dungeons-api-entry.js
          test -f workers/thornie-dungeons-api.js
          node --check workers/thornie-dungeons-api-entry.js
          node --check workers/thornie-dungeons-api.js
          refs="$(rg -o 'env\??\.[A-Z][A-Z0-9_]*' workers/thornie-dungeons-api-entry.js workers/thornie-dungeons-api.js workers/modules/*.js \
            | sed -E 's/.*env\??\.//' | sort -u)"
          unexpected="$(printf '%s\n' "$refs" | grep -Ev '^(ADMIN_API_KEY|CORS_ALLOWED_ORIGINS|DB)$' || true)"
          test -z "$unexpected" || { echo "Unexpected required environment binding(s): $unexpected"; exit 1; }
          printf '%s\n' "$refs" | grep -qx DB
          echo "Required binding: DB. Optional ADMIN_API_KEY and CORS_ALLOWED_ORIGINS are intentionally not configured."

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION"
          test "$(wrangler --version | awk '{print $1}')" = "$WRANGLER_VERSION"

      - name: Validate dedicated staging credentials and D1 identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_STAGING_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_STAGING_ACCOUNT_ID"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || { echo "Staging account mismatch"; exit 1; }
          test "$STAGING_DB_ID" != "$PRODUCTION_DB_ID" || { echo "Refusing production D1 database id"; exit 1; }
          wrangler whoami >/dev/null
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          jq -e --arg id "$STAGING_DB_ID" --arg name "$STAGING_DB_NAME" \
            'any(.[]; ((.uuid // .id // "") == $id and .name == $name))' \
            "$RUNNER_TEMP/d1-list.json" >/dev/null || { echo "Staging D1 id/name mismatch"; exit 1; }

      - name: Refuse an existing or ambiguous Worker target
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/target-worker.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          case "$status" in
            404) echo "Confirmed isolated Worker target does not exist." ;;
            200) echo "Worker $WORKER_NAME already exists; refusing to overwrite unknown staging state."; exit 1 ;;
            *) echo "Unable to determine isolated Worker existence safely (HTTP $status)."; exit 1 ;;
          esac

      - name: Build isolated Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          runtime_config="$RUNNER_TEMP/wrangler.p0-staging.jsonc"
          jq -n \
            --arg name "$WORKER_NAME" \
            --arg db_name "$STAGING_DB_NAME" \
            --arg db_id "$STAGING_DB_ID" \
            '{
              name: $name,
              main: "workers/thornie-dungeons-api-entry.js",
              compatibility_date: "2026-08-25",
              workers_dev: true,
              placement: {mode: "smart"},
              d1_databases: [{binding: "DB", database_name: $db_name, database_id: $db_id}]
            }' > "$runtime_config"
          jq -e --arg worker "$WORKER_NAME" --arg db "$STAGING_DB_ID" --arg prod "$PRODUCTION_DB_ID" '
            .name == $worker and
            .main == "workers/thornie-dungeons-api-entry.js" and
            .workers_dev == true and
            (.d1_databases | length == 1) and
            (.d1_databases[0].binding == "DB") and
            (.d1_databases[0].database_id == $db) and
            (.d1_databases[0].database_id != $prod) and
            (has("routes") | not) and
            (has("triggers") | not) and
            (has("vars") | not)
          ' "$runtime_config" >/dev/null
          echo "runtime_config=$runtime_config" >> "$GITHUB_OUTPUT"

      - name: Verify migration 0031 record and required schema without applying migrations
        shell: bash
        env:
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
        run: |
          set -euo pipefail
          query() {
            local sql="$1" output="$2"
            wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$RUNTIME_CONFIG" --json --command "$sql" > "$output"
            jq -e 'all(.[]; .success == true)' "$output" >/dev/null
          }
          query "SELECT COUNT(*) AS n FROM d1_migrations WHERE name='0031_battle_authority_v1.sql'" "$RUNNER_TEMP/migration.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/migration.json")" = "1" || {
            echo "Migration 0031 is not recorded exactly once; refusing deployment."
            exit 1
          }
          query "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='battle_authority'" "$RUNNER_TEMP/table.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/table.json")" = "1"
          query "SELECT COUNT(*) AS n FROM pragma_table_info('battle_authority') WHERE name IN ('battle_id','character_id','state_rev','initial_state_json','state_json','outcome','last_action_key','last_action_request_json','last_action_result_json','settled_at','created_at','updated_at')" "$RUNNER_TEMP/columns.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/columns.json")" = "12"
          query "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='index' AND name IN ('idx_battle_authority_character_active','idx_battle_authority_character_updated')" "$RUNNER_TEMP/indexes.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/indexes.json")" = "2"
          query "SELECT COUNT(*) AS n FROM pragma_foreign_key_list('battle_authority') WHERE \"table\"='characters' AND \"from\"='character_id' AND \"to\"='character_id' AND on_delete='CASCADE'" "$RUNNER_TEMP/fk.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/fk.json")" = "1"
          query "PRAGMA foreign_key_check" "$RUNNER_TEMP/fk-check.json"
          test "$(jq '[.[].results[]?] | length' "$RUNNER_TEMP/fk-check.json")" = "0" || {
            echo "PRAGMA foreign_key_check reported violations; refusing deployment."
            exit 1
          }
          echo "Migration 0031 and battle_authority schema verified read-only; no migration command was run."

      - name: Wrangler dry run
        shell: bash
        run: wrangler deploy --dry-run --config "${{ steps.config.outputs.runtime_config }}"

      - name: Deploy isolated P0 staging Worker only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/deploy.log"
          wrangler deploy \
            --strict \
            --config "${{ steps.config.outputs.runtime_config }}" \
            --tag "$APPROVED_SOURCE_SHA" \
            --message "source_sha=$APPROVED_SOURCE_SHA; workflow_run=$GITHUB_RUN_ID" \
            2>&1 | tee "$deploy_log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | head -n1)"
          test -n "$url" || { echo "Unable to resolve isolated Worker URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed identity, sole D1 binding, source tag and no cron
        shell: bash
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/settings.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            > "$settings"
          jq -e --arg db "$STAGING_DB_ID" --arg sha "$APPROVED_SOURCE_SHA" '
            .success == true and
            (.result.bindings | length == 1) and
            any(.result.bindings[]; .name == "DB" and .type == "d1" and ((.database_id // .id // "") == $db)) and
            (.result.annotations["workers/tag"] == $sha)
          ' "$settings" >/dev/null || { echo "Deployed Worker identity, binding or source tag mismatch"; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
            > "$RUNNER_TEMP/schedules.json"
          jq -e '.success == true and (.result | length == 0)' "$RUNNER_TEMP/schedules.json" >/dev/null || {
            echo "Unexpected cron schedule found; refusing handoff."
            exit 1
          }
          curl --fail --silent --show-error --max-time 20 \
            "${{ steps.deploy.outputs.url }}?action=getGameConfig" \
            | jq -e '.ok == true' >/dev/null

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## P0 isolated staging Worker"
            echo ""
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- URL: \`${{ steps.deploy.outputs.url }}\`"
            echo "- Source SHA: \`$APPROVED_SOURCE_SHA\`"
            echo "- Entrypoint: \`workers/thornie-dungeons-api-entry.js\`"
            echo "- D1 binding: \`DB -> $STAGING_DB_NAME ($STAGING_DB_ID)\`"
            echo "- Production D1 refused: \`$PRODUCTION_DB_ID\`"
            echo "- Migration 0031: verified only; not applied"
            echo "- Routes: none configured"
            echo "- Cron: none configured and remote schedules verified empty"
            echo "- Production secrets: none configured"
            echo "- Actual D1 Security QA: not run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
