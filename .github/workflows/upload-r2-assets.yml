name: Upload R2 assets

on:
  push:
    branches:
      - main
    paths:
      - "r2-upload/**"
      - "ui/**"
      - ".github/workflows/upload-r2-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-asset-upload-main
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Collect assets
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/r2-files.list"
          : > "$list_file"

          # r2-upload/ remains the normal staging area. During the UI migration we also
          # upload the repository's ui/ artwork directly to the R2 ui/ namespace.
          if [ -d r2-upload ]; then find r2-upload -type f -print0 >> "$list_file"; fi
          if [ -d ui ]; then find ui -type f -print0 >> "$list_file"; fi

          upload_count=0
          while IFS= read -r -d '' file; do
            lower="${file,,}"
            case "$lower" in
              *.png|*.webp|*.jpg|*.jpeg|*.gif|*.svg|*.json|*.mp3|*.ogg|*.wav) upload_count=$((upload_count + 1)) ;;
              *) echo "Skip unsupported file: $file" ;;
            esac
          done < "$list_file"
          echo "count=$upload_count" >> "$GITHUB_OUTPUT"
          echo "Found $upload_count uploadable file(s)."

      - name: Upload and verify R2 assets
        if: steps.collect.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_ACCOUNT_ID"; exit 1; }
          list_file="$RUNNER_TEMP/r2-files.list"
          uploaded=0

          content_type_for() {
            local lower="${1,,}"
            case "$lower" in
              *.png) echo "image/png";; *.webp) echo "image/webp";; *.jpg|*.jpeg) echo "image/jpeg";;
              *.gif) echo "image/gif";; *.svg) echo "image/svg+xml";; *.json) echo "application/json";;
              *.mp3) echo "audio/mpeg";; *.ogg) echo "audio/ogg";; *.wav) echo "audio/wav";; *) return 1;;
            esac
          }

          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            [ ! -L "$file" ] || { echo "Refusing to upload symlink: $file"; exit 1; }
            content_type="$(content_type_for "$file" || true)"
            [ -n "$content_type" ] || continue
            case "$file" in
              r2-upload/*) key="${file#r2-upload/}" ;;
              ui/*) key="$file" ;;
              *) continue ;;
            esac
            size="$(stat -c '%s' "$file")"
            [ "$size" -le 104857600 ] || { echo "File exceeds 100 MiB: $file"; exit 1; }
            echo "Uploading $file -> r2://$R2_BUCKET/$key"
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --content-type "$content_type" --remote
            verify_file="$(mktemp)"
            wrangler r2 object get "$R2_BUCKET/$key" --file "$verify_file" --remote
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_sha="$(sha256sum "$verify_file" | awk '{print $1}')"
            rm -f "$verify_file"
            [ "$local_sha" = "$remote_sha" ] || { echo "Verification failed for $key"; exit 1; }
            echo "Verified $key"
            uploaded=$((uploaded + 1))
          done < "$list_file"
          echo "Uploaded and verified $uploaded object(s)."

      - name: Nothing to upload
        if: steps.collect.outputs.count == '0'
        run: echo "No supported assets found."
