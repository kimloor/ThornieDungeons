name: Temporary pre-W6 audit docs QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff check
        run: git diff --check
      - name: Audit doc/index linkage
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PRE-W6-READINESS-AUDIT-2026-10-03.md
          grep -Fq 'PRE-W6-READINESS-AUDIT-2026-10-03.md' docs/PROJECT-INDEX.md
          grep -Fq 'PRE-W6 READINESS AUDIT' docs/ACTIVE-DEVELOPMENT-ROADMAP-V1.md
          grep -Fq 'ACTIVE-PRODUCTION' docs/ADMIN-V2.md
