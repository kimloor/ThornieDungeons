name: Temporary W7A terminal presentation QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused W7A presentation regression
        run: >-
          node --test --test-concurrency=1
          tests/w7a-terminal-presentation.test.js
          tests/battle-ui-contract.test.js
          tests/phaser-foundation.test.js
          tests/phaser-shared-architecture.test.js
          tests/battle-core.test.js
          tests/battle-persistence.test.js
          tests/reward-v2.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
