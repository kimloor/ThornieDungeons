name: Sync R2 asset manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List R2 objects
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "Missing CF_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CF_ACCOUNT_ID"; exit 1; }

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/assets/objects"
          cursor=""
          pages_dir=$(mktemp -d)
          page_no=0

          # Never pass the object list as a command-line argument (Linux caps one
          # argument at ~128 KB); keep every page on disk and combine with files.
          while true; do
            if [ -n "$cursor" ]; then
              url="${api}?per_page=1000&cursor=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]) )' "$cursor")"
            else
              url="${api}?per_page=1000"
            fi

            resp="${pages_dir}/response_${page_no}.json"
            status=$(curl -sS -o "$resp" -w '%{http_code}' "$url" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Accept: application/json")

            if [ "$status" != "200" ]; then
              echo "Cloudflare R2 API returned HTTP $status"
              jq -c '{success, errors, messages}' "$resp" 2>/dev/null || cat "$resp"
              echo "Check that CF_API_TOKEN has Account > Workers R2 Storage > Read permission and that CF_ACCOUNT_ID is the correct Cloudflare Account ID."
              exit 1
            fi

            jq -e '.success == true' "$resp" >/dev/null || {
              echo "Cloudflare R2 API returned success=false"
              jq -c '{success, errors, messages}' "$resp"
              exit 1
            }

            jq '.result // []' "$resp" > "${pages_dir}/page_${page_no}.json"

            next=$(jq -r '.result_info.cursor // empty' "$resp")
            truncated=$(jq -r '.result_info.is_truncated // false' "$resp")
            if [ "$truncated" != "true" ] || [ -z "$next" ]; then
              break
            fi
            cursor="$next"
            page_no=$((page_no + 1))
          done

          jq -s 'add // []' "${pages_dir}"/page_*.json > "${pages_dir}/all.json"

          mkdir -p src/data
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg bucket "assets" \
            --slurpfile objects "${pages_dir}/all.json" \
            '{bucket:$bucket, generatedAt:$generatedAt, count:($objects[0]|length), objects:$objects[0]}' \
            > src/data/r2-manifest.json

      - name: Commit manifest when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/r2-manifest.json
          if git diff --cached --quiet; then
            echo "R2 manifest unchanged"
            exit 0
          fi
          git commit -m "chore: sync R2 asset manifest"
          git push
