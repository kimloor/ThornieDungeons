name: P0 rollback fault Worker deploy

# Tooling-only lane for Actual D1 security QA. The workflow must first be
# reviewed and merged to the default branch because workflow_dispatch does not
# run a new workflow that exists only on a feature branch.
on:
  workflow_dispatch:
    inputs:
      qa_player_id:
        description: Exact P0 rollback QA player ID
        required: true
        type: string
      qa_character_id:
        description: Exact P0 rollback QA character ID
        required: true
        type: string
      qa_battle_id:
        description: Exact unsettled victory QA battle ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thornie-dungeons-shared-staging-qa
  cancel-in-progress: false

jobs:
  deploy-p0-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
      EXPECTED_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      APPROVED_SOURCE_SHA: 5f78f5c8aeb8c32c912e4677c3a4a806be76ab1d
      QA_PLAYER_ID: ${{ inputs.qa_player_id }}
      QA_CHARACTER_ID: ${{ inputs.qa_character_id }}
      QA_BATTLE_ID: ${{ inputs.qa_battle_id }}
      WORKER_NAME: thornie-dungeons-p0-rollback-staging
      STAGING_DB_NAME: thornie-dungeons-staging
      STAGING_DB_ID: c16e0b11-cf83-468c-a533-0ecbf522082f
      PRODUCTION_DB_ID: 2f6d52b4-3de7-4e78-98d4-fc143a4d29e2
      WRANGLER_VERSION: 4.102.0

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout workflow contract and tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Run rollback deployment safety contract tests
        shell: bash
        run: node --test tooling/tests/p0-rollback-staging-workflow.test.js

      - name: Checkout exact reviewed PR #191 source
        uses: actions/checkout@v4
        with:
          ref: 5f78f5c8aeb8c32c912e4677c3a4a806be76ab1d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
          git fetch --no-tags origin "+refs/pull/191/head:refs/remotes/origin/pr-191"
          test "$(git rev-parse refs/remotes/origin/pr-191)" = "$APPROVED_SOURCE_SHA" || {
            echo "PR #191 HEAD no longer matches the approved source SHA; refusing deployment."
            exit 1
          }
          git diff --quiet "$APPROVED_SOURCE_SHA" -- workers/qa/p0-rollback-entry.js workers/qa/p0-rollback-fault.js

      - name: Validate runtime entrypoint and binding contract
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/qa/p0-rollback-entry.js
          test -f workers/qa/p0-rollback-fault.js
          test -f workers/thornie-dungeons-api.js
          node --check workers/qa/p0-rollback-entry.js
          node --check workers/qa/p0-rollback-fault.js
          node --check workers/thornie-dungeons-api.js
          refs="$(grep -Eoh 'env\??\.[A-Z][A-Z0-9_]*' workers/qa/*.js workers/thornie-dungeons-api-entry.js workers/thornie-dungeons-api.js workers/modules/*.js \
            | sed -E 's/.*env\??\.//' | sort -u)"
          unexpected="$(printf '%s\n' "$refs" | grep -Ev '^(ADMIN_API_KEY|CORS_ALLOWED_ORIGINS|DB|P0_ROLLBACK_TEST_KEY|P0_ROLLBACK_PLAYER_ID|P0_ROLLBACK_CHARACTER_ID|P0_ROLLBACK_BATTLE_ID)$' || true)"
          test -z "$unexpected" || { echo "Unexpected required environment binding(s): $unexpected"; exit 1; }
          printf '%s\n' "$refs" | grep -qx DB
          echo "Required binding: DB. Only DB, P0 rollback key and exact IDs will be configured."

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION"
          test "$(wrangler --version | awk '{print $1}')" = "$WRANGLER_VERSION"

      - name: Validate dedicated staging credentials and D1 identity
        shell: bash
        env:
          FAULT_SECRET: ${{ secrets.P0_ROLLBACK_TEST_KEY }}
        run: |
          set -euo pipefail
          test -n "$FAULT_SECRET" || { echo "Missing GitHub secret P0_ROLLBACK_TEST_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_STAGING_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_STAGING_ACCOUNT_ID"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || { echo "Staging account mismatch"; exit 1; }
          test "$STAGING_DB_ID" != "$PRODUCTION_DB_ID" || { echo "Refusing production D1 database id"; exit 1; }
          wrangler whoami >/dev/null
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          jq -e --arg id "$STAGING_DB_ID" --arg name "$STAGING_DB_NAME" \
            'any(.[]; ((.uuid // .id // "") == $id and .name == $name))' \
            "$RUNNER_TEMP/d1-list.json" >/dev/null || { echo "Staging D1 id/name mismatch"; exit 1; }

      - name: Refuse unknown Worker targets; allow only an exact prior P0 QA deployment
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/target-worker.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/settings")"
          case "$status" in
            404)
              echo "Confirmed isolated Worker target does not exist."
              ;;
            200)
              # A previous run may have deployed the isolated QA Worker but
              # stopped during verification. Reuse it only when its active
              # code still matches the pinned source tag and every binding is
              # limited to this exact QA fixture and staging D1.
              curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/versions?per_page=20" > "$RUNNER_TEMP/existing-versions.json"
              curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/deployments?per_page=20" > "$RUNNER_TEMP/existing-deployments.json"
              source_id="$(jq -er --arg sha "$APPROVED_SOURCE_SHA" '
                if .success != true then error("Unable to read existing Worker versions")
                else
                  ([.result.items[] | select(.annotations["workers/tag"] == $sha)] | sort_by(.metadata.created_on)) as $matches |
                  if ($matches | length) >= 1 then $matches[-1].id else error("Existing Worker has no approved source tag") end
                end
              ' "$RUNNER_TEMP/existing-versions.json")"
              active_id="$(jq -er '
                if .success != true then error("Unable to read existing Worker deployments")
                else
                  (.result.deployments | max_by(.created_on)) as $deployment |
                  if ($deployment.versions | length) == 1 and $deployment.versions[0].percentage == 100
                  then $deployment.versions[0].version_id
                  else error("Existing Worker does not have one 100-percent active version")
                  end
                end
              ' "$RUNNER_TEMP/existing-deployments.json")"
              curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/versions/$source_id" > "$RUNNER_TEMP/existing-source.json"
              curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/versions/$active_id" > "$RUNNER_TEMP/existing-active.json"
              source_etag="$(jq -er '.result.resources.script.etag' "$RUNNER_TEMP/existing-source.json")"
              jq -e --arg sha "$APPROVED_SOURCE_SHA" --arg source "$source_id" '
                .success == true and .result.id == $source and
                .result.annotations["workers/tag"] == $sha and
                (.result.resources.script.etag | type == "string" and length > 0)
              ' "$RUNNER_TEMP/existing-source.json" >/dev/null
              jq -e --arg db "$STAGING_DB_ID" --arg etag "$source_etag" --arg active "$active_id" \
                --arg player "$QA_PLAYER_ID" --arg character "$QA_CHARACTER_ID" --arg battle "$QA_BATTLE_ID" '
                .success == true and .result.id == $active and
                .result.resources.script.etag == $etag and
                (.result.resources.bindings | map(select(.type == "d1")) | length == 1) and
                any(.result.resources.bindings[]; .name == "DB" and .type == "d1" and ((.database_id // .id // "") == $db)) and
                (([.result.resources.bindings[].name] | sort) == ["DB","P0_ROLLBACK_BATTLE_ID","P0_ROLLBACK_CHARACTER_ID","P0_ROLLBACK_PLAYER_ID"] or
                 ([.result.resources.bindings[].name] | sort) == ["DB","P0_ROLLBACK_BATTLE_ID","P0_ROLLBACK_CHARACTER_ID","P0_ROLLBACK_PLAYER_ID","P0_ROLLBACK_TEST_KEY"]) and
                any(.result.resources.bindings[]; .name == "P0_ROLLBACK_PLAYER_ID" and .type == "plain_text" and .text == $player) and
                any(.result.resources.bindings[]; .name == "P0_ROLLBACK_CHARACTER_ID" and .type == "plain_text" and .text == $character) and
                any(.result.resources.bindings[]; .name == "P0_ROLLBACK_BATTLE_ID" and .type == "plain_text" and .text == $battle) and
                (all(.result.resources.bindings[]; .name != "P0_ROLLBACK_TEST_KEY" or .type == "secret_text"))
              ' "$RUNNER_TEMP/existing-active.json" >/dev/null || {
                echo "Existing Worker is not the exact approved P0 staging deployment; refusing overwrite."
                exit 1
              }
              curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/schedules" > "$RUNNER_TEMP/existing-schedules.json"
              jq -e '.success == true and (.result.schedules | type == "array") and (.result.schedules | length == 0)' "$RUNNER_TEMP/existing-schedules.json" >/dev/null || {
                echo "Existing Worker has an unexpected cron schedule; refusing overwrite."
                exit 1
              }
              echo "Verified exact prior P0 QA Worker, pinned source etag, fixture bindings, staging-only D1 and empty schedules; safe to continue."
              ;;
            *)
              echo "Unable to determine isolated Worker existence safely (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Build isolated Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          runtime_config="$GITHUB_WORKSPACE/.wrangler.p0-rollback.runtime.jsonc"
          for value in "$QA_PLAYER_ID" "$QA_CHARACTER_ID" "$QA_BATTLE_ID"; do
            test -n "$value" && test "${#value}" -le 128 && [[ "$value" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid QA ID"; exit 1; }
          done
          jq -n \
            --arg name "$WORKER_NAME" \
            --arg db_name "$STAGING_DB_NAME" \
            --arg db_id "$STAGING_DB_ID" \
            --arg player "$QA_PLAYER_ID" \
            --arg character "$QA_CHARACTER_ID" \
            --arg battle "$QA_BATTLE_ID" \
            '{
              name: $name,
              main: "workers/qa/p0-rollback-entry.js",
              compatibility_date: "2026-08-25",
              workers_dev: true,
              placement: {mode: "smart"},
              d1_databases: [{binding: "DB", database_name: $db_name, database_id: $db_id}],
              vars: {P0_ROLLBACK_PLAYER_ID: $player, P0_ROLLBACK_CHARACTER_ID: $character, P0_ROLLBACK_BATTLE_ID: $battle}
            }' > "$runtime_config"
          jq -e --arg worker "$WORKER_NAME" --arg db "$STAGING_DB_ID" --arg prod "$PRODUCTION_DB_ID" '
            .name == $worker and
            .main == "workers/qa/p0-rollback-entry.js" and
            .workers_dev == true and
            (.d1_databases | length == 1) and
            (.d1_databases[0].binding == "DB") and
            (.d1_databases[0].database_id == $db) and
            (.d1_databases[0].database_id != $prod) and
            (has("routes") | not) and
            (has("triggers") | not) and
            ((.vars | keys | sort) == ["P0_ROLLBACK_BATTLE_ID","P0_ROLLBACK_CHARACTER_ID","P0_ROLLBACK_PLAYER_ID"])
          ' "$runtime_config" >/dev/null
          echo "runtime_config=$runtime_config" >> "$GITHUB_OUTPUT"

      - name: Verify migration 0031 record and required schema without applying migrations
        shell: bash
        env:
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
        run: |
          set -euo pipefail
          query() {
            local sql="$1" output="$2"
            wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$RUNTIME_CONFIG" --json --command "$sql" > "$output"
            jq -e 'all(.[]; .success == true)' "$output" >/dev/null
          }
          query "SELECT COUNT(*) AS n FROM d1_migrations WHERE name='0031_battle_authority_v1.sql'" "$RUNNER_TEMP/migration.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/migration.json")" = "1" || {
            echo "Migration 0031 is not recorded exactly once; refusing deployment."
            exit 1
          }
          query "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='battle_authority'" "$RUNNER_TEMP/table.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/table.json")" = "1"
          query "SELECT COUNT(*) AS n FROM pragma_table_info('battle_authority') WHERE name IN ('battle_id','character_id','state_rev','initial_state_json','state_json','outcome','last_action_key','last_action_request_json','last_action_result_json','settled_at','created_at','updated_at')" "$RUNNER_TEMP/columns.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/columns.json")" = "12"
          query "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='index' AND name IN ('idx_battle_authority_character_active','idx_battle_authority_character_updated')" "$RUNNER_TEMP/indexes.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/indexes.json")" = "2"
          query "SELECT COUNT(*) AS n FROM pragma_foreign_key_list('battle_authority') WHERE \"table\"='characters' AND \"from\"='character_id' AND \"to\"='character_id' AND on_delete='CASCADE'" "$RUNNER_TEMP/fk.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/fk.json")" = "1"
          query "PRAGMA foreign_key_check" "$RUNNER_TEMP/fk-check.json"
          test "$(jq '[.[].results[]?] | length' "$RUNNER_TEMP/fk-check.json")" = "0" || {
            echo "PRAGMA foreign_key_check reported violations; refusing deployment."
            exit 1
          }
          echo "Migration 0031 and battle_authority schema verified read-only; no migration command was run."

      - name: Verify exact QA rows and unsettled Chapter Boss victory
        shell: bash
        env:
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
        run: |
          set -euo pipefail
          query="SELECT COUNT(*) AS n
            FROM battle_authority ba
            JOIN characters c ON c.character_id = ba.character_id
            JOIN players p ON p.id = c.player_id
            LEFT JOIN battle_completions bc ON bc.battle_id = ba.battle_id
            WHERE ba.battle_id = '$QA_BATTLE_ID'
              AND ba.character_id = '$QA_CHARACTER_ID'
              AND c.player_id = '$QA_PLAYER_ID'
              AND ba.outcome = 'victory'
              AND ba.settled_at = ''
              AND json_extract(ba.initial_state_json, '$.floor') = 10
              AND json_extract(ba.initial_state_json, '$.units') IS NOT NULL
              AND EXISTS (SELECT 1 FROM json_each(ba.initial_state_json, '$.units') AS initial_unit WHERE json_extract(initial_unit.value, '$.side') = 'enemy' AND (json_extract(initial_unit.value, '$.kind') = 'boss' OR json_extract(initial_unit.value, '$.isBoss') = 1))
              AND json_extract(ba.state_json, '$.serverContext.role') = 'chapter_boss'
              AND bc.battle_id IS NULL"
          wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$RUNTIME_CONFIG" --json --command "$query" > "$RUNNER_TEMP/qa-scope.json"
          jq -e '.[0].success == true and .[0].results[0].n == 1' "$RUNNER_TEMP/qa-scope.json" >/dev/null || {
            echo "Exact QA Player/Character/Battle scope is not one unsettled victory; refusing deployment."
            exit 1
          }
          echo "Exact QA rows verified read-only; no battle or reward data was changed."

      - name: Wrangler dry run
        shell: bash
        run: wrangler deploy --dry-run --config "${{ steps.config.outputs.runtime_config }}"

      - name: Deploy isolated P0 staging Worker only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/deploy.log"
          wrangler deploy \
            --strict \
            --config "${{ steps.config.outputs.runtime_config }}" \
            --tag "$APPROVED_SOURCE_SHA" \
            --message "source_sha=$APPROVED_SOURCE_SHA; workflow_run=$GITHUB_RUN_ID" \
            2>&1 | tee "$deploy_log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | head -n1)"
          test -n "$url" || { echo "Unable to resolve isolated Worker URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install QA-only fault secret on new Worker
        shell: bash
        env:
          FAULT_SECRET: ${{ secrets.P0_ROLLBACK_TEST_KEY }}
        run: |
          set -euo pipefail
          test -n "$FAULT_SECRET"
          printf '%s' "$FAULT_SECRET" | wrangler secret put P0_ROLLBACK_TEST_KEY --config "${{ steps.config.outputs.runtime_config }}"

      - name: Create short-lived QA bearer session for the exact fixture player
        shell: bash
        env:
          FAULT_SECRET: ${{ secrets.P0_ROLLBACK_TEST_KEY }}
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
        run: |
          set -euo pipefail
          token_hash="$(printf '%s' "$FAULT_SECRET" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          session_id="sess-p0-rollback-$QA_PLAYER_ID"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')"
          sql="INSERT INTO auth_sessions (session_id, player_id, token_hash, created_at, expires_at, revoked_at, revoke_reason, remember_login)
            SELECT '$session_id', '$QA_PLAYER_ID', '$token_hash', '$created_at', '$expires_at', NULL, NULL, 0
            WHERE EXISTS (SELECT 1 FROM characters WHERE character_id='$QA_CHARACTER_ID' AND player_id='$QA_PLAYER_ID')
            ON CONFLICT(session_id) DO UPDATE SET token_hash=excluded.token_hash, created_at=excluded.created_at,
              expires_at=excluded.expires_at, revoked_at=NULL, revoke_reason=NULL, remember_login=0
            WHERE auth_sessions.player_id=excluded.player_id"
          wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$RUNTIME_CONFIG" --json --command "$sql" > "$RUNNER_TEMP/qa-session-write.json"
          jq -e 'all(.[]; .success == true)' "$RUNNER_TEMP/qa-session-write.json" >/dev/null
          check="SELECT COUNT(*) AS n FROM auth_sessions s JOIN characters c ON c.player_id=s.player_id
            WHERE s.session_id='$session_id' AND s.player_id='$QA_PLAYER_ID'
              AND c.character_id='$QA_CHARACTER_ID' AND s.token_hash='$token_hash'
              AND s.revoked_at IS NULL AND s.expires_at > '$created_at'"
          wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$RUNTIME_CONFIG" --json --command "$check" > "$RUNNER_TEMP/qa-session-check.json"
          jq -e '.[0].success == true and .[0].results[0].n == 1' "$RUNNER_TEMP/qa-session-check.json" >/dev/null
          echo "Short-lived QA bearer session installed for exact fixture player; bearer token is the QA secret and is never logged."

      - name: Verify deployed identity, source version, sole D1 binding and no cron
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          versions="$RUNNER_TEMP/versions.json"
          deployments="$RUNNER_TEMP/deployments.json"
          source_version="$RUNNER_TEMP/source-version.json"
          active_version="$RUNNER_TEMP/active-version.json"

          # --tag is stored on the uploaded source version. Adding a Worker secret
          # creates a new active version and does not copy that annotation, so
          # verify the active version by matching its immutable script etag.
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/versions?per_page=20" > "$versions"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/deployments?per_page=20" > "$deployments"

          source_version_id="$(jq -er --arg sha "$APPROVED_SOURCE_SHA" '
            if .success != true then error("Unable to read Worker versions")
            else
              ([.result.items[] | select(.annotations["workers/tag"] == $sha)] | sort_by(.metadata.created_on)) as $matches |
              if ($matches | length) >= 1 then $matches[-1].id else error("No source-tagged Worker version found") end
            end
          ' "$versions")"
          active_version_id="$(jq -er '
            if .success != true then error("Unable to read Worker deployments")
            else
              (.result.deployments | max_by(.created_on)) as $deployment |
              if ($deployment.versions | length) == 1 and $deployment.versions[0].percentage == 100
              then $deployment.versions[0].version_id
              else error("Expected one active Worker version at 100 percent")
              end
            end
          ' "$deployments")"

          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/versions/$source_version_id" > "$source_version"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/versions/$active_version_id" > "$active_version"

          jq -e --arg sha "$APPROVED_SOURCE_SHA" --arg id "$source_version_id" '
            .success == true and .result.id == $id and
            .result.annotations["workers/tag"] == $sha and
            (.result.resources.script.etag | type == "string" and length > 0)
          ' "$source_version" >/dev/null || {
            echo "Pinned source Worker version or tag mismatch."
            exit 1
          }
          source_etag="$(jq -er '.result.resources.script.etag' "$source_version")"
          jq -e --arg db "$STAGING_DB_ID" --arg etag "$source_etag" --arg id "$active_version_id" \
            --arg player "$QA_PLAYER_ID" --arg character "$QA_CHARACTER_ID" --arg battle "$QA_BATTLE_ID" '
            .success == true and .result.id == $id and
            .result.resources.script.etag == $etag and
            (.result.resources.bindings | map(select(.type == "d1")) | length == 1) and
            any(.result.resources.bindings[]; .name == "DB" and .type == "d1" and ((.database_id // .id // "") == $db)) and
            any(.result.resources.bindings[]; .name == "P0_ROLLBACK_TEST_KEY" and .type == "secret_text") and
            any(.result.resources.bindings[]; .name == "P0_ROLLBACK_PLAYER_ID" and .type == "plain_text" and .text == $player) and
            any(.result.resources.bindings[]; .name == "P0_ROLLBACK_CHARACTER_ID" and .type == "plain_text" and .text == $character) and
            any(.result.resources.bindings[]; .name == "P0_ROLLBACK_BATTLE_ID" and .type == "plain_text" and .text == $battle) and
            ([.result.resources.bindings[].name] | sort) == ["DB","P0_ROLLBACK_BATTLE_ID","P0_ROLLBACK_CHARACTER_ID","P0_ROLLBACK_PLAYER_ID","P0_ROLLBACK_TEST_KEY"]
          ' "$active_version" >/dev/null || {
            echo "Active Worker version, source etag, QA binding or staging D1 mismatch."
            exit 1
          }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/schedules" > "$RUNNER_TEMP/schedules.json"
          jq -e '.success == true and (.result.schedules | type == "array") and (.result.schedules | length == 0)' "$RUNNER_TEMP/schedules.json" >/dev/null || {
            echo "Unexpected cron schedule found; refusing handoff."
            exit 1
          }
          game_config="$RUNNER_TEMP/game-config.json"
          curl --fail --silent --show-error --max-time 20 \
            "${{ steps.deploy.outputs.url }}?action=getGameConfig" > "$game_config"
          jq -e 'type == "object"' "$game_config" >/dev/null || {
            echo "Staging Worker getGameConfig smoke test did not return a JSON object."
            exit 1
          }
          echo "Staging Worker getGameConfig endpoint returned valid JSON object."

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## P0 rollback fault staging Worker"
            echo ""
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- URL: \`${{ steps.deploy.outputs.url }}\`"
            echo "- Source SHA: \`$APPROVED_SOURCE_SHA\`"
            echo "- Entrypoint: \`workers/qa/p0-rollback-entry.js\`"
            echo "- D1 binding: \`DB -> $STAGING_DB_NAME ($STAGING_DB_ID)\`"
            echo "- Production D1 refused: \`$PRODUCTION_DB_ID\`"
            echo "- Migration 0031: verified only; not applied"
            echo "- Routes: none configured"
            echo "- Cron: none configured and remote schedules verified empty"
            echo "- Production secrets: none; one QA-only fault secret configured"
            echo "- Actual D1 Security QA: not run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
