name: W9 UI Phaser Restore QA

on:
  push:
    branches:
      - "fix/w9-arena-ui-phaser-restore"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated frontend
        run: |
          node build.js
          git diff --exit-code -- index.html
      - name: Run UI and Phaser regression
        run: |
          node --test --test-concurrency=1 \
            tests/w8-hero-preview.test.js \
            tests/phaser-foundation.test.js \
            tests/phaser-shared-architecture.test.js \
            tests/arena-v2-w98-w99.test.js \
            tests/responsive-layout.test.js
