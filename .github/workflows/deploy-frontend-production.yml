name: Deploy ThornieDungeons Frontend

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "admin.html"
      - "admin-app.js"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-frontend-production.yml"
      - "build.js"
      - "head.html"
      - "tail.html"
      - "src/**"
      - "tests/inventory-v2.test.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thorniedungeons-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      WORKER_NAME: thorniedungeons
      PRODUCTION_URL: https://thorniedungeons.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_ACCOUNT_ID"; exit 1; }
          wrangler whoami >/dev/null

      - name: Run Inventory UI regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/inventory-v2.test.js

      - name: Build generated frontend
        shell: bash
        run: |
          set -euo pipefail
          node build.js

      - name: Verify generated frontend
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo "Generated index.html is missing or empty"; exit 1; }
          grep -q "requestNonce" index.html || { echo "W4 inventory refresh guard missing from index.html"; exit 1; }
          grep -q "remainingQuantity" index.html || { echo "W4 donation result handling missing from index.html"; exit 1; }
          expected_version="$(grep -o 'name="application-version" content="[^"]*"' head.html | head -n 1 | sed 's/.*content="\([^"]*\)"/\1/')"
          test -n "$expected_version" || { echo "Application version missing in head.html"; exit 1; }
          grep -q "name=\"application-version\" content=\"$expected_version\"" index.html || { echo "Application version marker missing or stale (expected $expected_version)"; exit 1; }
          test -s admin.html || { echo "admin.html is missing or empty"; exit 1; }
          test -s admin-app.js || { echo "admin-app.js is missing or empty"; exit 1; }
          grep -q 'action: "adminLogin"' admin-app.js || { echo "Admin V2 login UI missing from admin-app.js"; exit 1; }
          if grep -q "<script>" admin.html; then
            echo "Inline script reintroduced in admin.html (CSP requires admin-app.js)"
            exit 1
          fi
          if grep -q "thornie-admin-key" admin.html admin-app.js; then
            echo "Legacy Admin key storage still present in Admin files"
            exit 1
          fi

      - name: Deploy production frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          wrangler deploy             --config wrangler.jsonc             --name "$WORKER_NAME"

      - name: Verify production frontend
        shell: bash
        run: |
          set -euo pipefail
          wrangler deployments list             --name "$WORKER_NAME"             --config wrangler.jsonc | head -n 40
          response_file="$RUNNER_TEMP/thorniedungeons-production.html"
          curl --fail --silent --show-error --max-time 30 \
            -H "Sec-Fetch-Mode: navigate" \
            --output "$response_file" \
            "$PRODUCTION_URL/"
          grep -q "requestNonce" "$response_file"
          grep -q "remainingQuantity" "$response_file"

          admin_response_file="$RUNNER_TEMP/thorniedungeons-admin-production.html"
          curl --fail --silent --show-error --max-time 30 \
            -H "Sec-Fetch-Mode: navigate" \
            --output "$admin_response_file" \
            "$PRODUCTION_URL/admin"
          admin_headers_file="$RUNNER_TEMP/thorniedungeons-admin-headers.txt"
          curl --fail --silent --show-error --max-time 30 \
            -H "Sec-Fetch-Mode: navigate" \
            --dump-header "$admin_headers_file" --output /dev/null \
            "$PRODUCTION_URL/admin"
          grep -qi "^content-security-policy:.*script-src 'self'" "$admin_headers_file" || { echo "Admin CSP header missing"; exit 1; }
          grep -qi "^x-frame-options: DENY" "$admin_headers_file" || { echo "Admin X-Frame-Options missing"; exit 1; }
          if curl --silent --max-time 30 --head "$PRODUCTION_URL/" | grep -qi "^content-security-policy:"; then
            echo "Game page unexpectedly carries the Admin CSP"
            exit 1
          fi
          admin_js_file="$RUNNER_TEMP/thorniedungeons-admin-app.js"
          curl --fail --silent --show-error --max-time 30 --output "$admin_js_file" "$PRODUCTION_URL/admin-app.js"
          grep -q 'action: "adminLogin"' "$admin_js_file"
          if grep -q "thornie-admin-key" "$admin_response_file" "$admin_js_file"; then
            echo "Production Admin page still contains legacy key storage"
            exit 1
          fi

          echo "Production frontend verified: $PRODUCTION_URL"
          echo "Production Admin verified: $PRODUCTION_URL/admin"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## ThornieDungeons frontend production deployment"
            echo ""
            echo "- Worker: `$WORKER_NAME`"
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- Production URL: $PRODUCTION_URL"
            echo "- Production API: unchanged by this job"
          } >> "$GITHUB_STEP_SUMMARY"
