name: W7.3 teardown error UI preview

on:
  push:
    branches:
      - "feat/w7-hero-v5-runtime"
    paths:
      - ".github/workflows/w7-teardown-error-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thornie-w7-teardown-error-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      WORKER_NAME: thorniedungeons-phaser-preview
      PREVIEW_URL: https://thorniedungeons-phaser-preview.ekqtjl.workers.dev
    steps:
      - name: Checkout W7 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: node build.js

      - name: Focused Phaser tests
        run: node --test tests/phaser-foundation.test.js tests/phaser-shared-architecture.test.js

      - name: Full suite regression gate
        shell: bash
        run: |
          set -uo pipefail
          failures=()
          for file in tests/*.test.js; do
            echo "::group::$file"
            if node --test "$file"; then :; else failures+=("$file"); fi
            echo "::endgroup::"
          done
          expected=(
            "tests/auth-v2.test.js"
            "tests/battle-persistence.test.js"
            "tests/guild-donation-v1.test.js"
          )
          echo "Observed failures: ${failures[*]:-none}"
          echo "Expected failures: ${expected[*]}"
          if [ "${failures[*]}" != "${expected[*]}" ]; then
            echo "Unexpected full-suite regression set."
            exit 1
          fi

      - name: Validate versioned Idle sword assets
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("r2-upload/manifest.json","utf8"));
          const a=m.assets.hero001.v5.g2.equipment.azure;
          if(a.idleSwordAssetRevision!=="w7_idle_v2") process.exit(1);
          for(const f of ["idle_01","idle_02","idle_03"]){
            const p=a.frames[f].sword;
            if(!p.endsWith("sword_w7_idle_v2.png")) process.exit(1);
            const stat=fs.statSync("r2-upload/"+p);
            if(stat.size<=10000) process.exit(1);
          }
          NODE

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami >/dev/null

      - name: Deploy isolated W7 preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          wrangler deploy --config wrangler.jsonc --name "$WORKER_NAME"

      - name: Verify routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PREVIEW_URL/"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PREVIEW_URL/?phaserBattle=1&heroV5=1"
