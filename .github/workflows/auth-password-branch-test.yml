name: Auth password branch test
on:
  push:
    branches:
      - "fix/auth-password-ux"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test --test-name-pattern="ID/password policy|recovery regeneration|password change|registration UI|new password policy" tests/auth-v2.test.js
