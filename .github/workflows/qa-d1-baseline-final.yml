name: Temporary D1 Baseline QA

on:
  push:
    branches:
      - "qa/pr100-d1-baseline-final"

permissions:
  contents: read

jobs:
  d1-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Measure baseline D1 calls
        run: node --test tests/d1-latency-budget-v1.test.js
