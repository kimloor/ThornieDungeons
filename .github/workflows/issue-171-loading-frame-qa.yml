name: Issue 171 loading frame verification
on:
  push:
    branches: [fix/issue-171-loading-frame-v1126]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild
        run: node build.js
      - name: Full regression
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated output
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: regenerate index.html v1.1.26 [skip ci]"
            git push
          fi
