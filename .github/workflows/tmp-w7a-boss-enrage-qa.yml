name: Temporary W7A boss enrage QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused W7A boss regression
        run: >-
          node --test --test-concurrency=1
          tests/w7a-boss-enrage-presentation.test.js
          tests/w7a-terminal-presentation.test.js
          tests/dungeon-v2-foundation.test.js
          tests/dungeon-v2-skills.test.js
          tests/battle-core.test.js
          tests/battle-ui-contract.test.js
          tests/phaser-foundation.test.js
          tests/phaser-shared-architecture.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Upload rebuilt generated index
        uses: actions/upload-artifact@v4
        with:
          name: w7a-generated-index
          path: index.html
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
