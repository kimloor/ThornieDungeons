name: Upload Hero V5 Azure R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-hero-v5-azure-r2.yml"

permissions:
  contents: read

concurrency:
  group: r2-hero-v5-azure
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate credentials and source files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(find r2-upload/hero/v5/g2/equipment/azure -type f -name '*.png' | wc -l | tr -d ' ')" = "56"
          test "$(find r2-upload/hero/v5/g2/equipment/azure -type f -name '*.json' | wc -l | tr -d ' ')" = "3"
          test -f r2-upload/manifest.json

      - name: Upload Azure runtime assets and verify
        shell: bash
        run: |
          set -euo pipefail

          content_type_for() {
            local lower="${1,,}"
            case "$lower" in
              *.png) echo "image/png" ;;
              *.json) echo "application/json" ;;
              *) return 1 ;;
            esac
          }

          list_file="$RUNNER_TEMP/azure-r2-files.list"
          {
            find r2-upload/hero/v5/g2/equipment/azure -type f \( -name '*.png' -o -name '*.json' \) -print
            echo "r2-upload/manifest.json"
          } | sort > "$list_file"

          uploaded=0
          while IFS= read -r file; do
            [ -f "$file" ] || { echo "Missing $file"; exit 1; }
            content_type="$(content_type_for "$file")"
            key="${file#r2-upload/}"
            echo "Uploading $key"
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --content-type "$content_type" --remote

            verify_file="$(mktemp)"
            wrangler r2 object get "$R2_BUCKET/$key" --file "$verify_file" --remote
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_sha="$(sha256sum "$verify_file" | awk '{print $1}')"
            rm -f "$verify_file"
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "SHA verification failed: $key"
              exit 1
            fi
            uploaded=$((uploaded + 1))
          done < "$list_file"

          test "$uploaded" = "60"
          echo "Uploaded and SHA-verified $uploaded Azure publication object(s)."
          {
            echo "## Hero V5 Azure R2 publication"
            echo ""
            echo "- Azure runtime PNGs: 56"
            echo "- Azure metadata JSONs: 3"
            echo "- Root manifest: 1"
            echo "- Uploaded + SHA verified: **$uploaded / 60**"
          } >> "$GITHUB_STEP_SUMMARY"
