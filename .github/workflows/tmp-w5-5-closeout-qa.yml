name: Temporary W5.5 closeout QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused W5.5 security regression
        run: >-
          node --test --test-concurrency=1
          tests/w5-5-security-hardening.test.js
          tests/admin-v2-auth.test.js
          tests/auth-v2.test.js
          tests/save-reliability.test.js
          tests/inventory-capacity-authority-followup.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js
