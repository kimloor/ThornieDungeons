name: Hero V5 G2 approved asset ingest

on:
  push:
    branches:
      - main
    paths:
      - "_asset-ingest/READY"

permissions:
  contents: write
  actions: write

concurrency:
  group: hero-v5-g2-approved-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify approved package
        shell: bash
        run: |
          set -euo pipefail
          cat _asset-ingest/chunk-*.b64 | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/hero-v5-g2.zip"
          echo "d9f493feb74c9528d12dc1a25aabdec1506805afa3b3ea8253eea1fef16033de  $RUNNER_TEMP/hero-v5-g2.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hero-v5-g2"
          unzip -q "$RUNNER_TEMP/hero-v5-g2.zip" -d "$RUNNER_TEMP/hero-v5-g2"
          test -f "$RUNNER_TEMP/hero-v5-g2/VALIDATION.json"
          test -f "$RUNNER_TEMP/hero-v5-g2/metadata/WING_FRAME_CONTRACT.json"
          for frame in idle_01 idle_02 idle_03 attack_01 attack_02 attack_03 death_01 death_02; do
            test -f "$RUNNER_TEMP/hero-v5-g2/wings_g2_template/$frame/wing_far.png"
            test -f "$RUNNER_TEMP/hero-v5-g2/wings_g2_template/$frame/wing_near.png"
          done

      - name: Stage approved assets
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hero-v5-g2"
          dst="r2-upload/hero/v5/g2/wings"
          mkdir -p "$dst"
          for frame in idle_01 idle_02 idle_03 attack_01 attack_02 attack_03 death_01 death_02; do
            mkdir -p "$dst/$frame"
            cp "$src/wings_g2_template/$frame/wing_far.png" "$dst/$frame/wing_far.png"
            cp "$src/wings_g2_template/$frame/wing_near.png" "$dst/$frame/wing_near.png"
          done
          cp "$src/metadata/WING_FRAME_CONTRACT.json" "$dst/WING_FRAME_CONTRACT.json"
          cp "$src/VALIDATION.json" "$dst/VALIDATION.json"

      - name: Update R2 manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'r2-upload/manifest.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          m.assets ||= {};
          m.assets.hero001 ||= {};
          m.assets.hero001.v5 ||= {};
          const base = 'hero/v5/g2/wings';
          const pair = (frame) => ({
            wing_far: `${base}/${frame}/wing_far.png`,
            wing_near: `${base}/${frame}/wing_near.png`
          });
          m.assets.hero001.v5.g2 = {
            status: 'approved',
            runtimeIntegration: false,
            canvas: { width: 768, height: 768 },
            layerOrder: ['wing_far', 'hero', 'wing_near'],
            contract: `${base}/WING_FRAME_CONTRACT.json`,
            validation: `${base}/VALIDATION.json`,
            wings: {
              idle: [pair('idle_01'), pair('idle_02'), pair('idle_03')],
              attack: [pair('attack_01'), pair('attack_02'), pair('attack_03')],
              death: [pair('death_01'), pair('death_02')]
            }
          };
          fs.writeFileSync(p, JSON.stringify(m));
          NODE

      - name: Commit approved assets and remove ingest bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _asset-ingest
          rm -f .github/workflows/hero-v5-g2-ingest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "assets: publish approved Hero V5 G2 wing contract"
          git push origin HEAD:main

      - name: Dispatch canonical R2 upload workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run upload-r2-assets.yml --ref main
