name: P0 Candidate Actual D1 Security QA

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current PR #196 candidate SHA
        required: true
        type: string
      confirm:
        description: Confirm fresh R01-R04 against isolated Staging D1
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - RUN_FRESH_P0_R01_R04
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: p0-candidate-actual-d1-exclusive
  cancel-in-progress: false

jobs:
  actual-d1-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
      P0_ROLLBACK_TEST_KEY: ${{ secrets.P0_ROLLBACK_TEST_KEY }}
      APPROVED_SOURCE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      STAGING_DB_NAME: thornie-dungeons-staging
      STAGING_DB_ID: c16e0b11-cf83-468c-a533-0ecbf522082f
      PRODUCTION_DB_ID: 2f6d52b4-3de7-4e78-98d4-fc143a4d29e2
      WRANGLER_VERSION: 4.102.0
      QA_TEMPLATE_PLAYER_ID: P0_QA_ROLLBACK_01
      QA_TEMPLATE_CHARACTER_ID: char-p0-rollback-20261102
      QA_TEMPLATE_BATTLE_ID: dungeon-p0-rollback-20261102

    steps:
      - name: Require explicit confirmation, exact main branch and current PR candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "RUN_FRESH_P0_R01_R04"
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$P0_ROLLBACK_TEST_KEY"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          test "$STAGING_DB_ID" != "$PRODUCTION_DB_ID"
          echo "Explicit confirmation accepted; scope is the isolated Staging D1 only."

      - name: Checkout exact P0 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current PR #196 source and QA wrapper
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
          git fetch --no-tags origin "+refs/pull/196/head:refs/remotes/origin/pr-196"
          test "$(git rev-parse refs/remotes/origin/pr-196)" = "$APPROVED_SOURCE_SHA" || {
            echo "Candidate SHA is no longer the exact PR #196 head; refusing QA."
            exit 1
          }
          test -f workers/qa/p0-rollback-entry.js
          test -f workers/qa/p0-rollback-fault.js
          test -f workers/thornie-dungeons-api-entry.js
          test -f workers/thornie-dungeons-api.js
          test -f scripts/p0-candidate-actual-d1-qa.mjs
          node --check workers/qa/p0-rollback-entry.js
          node --check workers/qa/p0-rollback-fault.js
          node --check workers/thornie-dungeons-api-entry.js
          node --check workers/thornie-dungeons-api.js
          node --check scripts/p0-candidate-actual-d1-qa.mjs
          refs="$(grep -Eoh 'env\??\.[A-Z][A-Z0-9_]*' workers/qa/*.js workers/thornie-dungeons-api-entry.js workers/thornie-dungeons-api.js workers/modules/*.js | sed -E 's/.*env\??\.//' | sort -u)"
          unexpected="$(printf '%s\n' "$refs" | grep -Ev '^(ADMIN_API_KEY|CORS_ALLOWED_ORIGINS|DB|P0_ROLLBACK_TEST_KEY|P0_ROLLBACK_PLAYER_ID|P0_ROLLBACK_CHARACTER_ID|P0_ROLLBACK_BATTLE_ID)$' || true)"
          test -z "$unexpected" || { echo "Unexpected Worker binding(s): $unexpected"; exit 1; }
          printf '%s\n' "$refs" | grep -qx DB
          echo "Exact PR source and QA-only wrapper verified."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION"
          test "$(wrangler --version | awk '{print $1}')" = "$WRANGLER_VERSION"

      - name: Validate Staging D1 identity and choose one-time isolated Worker/fixture IDs
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          wrangler whoami >/dev/null
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          jq -e --arg id "$STAGING_DB_ID" --arg name "$STAGING_DB_NAME"             'any(.[]; ((.uuid // .id // "") == $id and .name == $name))'             "$RUNNER_TEMP/d1-list.json" >/dev/null || { echo "Staging D1 identity mismatch"; exit 1; }
          suffix="${APPROVED_SOURCE_SHA:0:8}-$GITHUB_RUN_ID"
          worker="thornie-dungeons-p0-qa-$suffix"
          player="P0_QA_$GITHUB_RUN_ID"
          character="char-p0-$GITHUB_RUN_ID"
          battle="dungeon-p0-$GITHUB_RUN_ID"
          session="sess-p0-$GITHUB_RUN_ID"
          for value in "$player" "$character" "$battle" "$session"; do
            [[ "$value" =~ ^[A-Za-z0-9_-]+$ ]] && test "${#value}" -le 128
          done
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "player=$player" >> "$GITHUB_OUTPUT"
          echo "character=$character" >> "$GITHUB_OUTPUT"
          echo "battle=$battle" >> "$GITHUB_OUTPUT"
          echo "session=$session" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing Worker target
        shell: bash
        env:
          WORKER_NAME: ${{ steps.scope.outputs.worker }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/target.json" --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          test "$status" = "404" || {
            echo "Candidate QA Worker already exists or target state is ambiguous (HTTP $status); refusing overwrite."
            exit 1
          }

      - name: Build isolated runtime config and verify migration/schema read-only
        id: config
        working-directory: source
        shell: bash
        env:
          WORKER_NAME: ${{ steps.scope.outputs.worker }}
          QA_PLAYER_ID: ${{ steps.scope.outputs.player }}
          QA_CHARACTER_ID: ${{ steps.scope.outputs.character }}
          QA_BATTLE_ID: ${{ steps.scope.outputs.battle }}
        run: |
          set -euo pipefail
          runtime_config="$GITHUB_WORKSPACE/source/.wrangler.p0-candidate-qa.runtime.jsonc"
          jq -n --arg name "$WORKER_NAME" --arg db_name "$STAGING_DB_NAME" --arg db_id "$STAGING_DB_ID"             --arg player "$QA_PLAYER_ID" --arg character "$QA_CHARACTER_ID" --arg battle "$QA_BATTLE_ID"             '{
              name:$name,
              main:"workers/qa/p0-rollback-entry.js",
              compatibility_date:"2026-08-25",
              workers_dev:true,
              placement:{mode:"smart"},
              d1_databases:[{binding:"DB",database_name:$db_name,database_id:$db_id}],
              vars:{P0_ROLLBACK_PLAYER_ID:$player,P0_ROLLBACK_CHARACTER_ID:$character,P0_ROLLBACK_BATTLE_ID:$battle}
            }' > "$runtime_config"
          jq -e --arg worker "$WORKER_NAME" --arg db "$STAGING_DB_ID" --arg prod "$PRODUCTION_DB_ID"             '.name==$worker and .main=="workers/qa/p0-rollback-entry.js" and .workers_dev==true and
             (.d1_databases|length)==1 and .d1_databases[0].binding=="DB" and
             .d1_databases[0].database_id==$db and .d1_databases[0].database_id!=$prod and
             (has("routes")|not) and (has("triggers")|not) and
             ((.vars|keys|sort)==["P0_ROLLBACK_BATTLE_ID","P0_ROLLBACK_CHARACTER_ID","P0_ROLLBACK_PLAYER_ID"])'             "$runtime_config" >/dev/null

          query() {
            local sql="$1" output="$2"
            wrangler d1 execute "$STAGING_DB_NAME" --remote --config "$runtime_config" --json --command "$sql" > "$output"
            jq -e 'all(.[]; .success == true)' "$output" >/dev/null
          }
          query "SELECT COUNT(*) AS n FROM d1_migrations WHERE name='0031_battle_authority_v1.sql'" "$RUNNER_TEMP/migration.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/migration.json")" = "1"
          query "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='battle_authority'" "$RUNNER_TEMP/table.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/table.json")" = "1"
          query "SELECT COUNT(*) AS n FROM pragma_table_info('battle_authority') WHERE name IN ('battle_id','character_id','state_rev','initial_state_json','state_json','outcome','last_action_key','last_action_request_json','last_action_result_json','settled_at','created_at','updated_at')" "$RUNNER_TEMP/columns.json"
          test "$(jq -r '.[0].results[0].n' "$RUNNER_TEMP/columns.json")" = "12"
          query "PRAGMA foreign_key_check" "$RUNNER_TEMP/fk-check.json"
          test "$(jq '[.[].results[]?] | length' "$RUNNER_TEMP/fk-check.json")" = "0"
          echo "Migration 0031 and required schema verified read-only; no migrations applied."
          echo "runtime_config=$runtime_config" >> "$GITHUB_OUTPUT"

      - name: Wrangler dry run and deploy isolated Candidate QA Worker
        id: deploy
        working-directory: source
        shell: bash
        env:
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
          WORKER_NAME: ${{ steps.scope.outputs.worker }}
        run: |
          set -euo pipefail
          wrangler deploy --dry-run --config "$RUNTIME_CONFIG"
          deploy_log="$RUNNER_TEMP/deploy.log"
          wrangler deploy --strict --config "$RUNTIME_CONFIG" --tag "$APPROVED_SOURCE_SHA"             --message "P0 candidate actual D1 QA source_sha=$APPROVED_SOURCE_SHA run=$GITHUB_RUN_ID" 2>&1 | tee "$deploy_log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | head -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install QA-only fault secret
        working-directory: source
        shell: bash
        env:
          RUNTIME_CONFIG: ${{ steps.config.outputs.runtime_config }}
        run: |
          set -euo pipefail
          printf '%s' "$P0_ROLLBACK_TEST_KEY" | wrangler secret put P0_ROLLBACK_TEST_KEY --config "$RUNTIME_CONFIG"

      - name: Verify deployed Candidate identity, staging-only D1 binding and no cron
        shell: bash
        env:
          WORKER_NAME: ${{ steps.scope.outputs.worker }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/versions?per_page=20" > "$RUNNER_TEMP/versions.json"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments?per_page=20" > "$RUNNER_TEMP/deployments.json"
          source_id="$(jq -er --arg sha "$APPROVED_SOURCE_SHA" '([.result.items[] | select(.annotations["workers/tag"]==$sha)] | sort_by(.metadata.created_on))[-1].id' "$RUNNER_TEMP/versions.json")"
          active_id="$(jq -er '(.result.deployments|max_by(.created_on)) as $d | if ($d.versions|length)==1 and $d.versions[0].percentage==100 then $d.versions[0].version_id else error("Expected 100-percent active version") end' "$RUNNER_TEMP/deployments.json")"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/versions/$source_id" > "$RUNNER_TEMP/source-version.json"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/versions/$active_id" > "$RUNNER_TEMP/active-version.json"
          etag="$(jq -er '.result.resources.script.etag' "$RUNNER_TEMP/source-version.json")"
          jq -e --arg sha "$APPROVED_SOURCE_SHA" '.success==true and .result.annotations["workers/tag"]==$sha' "$RUNNER_TEMP/source-version.json" >/dev/null
          jq -e --arg db "$STAGING_DB_ID" --arg etag "$etag" --arg player "${{ steps.scope.outputs.player }}"             --arg character "${{ steps.scope.outputs.character }}" --arg battle "${{ steps.scope.outputs.battle }}"             '.success==true and .result.resources.script.etag==$etag and
             (.result.resources.bindings|length)==5 and
             any(.result.resources.bindings[];.name=="DB" and .type=="d1" and (.database_id // .id)==$db) and
             any(.result.resources.bindings[];.name=="P0_ROLLBACK_TEST_KEY" and .type=="secret_text") and
             any(.result.resources.bindings[];.name=="P0_ROLLBACK_PLAYER_ID" and .type=="plain_text" and .text==$player) and
             any(.result.resources.bindings[];.name=="P0_ROLLBACK_CHARACTER_ID" and .type=="plain_text" and .text==$character) and
             any(.result.resources.bindings[];.name=="P0_ROLLBACK_BATTLE_ID" and .type=="plain_text" and .text==$battle)'             "$RUNNER_TEMP/active-version.json" >/dev/null
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules" > "$RUNNER_TEMP/schedules.json"
          jq -e '.success==true and (.result.schedules|length)==0' "$RUNNER_TEMP/schedules.json" >/dev/null
          curl --fail --silent --show-error --max-time 20 "${{ steps.deploy.outputs.url }}?action=getGameConfig" | jq -e 'type=="object"' >/dev/null
          echo "Candidate source SHA, active version etag, sole Staging D1 binding, QA secret, fixture vars and empty cron verified."

      - name: Run fresh Actual D1 R01-R04 on exact Candidate
        working-directory: source
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          P0_WORKER_URL: ${{ steps.deploy.outputs.url }}
          P0_WORKER_NAME: ${{ steps.scope.outputs.worker }}
          P0_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          P0_QA_PLAYER_ID: ${{ steps.scope.outputs.player }}
          P0_QA_CHARACTER_ID: ${{ steps.scope.outputs.character }}
          P0_QA_BATTLE_ID: ${{ steps.scope.outputs.battle }}
          P0_QA_SESSION_ID: ${{ steps.scope.outputs.session }}
        run: node scripts/p0-candidate-actual-d1-qa.mjs

      - name: Upload immutable Candidate QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-candidate-actual-d1-evidence-${{ github.run_id }}
          path: source/artifacts/p0-candidate-actual-d1-evidence.json
          if-no-files-found: warn
          retention-days: 30
