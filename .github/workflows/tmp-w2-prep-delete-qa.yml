name: Temporary W2 prep deletion QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no W2 PREP references remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=.git 'W2-GUILD-DONATION-V1-PREP.md' .; then
            echo "Stale W2 PREP reference remains"
            exit 1
          fi
          echo "No W2 PREP references remain"
      - name: Confirm canonical Guild contract remains
        shell: bash
        run: |
          set -euo pipefail
          file='docs/GUILD-SYSTEM-V1.md'
          for token in             '0019_guild_donation_v1.sql'             'POST action=donateGuildItem'             'GET action=getGuildDonationHistory'             'donation_conflict'             'Atomic transaction order:'             'donationId'; do
            grep -Fq "$token" "$file"
          done
          echo "Canonical W2 Guild contract present"
