name: Temporary cleanup release QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Full tests
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Confirm removed names are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='\\b(?:cloudGetRecoveryStatus|cloudSyncItems|cloudSetInventorySlot|cloudSaveRunState|cloudSaveQuickSlots|cloudGetGuildProfile|loadAssetText|preloadAsset|responsiveMonsterVfxAnchor|craftSalvageRefund|removeJunkFromInventory|rollGachaPet|addPotionToInventory|removePotionFromInventory|unlockedSkills|buildTurnQueue|generateDropForMonster|FloatingQuickActions)\\b'
          paths=(src tests workers admin.html build.js r2-upload index.html)
          if [ -d scripts ]; then paths+=(scripts); fi
          if grep -R -n -P "$pattern" "${paths[@]}"; then
            echo "Removed function name reference found"
            exit 1
          fi
          echo "No removed function names found"
