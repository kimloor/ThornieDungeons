name: P0 PR #196 Build Only

on:
  push:
    branches:
      - fix/p0-battle-victory-authority-rebased-20261102
    paths:
      - .github/workflows/build-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    if: github.ref == 'refs/heads/fix/p0-battle-victory-authority-rebased-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated frontend (pass 1)
        run: |
          set -euo pipefail
          node build.js
          sha256sum index.html | awk '{print $1}' > /tmp/index-pass1.sha256
      - name: Verify deterministic build (pass 2)
        run: |
          set -euo pipefail
          node build.js
          sha256sum index.html | awk '{print $1}' > /tmp/index-pass2.sha256
          diff -u /tmp/index-pass1.sha256 /tmp/index-pass2.sha256
          cp /tmp/index-pass1.sha256 /tmp/index-build.sha256
      - name: Verify generated output and scope
        run: |
          set -euo pipefail
          test -s index.html
          git status --short
          changed="$(git status --short --untracked-files=no | awk '{print $2}' | sort)"
          test "$changed" = "index.html"
      - name: Upload generated frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-196-generated-index
          path: |
            index.html
            /tmp/index-build.sha256
          if-no-files-found: error
