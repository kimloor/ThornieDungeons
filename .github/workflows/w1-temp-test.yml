name: W1 temporary verification

on:
  push:
    branches:
      - "refactor/inventory-w1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused W1 tests
        run: |
          set -euo pipefail
          node --test tests/inventory-v2.test.js tests/navigation-settings.test.js tests/responsive-layout.test.js tests/build-syntax.test.js
