name: Deploy ThornieDungeons API

on:
  push:
    branches:
      - main
    paths:
      - "workers/thornie-dungeons-api.js"
      - "migrations/auto/**"
      - "wrangler.api.template.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thornie-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      WORKER_NAME: thornie-dungeons-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_ACCOUNT_ID"; exit 1; }
          wrangler whoami >/dev/null

      - name: Resolve D1 and build runtime Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail

          d1_json="$RUNNER_TEMP/d1-list.json"
          wrangler d1 list --json > "$d1_json"

          db_id="$CF_D1_DATABASE_ID"
          if [ -z "$db_id" ]; then
            db_count="$(jq 'length' "$d1_json")"
            if [ "$db_count" -ne 1 ]; then
              echo "CF_D1_DATABASE_ID is not set and the account has $db_count D1 databases; refusing to guess."
              exit 1
            fi
            db_id="$(jq -r '.[0].uuid // .[0].id // empty' "$d1_json")"
          fi

          db_name="$(jq -r --arg id "$db_id" '.[] | select((.uuid // .id // "") == $id) | .name' "$d1_json" | head -n1)"
          if [ -z "$db_id" ] || [ -z "$db_name" ] || [ "$db_name" = "null" ]; then
            echo "Unable to resolve the production D1 database safely."
            exit 1
          fi

          runtime_config="$GITHUB_WORKSPACE/.wrangler.api.runtime.jsonc"
          sed \
            -e "s/__D1_DATABASE_ID__/$db_id/g" \
            -e "s/__D1_DATABASE_NAME__/$db_name/g" \
            wrangler.api.template.jsonc > "$runtime_config"

          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "database_name=$db_name" >> "$GITHUB_OUTPUT"
          echo "runtime_config=$runtime_config" >> "$GITHUB_OUTPUT"
          echo "Resolved D1 database: $db_name"

      - name: Apply pending D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          if find migrations/auto -maxdepth 1 -type f -name '*.sql' -print -quit | grep -q .; then
            wrangler d1 migrations apply DB \
              --remote \
              --config "${{ steps.config.outputs.runtime_config }}"
          else
            echo "No automated D1 migrations to apply."
          fi

      - name: Deploy API Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy \
            --config "${{ steps.config.outputs.runtime_config }}" \
            --keep-vars

      - name: Verify deployment exists
        shell: bash
        run: |
          set -euo pipefail
          wrangler deployments list \
            --name "$WORKER_NAME" \
            --config "${{ steps.config.outputs.runtime_config }}" | head -n 40

      - name: Optional live smoke test
        if: ${{ vars.CF_API_SMOKE_URL != '' }}
        env:
          CF_API_SMOKE_URL: ${{ vars.CF_API_SMOKE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 "$CF_API_SMOKE_URL?action=getGameConfig")"
          test -n "$response"
          echo "Live API smoke test returned a response."

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## ThornieDungeons API deployment"
            echo ""
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- D1: \`${{ steps.config.outputs.database_name }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Migration lane: \`migrations/auto\`"
            echo "- Deploy source: \`workers/thornie-dungeons-api.js\`"
          } >> "$GITHUB_STEP_SUMMARY"
