name: W4 Seed Existing QA C9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/w4-seed-c9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global wrangler@4
      - name: Resolve production D1
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_D1_DATABASE_ID"
          wrangler whoami >/dev/null
          wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          db_name="$(jq -r --arg id "$CF_D1_DATABASE_ID" '.[] | select((.uuid // .id // "") == $id) | .name' "$RUNNER_TEMP/d1.json" | head -n1)"
          test -n "$db_name" && test "$db_name" != "null"
          runtime="$RUNNER_TEMP/w4-wrangler.jsonc"
          sed -e "s/__D1_DATABASE_ID__/$CF_D1_DATABASE_ID/g" -e "s/__D1_DATABASE_NAME__/$db_name/g" wrangler.api.template.jsonc > "$runtime"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - name: Preflight C9
        shell: bash
        run: |
          set -euo pipefail
          q="SELECT player_id,name FROM characters WHERE player_id='E2EW4C9' AND name IN ('C9-1','C9-2') ORDER BY name;"
          wrangler d1 execute DB --remote --config "${{ steps.config.outputs.runtime }}" --command "$q" --json > "$RUNNER_TEMP/pre.json"
          jq -e '.[0].results | map(.player_id + "/" + .name) == ["E2EW4C9/C9-1","E2EW4C9/C9-2"]' "$RUNNER_TEMP/pre.json" >/dev/null
      - name: Seed C9 only
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$RUNNER_TEMP/seed.sql" <<SQL
          UPDATE characters SET level=30,stat_points=29,unlocked_floor=20,gold=5000,updated_at='$now',last_active_at='$now'
          WHERE player_id='E2EW4C9' AND name='C9-1';
          UPDATE characters SET level=5,stat_points=4,unlocked_floor=5,gold=1000,updated_at='$now',last_active_at='$now'
          WHERE player_id='E2EW4C9' AND name='C9-2';

          DELETE FROM items
          WHERE player_id='E2EW4C9'
            AND character_id IN (SELECT character_id FROM characters WHERE player_id='E2EW4C9' AND name IN ('C9-1','C9-2'))
            AND item_id LIKE 'qa-%' AND slot_type='junk';

          INSERT INTO items
            (item_id,player_id,character_id,slot_type,equipped,inventory_slot,item_template_id,rarity,name,
             item_level,enhance_level,bound,quantity,atk,def,hp,mp,extra_json,created_at,updated_at)
          SELECT
            'qa-' || c.character_id || '-' || j.junk_id,
            c.player_id,c.character_id,'junk',0,'','','',
            CASE j.junk_id WHEN 'stone' THEN 'Stone' WHEN 'grass' THEN 'Grass' ELSE 'Wood' END,
            0,0,0,500,0,0,0,0,
            json_object('junkId',j.junk_id,'quantity',500),'$now','$now'
          FROM characters c
          CROSS JOIN (SELECT 'stone' junk_id UNION ALL SELECT 'grass' UNION ALL SELECT 'wood') j
          WHERE c.player_id='E2EW4C9' AND c.name='C9-1';
          SQL
          wrangler d1 execute DB --remote --config "${{ steps.config.outputs.runtime }}" --file "$RUNNER_TEMP/seed.sql"
      - name: Verify C9
        shell: bash
        run: |
          set -euo pipefail
          q="SELECT c.player_id,c.name,c.level,
             COALESCE(SUM(CASE WHEN i.slot_type='junk' AND json_extract(i.extra_json,'$.junkId') IN ('stone','grass','wood')
             THEN CAST(json_extract(i.extra_json,'$.quantity') AS INTEGER) ELSE 0 END),0) junk_qty
             FROM characters c LEFT JOIN items i ON i.character_id=c.character_id
             WHERE c.player_id='E2EW4C9' AND c.name IN ('C9-1','C9-2')
             GROUP BY c.player_id,c.character_id,c.name,c.level ORDER BY c.name;"
          wrangler d1 execute DB --remote --config "${{ steps.config.outputs.runtime }}" --command "$q" --json > "$RUNNER_TEMP/verify.json"
          jq -e '.[0].results as $r
            | ($r | map(select(.name=="C9-1" and .level==30 and .junk_qty==1500)) | length)==1
            and ($r | map(select(.name=="C9-2" and .level==5 and .junk_qty==0)) | length)==1' "$RUNNER_TEMP/verify.json" >/dev/null
          echo "C9 seed verified" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[0].results[] | "- \(.player_id)/\(.name): Lv\(.level), junk=\(.junk_qty)"' "$RUNNER_TEMP/verify.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- No Worker deploy / no migration" >> "$GITHUB_STEP_SUMMARY"
