name: Test PixelLab API secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-pixellab-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixellab-auth-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret is present
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN }}
        run: |
          if [ -z "$PXL_API_TOKEN" ]; then
            echo "::error::PXL_API_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
          echo "PXL_API_TOKEN is available to the workflow."

      - name: Test PixelLab authentication
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl --silent --show-error             --output /tmp/pixellab-balance.json             --write-out "%{http_code}"             --header "Authorization: Bearer $PXL_API_TOKEN"             "https://api.pixellab.ai/v2/balance")

          echo "PixelLab HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "PixelLab authentication succeeded."
            exit 0
          fi

          if [ "$HTTP_CODE" = "401" ]; then
            echo "::error::PixelLab rejected the token (HTTP 401)."
          else
            echo "::error::PixelLab API test failed with HTTP $HTTP_CODE."
          fi

          # Do not print the response body; keep account/token-related details out of logs.
          exit 1
