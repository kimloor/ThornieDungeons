name: Deploy Phaser frontend preview

on:
  push:
    branches:
      - "experiment/phaser-battlefield"
    paths:
      - "index.html"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-phaser-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thornie-phaser-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      WORKER_NAME: thorniedungeons-phaser-preview
      PREVIEW_URL: https://thorniedungeons-phaser-preview.ekqtjl.workers.dev

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: experiment/phaser-battlefield
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_ACCOUNT_ID"; exit 1; }
          wrangler whoami >/dev/null

      - name: Verify generated frontend is present
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo "Generated index.html is missing or empty"; exit 1; }
          grep -q "PhaserBattlefieldPrototype" index.html || {
            echo "Phaser prototype is not present in generated index.html"
            exit 1
          }

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy             --config wrangler.jsonc             --name "$WORKER_NAME"

      - name: Verify preview deployment
        shell: bash
        run: |
          set -euo pipefail
          wrangler deployments list             --name "$WORKER_NAME"             --config wrangler.jsonc | head -n 40

          response_headers="$(mktemp)"
          curl --fail --silent --show-error --max-time 30             --dump-header "$response_headers"             --output /dev/null             "$PREVIEW_URL/?phaserBattle=1"
          head -n 20 "$response_headers"
          rm -f "$response_headers"

      - name: Preview summary
        shell: bash
        run: |
          {
            echo "## Phaser frontend preview"
            echo ""
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- Branch: \`experiment/phaser-battlefield\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Preview: $PREVIEW_URL/?phaserBattle=1"
            echo "- Production Worker: **not modified**"
            echo "- Production main: **not modified**"
          } >> "$GITHUB_STEP_SUMMARY"
