name: W7 idle sword cache-bust

on:
  push:
    branches:
      - "feat/w7-hero-v5-runtime"
    paths:
      - ".github/workflows/w7-idle-sword-cachebust.yml"

permissions:
  contents: write

concurrency:
  group: thornie-w7-idle-sword-cachebust
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: assets
    steps:
      - name: Checkout W7 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create versioned Idle sword assets and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path("r2-upload")
          manifest_path=root/"manifest.json"
          manifest=json.loads(manifest_path.read_text())
          azure=manifest["assets"]["hero001"]["v5"]["g2"]["equipment"]["azure"]
          for frame in ("idle_01","idle_02","idle_03"):
              src=root/f"hero/v5/g2/equipment/azure/{frame}/sword.png"
              dst=root/f"hero/v5/g2/equipment/azure/{frame}/sword_w7_idle_v2.png"
              if not src.exists() or src.stat().st_size <= 10000:
                  raise SystemExit(f"source sword missing/transparent-sized: {src}")
              shutil.copy2(src,dst)
              azure["frames"][frame]["sword"]=f"hero/v5/g2/equipment/azure/{frame}/sword_w7_idle_v2.png"
          azure["idleSwordAssetRevision"]="w7_idle_v2"
          manifest_path.write_text(json.dumps(manifest,separators=(",",":"))+"\n")

          pub_path=root/"hero/v5/g2/equipment/azure/PUBLICATION.json"
          pub=json.loads(pub_path.read_text())
          pub["idleSwordAssetRevision"]="w7_idle_v2"
          note="Idle sword runtime paths use versioned w7_idle_v2 filenames to avoid stale transparent-placeholder caches."
          notes=pub.setdefault("runtimeNotes",[])
          if note not in notes: notes.append(note)
          pub_path.write_text(json.dumps(pub,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Upload versioned Idle swords + manifest to R2 and verify
        shell: bash
        run: |
          set -euo pipefail
          files=(
            r2-upload/hero/v5/g2/equipment/azure/idle_01/sword_w7_idle_v2.png
            r2-upload/hero/v5/g2/equipment/azure/idle_02/sword_w7_idle_v2.png
            r2-upload/hero/v5/g2/equipment/azure/idle_03/sword_w7_idle_v2.png
            r2-upload/hero/v5/g2/equipment/azure/PUBLICATION.json
            r2-upload/manifest.json
          )
          for file in "${files[@]}"; do
            key="${file#r2-upload/}"
            case "${file,,}" in
              *.png) type="image/png" ;;
              *.json) type="application/json" ;;
              *) exit 1 ;;
            esac
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --content-type "$type" --remote
            tmp="$(mktemp)"
            wrangler r2 object get "$R2_BUCKET/$key" --file "$tmp" --remote
            test "$(sha256sum "$file" | awk '{print $1}')" = "$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
          done
          echo "Uploaded and SHA-verified 5 Idle sword cache-bust object(s)."

      - name: Commit asset revision to W7 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/w7-idle-sword-cachebust.yml
          git add r2-upload/hero/v5/g2/equipment/azure r2-upload/manifest.json
          git commit -m "assets: version W7 Idle Azure sword paths"
          git push origin HEAD:feat/w7-hero-v5-runtime
