name: Build frontend branch

on:
  push:
    branches:
      - "experiment/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
    paths:
      - "src/**"
      - "head.html"
      - "tail.html"
      - "build.js"
      - "wrangler.jsonc"
      - ".github/workflows/build-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build generated frontend
        shell: bash
        run: |
          set -euo pipefail
          node build.js

      - name: Verify generated output scope
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html || {
            echo "index.html was not generated or is empty"
            exit 1
          }

          changed="$(git status --short)"
          echo "$changed"

          unexpected="$(
            git status --porcelain |
              awk '{print $2}' |
              grep -v '^index.html$' || true
          )"

          if [ -n "$unexpected" ]; then
            echo "Build changed unexpected file(s):"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated index when changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- index.html; then
            echo "Generated index.html already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: regenerate index.html [branch-build]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install Wrangler for Phaser preview
        if: github.ref_name == 'experiment/phaser-battlefield'
        run: npm install --global wrangler@4

      - name: Deploy isolated Phaser preview
        if: github.ref_name == 'experiment/phaser-battlefield'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: thorniedungeons-phaser-preview
          PREVIEW_URL: https://thorniedungeons-phaser-preview.ekqtjl.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CF_ACCOUNT_ID"; exit 1; }
          grep -q "PhaserBattlefieldPrototype" index.html || { echo "Phaser prototype missing from generated index.html"; exit 1; }
          wrangler whoami >/dev/null

          # Static assets are served from "."; Git metadata is not part of the site
          # and can exceed Workers' per-asset size limit.
          rm -rf .git

          wrangler deploy \
            --config wrangler.jsonc \
            --name "$WORKER_NAME"

          wrangler deployments list \
            --name "$WORKER_NAME" \
            --config wrangler.jsonc | head -n 40

          curl --fail --silent --show-error --max-time 30 \
            -H "Sec-Fetch-Mode: navigate" \
            --output /dev/null \
            "$PREVIEW_URL/?phaserBattle=1"

          echo "Preview verified: $PREVIEW_URL/?phaserBattle=1" >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Frontend branch build"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Command: \`node build.js\`"
            echo "- Generated file: \`index.html\`"
            echo "- Production main: **not targeted**"
          } >> "$GITHUB_STEP_SUMMARY"
