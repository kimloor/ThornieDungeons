name: Temporary W6 cutover QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: W6 focused regression
        run: >-
          node --test --test-concurrency=1
          tests/w6-v2-cutover.test.js
          tests/mail-claim-inventory-overflow.test.js
          tests/mythic-v2.test.js
          tests/raid-wings-v2.test.js
          tests/reward-v2.test.js
          tests/inventory-capacity-authority-followup.test.js
      - name: Full suite
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js
      - name: Shared module syntax
        run: node --check workers/modules/shared.js
      - name: Confirm retired acquisition paths are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --exclude-dir=.git --exclude='w6-v2-cutover.test.js' --exclude='tmp-w6-cutover-qa.yml' -E 'randomAzureItemDesc|AZURE_SET_DEFS|AZURE_TEST_SHOP_ITEMS|makeAzureTestShopItems|azureRandom' src workers
          echo "Legacy Azure acquisition identifiers absent"
