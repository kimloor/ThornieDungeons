name: Checkpoint hotfix QA

on:
  push:
    branches:
      - "fix/battle-checkpoint-invalid-dungeon-hotfix"
    paths:
      - "workers/thornie-dungeons-api.js"
      - "tests/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/checkpoint-hotfix-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js
      - name: Focused checkpoint regression
        run: >-
          node --test --test-concurrency=1
          tests/battle-persistence.test.js
          tests/save-reliability.test.js
          tests/dungeon-v2-foundation.test.js
          tests/dungeon-v2-skills.test.js
          tests/battle-core-parity.test.js
          tests/battle-core.test.js
          tests/arena-v2-w9-battle-core.test.js
      - name: Full test suite
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Build and generated-index equality
        shell: bash
        run: |
          set -euo pipefail
          node build.js
          git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check HEAD^ HEAD
