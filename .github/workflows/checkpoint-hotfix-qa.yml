name: Checkpoint hotfix QA

on:
  push:
    branches:
      - "fix/battle-checkpoint-invalid-dungeon-hotfix"
    paths:
      - "workers/thornie-dungeons-api.js"
      - "tests/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/checkpoint-hotfix-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker syntax
        run: node --check workers/thornie-dungeons-api.js

      - name: Battle persistence regression
        run: node --test --test-concurrency=1 tests/battle-persistence.test.js

      - name: Save reliability regression
        run: node --test --test-concurrency=1 tests/save-reliability.test.js

      - name: Dungeon V2 foundation regression
        run: node --test --test-concurrency=1 tests/dungeon-v2-foundation.test.js

      - name: Dungeon V2 skills regression
        run: node --test --test-concurrency=1 tests/dungeon-v2-skills.test.js

      - name: Battle Core parity regression
        run: node --test --test-concurrency=1 tests/battle-core-parity.test.js

      - name: Battle Core regression
        run: node --test --test-concurrency=1 tests/battle-core.test.js

      - name: Arena shared Battle Core regression
        run: node --test --test-concurrency=1 tests/arena-v2-w9-battle-core.test.js

      - name: Auth V2 standalone
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/auth-v2.test.js

      - name: Full suite group A1 - Admin
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/admin*.test.js

      - name: Arena isolate 1 - arena-v2-batch6a-lifecycle.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-batch6a-lifecycle.test.js

      - name: Arena isolate 2 - arena-v2-batch6a1-result-hud.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-batch6a1-result-hud.test.js

      - name: Arena isolate 3 - arena-v2-batch6a2-auto-revenge-speed.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-batch6a2-auto-revenge-speed.test.js

      - name: Arena isolate 4 - arena-v2-hub-r1-graphics.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-hub-r1-graphics.test.js

      - name: Arena isolate 5 - arena-v2-w9-battle-core.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-battle-core.test.js

      - name: Arena isolate 6 - arena-v2-w9-cleanup.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-cleanup.test.js

      - name: Arena isolate 7 - arena-v2-w9-combat.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-combat.test.js

      - name: Arena isolate 8 - arena-v2-w9-foundation.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-foundation.test.js

      - name: Arena isolate 9 - arena-v2-w9-match-lifecycle.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-match-lifecycle.test.js

      - name: Arena isolate 10 - arena-v2-w9-phaser.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-phaser.test.js

      - name: Arena isolate 11 - arena-v2-w9-schema.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-schema.test.js

      - name: Arena isolate 12 - arena-v2-w9-server-foundation.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-server-foundation.test.js

      - name: Arena isolate 13 - arena-v2-w9-settlement.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w9-settlement.test.js

      - name: Arena isolate 14 - arena-v2-w98-w99.test.js
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/arena-v2-w98-w99.test.js

      - name: Full suite group A3 - Auth clients
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/auth-client.test.js tests/auth-gameplay-callers.test.js

      - name: Full suite group B - Battle Combat Dungeon
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/battle*.test.js tests/combat*.test.js tests/dungeon*.test.js

      - name: Full suite group C - Economy Social Progression
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/empower*.test.js tests/enhancement*.test.js tests/guild*.test.js tests/hero*.test.js tests/inventory*.test.js tests/mail*.test.js tests/mythic*.test.js tests/pet*.test.js tests/raid*.test.js tests/reward*.test.js tests/run-state*.test.js tests/save-reliability.test.js tests/w5*.test.js tests/w6*.test.js

      - name: Full suite group D - Build UI Phaser Remaining
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/build*.test.js tests/cleanup*.test.js tests/navigation*.test.js tests/phaser*.test.js tests/responsive*.test.js tests/w7*.test.js tests/w8*.test.js tests/w9*.test.js

      - name: Build and generated-index equality
        shell: bash
        run: |
          set -euo pipefail
          node build.js
          git diff --exit-code -- index.html

      - name: Diff check
        run: git diff --check HEAD^ HEAD
