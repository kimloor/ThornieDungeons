name: Diagnose battle control syntax
on:
  push:
    branches: ["feat/w7-hero-v5-runtime"]
    paths: [".github/workflows/diag-battle-syntax.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check src/ui/components.js
