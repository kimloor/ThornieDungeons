name: Publish Hero V5 Azure runtime assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-hero-v5-azure.yml"

permissions:
  contents: write

concurrency:
  group: hero-v5-azure-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Azure package
        shell: bash
        env:
          AZURE_PACKAGE_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-537c-81fa-b9d7-c7eb62b0d0ac/raw?se=2026-09-26T14%3A59%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=6e76ed04-07e7-5682-9cff-247083a5bbdc&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T06%3A14%3A01Z&ske=2026-09-27T06%3A14%3A01Z&sks=b&skv=2026-02-06&sig=NdqS7dr1q/9rozSxLoKKKnFb36z9gUGBgLnRyG94yJY%3D"
          EXPECTED_SHA256: "2eff1aa89040058bf3883a49f87230e7eb377bc4df2e147d2bb2e9114859eaf1"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$AZURE_PACKAGE_URL" -o /tmp/HERO_V5_G2_AZURE_TEST.zip
          echo "$EXPECTED_SHA256  /tmp/HERO_V5_G2_AZURE_TEST.zip" | sha256sum -c -
          rm -rf /tmp/hero-v5-azure
          mkdir -p /tmp/hero-v5-azure
          unzip -q /tmp/HERO_V5_G2_AZURE_TEST.zip -d /tmp/hero-v5-azure

      - name: Validate approved package contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/hero-v5-azure/HERO_V5_G2_AZURE_TEST"
          test -f "$ROOT/VALIDATION.json"
          test -f "$ROOT/metadata/AZURE_FRAME_CONTRACT.json"
          test -f "$ROOT/SHA256SUMS.txt"
          count="$(find "$ROOT/azure" -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "56"
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          root="/tmp/hero-v5-azure/HERO_V5_G2_AZURE_TEST"
          with open(root+"/VALIDATION.json") as f:
              v=json.load(f)
          checks=v.get("checks",{})
          required=[
              "exactly_8_equipment_frame_folders",
              "exactly_56_equipment_frame_pngs",
              "rgba_768_transparent_no_canvas_edge_clipping",
              "base_wing_main_git_blob_matches",
              "all_locked_reference_copies_byte_identical",
              "torso_pants_opaque_core_coverage",
              "composites_exactly_match_declared_order",
              "sword_presence_matches_user_choice",
              "gif_frame_counts_correct",
              "wing_near_is_outermost",
              "hero_or_wing_pixels_redrawn",
              "runtime_interpolation_used",
          ]
          expected_false={"hero_or_wing_pixels_redrawn","runtime_interpolation_used"}
          for key in required:
              actual=checks.get(key)
              expected=False if key in expected_false else True
              if actual is not expected:
                  raise SystemExit(f"Validation mismatch {key}: {actual!r} != {expected!r}")
          PY

      - name: Stage Azure runtime assets and manifest contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/hero-v5-azure/HERO_V5_G2_AZURE_TEST"
          DEST="r2-upload/hero/v5/g2/equipment/azure"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$ROOT/azure/." "$DEST/"
          cp "$ROOT/metadata/AZURE_FRAME_CONTRACT.json" "$DEST/AZURE_FRAME_CONTRACT.json"
          cp "$ROOT/VALIDATION.json" "$DEST/SOURCE_VALIDATION.json"

          python3 - <<'PY'
          import json, pathlib
          frames=["idle_01","idle_02","idle_03","attack_01","attack_02","attack_03","death_01","death_02"]
          layers=["coverage_underlay","torso_armor","legs_boots","arm_rear","helmet","sword","arm_front"]
          prefix="hero/v5/g2/equipment/azure"
          publication={
              "status":"APPROVED_FOR_RUNTIME_PUBLICATION",
              "projectLeadApproved":True,
              "runtimeIntegrated":False,
              "sourcePackage":"HERO_V5_G2_AZURE_TEST.zip",
              "sourcePackageSha256":"2eff1aa89040058bf3883a49f87230e7eb377bc4df2e147d2bb2e9114859eaf1",
              "canvas":{"width":768,"height":768},
              "frameCount":8,
              "layerCountPerFrame":7,
              "totalLayerPngs":56,
              "frames":frames,
              "layerOrder":layers,
              "drawOrder":["wing_far","base","hair_back","hair_front",*layers,"wing_near"],
              "runtimeNotes":[
                  "Attack front arm/glove remains above sword for authored grip occlusion.",
                  "Idle and Death sword layers are intentionally transparent.",
                  "No runtime rotation or interpolation is required."
              ],
          }
          dest=pathlib.Path("r2-upload/hero/v5/g2/equipment/azure")
          (dest/"PUBLICATION.json").write_text(json.dumps(publication,indent=2)+"\n")

          manifest_path=pathlib.Path("r2-upload/manifest.json")
          manifest=json.loads(manifest_path.read_text())
          g2=manifest["assets"]["hero001"]["v5"]["g2"]
          equipment=g2.setdefault("equipment",{})
          equipment["azure"]={
              "approval":"approved",
              "runtimeIntegrated":False,
              "canvas":{"width":768,"height":768},
              "origin":{"x":0,"y":0},
              "sourcePackage":"HERO_V5_G2_AZURE_TEST.zip",
              "sourcePackageSha256":"2eff1aa89040058bf3883a49f87230e7eb377bc4df2e147d2bb2e9114859eaf1",
              "layerOrder":layers,
              "drawOrder":["wing_far","base","hair_back","hair_front",*layers,"wing_near"],
              "frames":{
                  frame:{layer:f"{prefix}/{frame}/{layer}.png" for layer in layers}
                  for frame in frames
              },
              "contract":f"{prefix}/AZURE_FRAME_CONTRACT.json",
              "sourceValidation":f"{prefix}/SOURCE_VALIDATION.json",
              "publication":f"{prefix}/PUBLICATION.json",
          }
          manifest_path.write_text(json.dumps(manifest,separators=(",",":"))+"\n")
          PY

          test "$(find "$DEST" -type f -name '*.png' | wc -l | tr -d ' ')" = "56"

      - name: Commit publication to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-hero-v5-azure.yml
          git add r2-upload/hero/v5/g2/equipment/azure r2-upload/manifest.json
          git commit -m "assets: publish approved Hero V5 G2 Azure runtime layers"
          git push origin HEAD:main
