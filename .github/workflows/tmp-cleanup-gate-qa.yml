name: Temporary cleanup-gate QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full tests
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Build
        run: node build.js
      - name: Generated index clean
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
