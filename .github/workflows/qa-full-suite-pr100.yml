name: Temporary Full Suite QA

on:
  push:
    branches:
      - "fix/pr95-followup-d1-budget-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: node build.js
      - name: Generated index check
        run: git diff --exit-code -- index.html
      - name: Diff check
        run: git diff --check
      - name: Full test suite
        run: node --test --test-concurrency=2 tests/*.test.js
